<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>NIULAI TAP / 牛来 Tap</title>
<style>
:root{--bg:#090a08;--fg:#f3efdf;--muted:#aaa897;--accent:#9fe14f;--accent2:#e5bd48;--panel:#11130f;--line:#2b3026}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.chuyin{--bg:#05070a;--fg:#eaffff;--muted:#7fa7a5;--accent:#53f1db;--accent2:#ff58c9;--panel:#071014;--line:#19383a}.app{width:min(1280px,calc(100% - 24px));margin:0 auto;padding:18px 0 30px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;padding:4px 2px 14px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:800}.title{font-size:clamp(28px,4.5vw,56px);line-height:.95;font-weight:900;letter-spacing:-.05em;margin:6px 0 0}.title span{font-size:.42em;color:var(--muted);font-weight:600;letter-spacing:.02em}.status{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill,.btn{font-size:11px;padding:8px 10px;border:1px solid var(--line);background:transparent;color:var(--fg)}.btn{cursor:pointer;background:var(--accent);color:#061005;border:0;font-weight:900}.stage{position:relative;height:min(62vh,650px);min-height:400px;margin-top:14px;border:1px solid var(--line);overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(159,225,79,.13),transparent 28%),linear-gradient(180deg,#0d100c,var(--bg))}body.chuyin .stage{background:radial-gradient(circle at 50% 45%,rgba(83,241,219,.12),transparent 25%),linear-gradient(180deg,#061219,#030507)}body.chuyin .stage:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 4px,rgba(83,241,219,.07) 5px 6px);pointer-events:none}.stage canvas{position:absolute;inset:0;width:100%;height:100%}.wordLayer{position:absolute;inset:0;pointer-events:none}.word{position:absolute;left:var(--x);top:var(--y);font-size:clamp(46px,10vw,150px);font-weight:1000;letter-spacing:-.08em;white-space:nowrap;transform:translate(-50%,-50%) scale(.2) rotate(var(--r));animation:pop var(--life) cubic-bezier(.16,.86,.25,1) forwards;text-shadow:0 0 28px color-mix(in srgb,var(--accent) 42%,transparent)}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(var(--r));filter:blur(8px)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05) rotate(var(--r));filter:blur(0)}72%{opacity:.95}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.32) rotate(calc(var(--r) + 8deg));filter:blur(1px)}}.center{position:absolute;left:50%;top:50%;width:132px;height:132px;transform:translate(-50%,-50%);border:1px solid var(--accent);border-radius:50%;box-shadow:0 0 60px rgba(159,225,79,.18);transition:.12s}.active .center{transform:translate(-50%,-50%) scale(1.16);background:rgba(159,225,79,.07)}body.chuyin .center{box-shadow:0 0 70px rgba(83,241,219,.2)}.cross:before,.cross:after{content:"";position:absolute;background:var(--accent);opacity:.45}.cross:before{width:1px;height:100%;left:50%;top:0}.cross:after{height:1px;width:100%;left:0;top:50%}.caption{position:absolute;left:16px;bottom:14px;z-index:3}.caption strong{display:block;color:var(--accent);font-size:13px;letter-spacing:.14em}.caption span{font-size:11px;color:var(--muted)}.keys{display:grid;grid-template-columns:repeat(10,minmax(48px,1fr));gap:7px;margin-top:12px;padding:12px;border:1px solid var(--line);background:var(--panel)}.key{min-height:64px;border:1px solid var(--line);background:#0e110d;color:var(--fg);display:flex;flex-direction:column;justify-content:space-between;padding:8px;cursor:pointer;user-select:none;transition:.08s}.chuyin .key{background:#071014}.key strong{font-size:18px}.key span{font-size:10px;color:var(--muted)}.key.on{transform:translateY(3px) scale(.985);background:var(--accent);color:#071006;border-color:transparent}.key.on span{color:#17331a}.footer{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:11px;margin-top:10px}.footer b{color:var(--fg)}@media(max-width:850px){.top{align-items:flex-start;flex-direction:column}.status{justify-content:flex-start}.keys{grid-template-columns:repeat(7,minmax(42px,1fr))}.stage{height:54vh}.footer{flex-direction:column}}@media(max-width:560px){.app{width:calc(100% - 14px)}.keys{grid-template-columns:repeat(5,minmax(42px,1fr));padding:8px}.key{min-height:58px}.stage{min-height:360px}}
</style>
</head>
<body>
<main class="app" id="app">
<header class="top">
<div><div class="eyebrow">PERSONAL A/V INSTRUMENT · PLAYABLE DEMO</div><h1 class="title">NIULAI TAP <span>/ 牛来 Tap</span></h1></div>
<div class="status"><span class="pill" id="modeLabel">NIULAI CORE</span><span class="pill"><b id="bpm">128</b> BPM</span><button class="btn" id="audioBtn">START AUDIO</button></div>
</header>
<section class="stage" id="stage"><canvas id="cv"></canvas><div class="wordLayer" id="words"></div><div class="center"><div class="cross"></div></div><div class="caption"><strong id="modeTitle">牛来 CORE</strong><span id="hint">A–Z 演奏 · TAB 切换「出音牛来」· SPACE Drop · ESC Reset</span></div></section>
<section class="keys" id="keys"></section>
<div class="footer"><span><b>PLAY FIRST.</b> 先按 Q / W / A / S / G / L。</span><span>公开版：浏览器合成人声 + 程序声音，不包含电影原始音频。</span></div>
</main>
<script>
const ORDER='QWERTYUIOPASDFGHJKLZXCVBNM'.split('');
const CFG={core:{title:'牛来 CORE',label:'NIULAI CORE',bpm:128,pitch:1.02,rate:.98,labels:{Q:'牛',W:'来',E:'牛来',R:'欢迎',T:'我的孩子',Y:'不一样',U:'一样',I:'勇敢',O:'将来',P:'今天',A:'KICK',S:'SNARE',D:'HAT',F:'CLAP',G:'BASS',H:'BASS+',J:'BELL',K:'PAD',L:'CHORD',Z:'哞',X:'咚',C:'哒',V:'啪',B:'啵',N:'长大',M:'DROP'}},chuyin:{title:'出音牛来',label:'CHUYIN NIULAI',bpm:150,pitch:1.7,rate:1.32,labels:{Q:'NIU',W:'LAI',E:'NIULAI',R:'WELCOME',T:'MY CHILD',Y:'DIFFERENT',U:'SAME',I:'BRAVE',O:'FUTURE',P:'TODAY',A:'KICK+',S:'SNARE+',D:'HAT+',F:'CLAP+',G:'BASS',H:'ARP',J:'BELL',K:'PAD',L:'CHORD',Z:'NI!',X:'LA!',C:'DONG!',V:'PA!',B:'POP!',N:'GROW',M:'DROP!'}}};
let mode='core',ac=null,master=null,energy=0,last={},chain={},down={},hold={};
const $=s=>document.querySelector(s),keys=$('#keys'),stage=$('#stage'),words=$('#words'),cv=$('#cv'),ctx=cv.getContext('2d');const particles=[];
function audio(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.58;master.connect(ac.destination)}if(ac.state==='suspended')ac.resume();$('#audioBtn').textContent='AUDIO ON'}
function osc(type,f,d=.16,g=.09){audio();const o=ac.createOscillator(),v=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.value=f;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.006);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(master);o.start(t);o.stop(t+d+.03)}
function noise(d=.1,g=.1,hp=1200){audio();const n=Math.max(1,Math.floor(ac.sampleRate*d)),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain(),t=ac.currentTime;s.buffer=b;f.type='highpass';f.frequency.value=hp;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(v).connect(master);s.start(t)}
function kick(){audio();const o=ac.createOscillator(),v=ac.createGain(),t=ac.currentTime;o.type='sine';o.frequency.setValueAtTime(mode==='chuyin'?150:122,t);o.frequency.exponentialRampToValueAtTime(42,t+.16);v.gain.setValueAtTime(.34,t);v.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(v).connect(master);o.start(t);o.stop(t+.2)}
function speak(t,c=1){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.pitch=Math.min(2,CFG[mode].pitch+(c-1)*.08);u.rate=Math.min(2,CFG[mode].rate+(c-1)*.07);u.volume=.75;const vs=speechSynthesis.getVoices(),zh=vs.find(v=>/zh|Chinese|Ting|Meijia|Xiaoxiao/i.test(v.lang+' '+v.name));if(zh)u.voice=zh;speechSynthesis.speak(u)}
function voiceText(k){const a={Q:'牛',W:'来',E:'牛来',R:'欢迎',T:'我的孩子',Y:'不一样',U:'一样',I:'勇敢',O:'将来',P:'今天',N:'长大'};return a[k]||CFG[mode].labels[k]}
function sound(k,c){if('QWERTYUIOP'.includes(k)){speak(voiceText(k),c);const i='QWERTYUIOP'.indexOf(k),base=mode==='chuyin'?440:220;osc(mode==='chuyin'?'square':'triangle',base*Math.pow(2,(i%5)/12),.13,.035);return}switch(k){case'A':kick();break;case'S':noise(.15,.15,1300);osc('triangle',170,.07,.05);break;case'D':noise(.05,.07,6000);break;case'F':noise(.04,.09,1500);setTimeout(()=>noise(.04,.055,1700),35);break;case'G':osc('sawtooth',55,.24,.09);osc('sine',27.5,.28,.08);break;case'H':osc('sawtooth',73.4,.22,.08);break;case'J':osc('sine',mode==='chuyin'?880:660,.5,.065);break;case'K':[110,165,220].forEach(f=>osc('sine',f,.85,.025));break;case'L':[196,233,294,349].forEach(f=>osc('triangle',f,.48,.03));break;case'Z':speak('哞',c);osc('square',330,.07,.04);break;case'X':osc('sine',120,.08,.1);break;case'C':osc('triangle',260,.08,.08);break;case'V':noise(.03,.1,400);break;case'B':osc('sine',760,.09,.07);break;case'N':speak('长大',c);osc('sawtooth',110,.2,.04);break;case'M':kick();noise(.11,.14,1000);osc('sawtooth',43.7,.3,.1);break}}
function hitCount(k){const n=performance.now();chain[k]=n-(last[k]||0)<290?Math.min((chain[k]||1)+1,6):1;last[k]=n;return chain[k]}
function label(k,c){let t=CFG[mode].labels[k];if(k==='Q'&&c>1)t=mode==='chuyin'?'NIU'.repeat(Math.min(c,4)):'牛'.repeat(Math.min(c,5));if(k==='W'&&c>1)t=mode==='chuyin'?'LAI'.repeat(Math.min(c,4)):'来'.repeat(Math.min(c,5));return t}
function word(t,c=1){const e=document.createElement('div');e.className='word';e.textContent=t;e.style.setProperty('--x',(18+Math.random()*64)+'%');e.style.setProperty('--y',(18+Math.random()*60)+'%');e.style.setProperty('--dx',((Math.random()-.5)*120)+'px');e.style.setProperty('--dy',(-35-Math.random()*90)+'px');e.style.setProperty('--r',((Math.random()-.5)*(mode==='chuyin'?20:8))+'deg');e.style.setProperty('--life',Math.max(.55,1.65-c*.11)+'s');words.appendChild(e);setTimeout(()=>e.remove(),2100)}
function burst(k,c){const r=cv.getBoundingClientRect(),cols=mode==='chuyin'?['#eaffff','#53f1db','#ff58c9','#7970ff']:['#f3efdf','#9fe14f','#e5bd48','#718c4b'];for(let i=0;i<Math.min(10+c*4+energy*8,40);i++)particles.push({x:r.width*(.25+Math.random()*.5),y:r.height*(.25+Math.random()*.5),vx:(Math.random()-.5)*(4+energy*7),vy:(Math.random()-.5)*(4+energy*7),life:1,d:.012+Math.random()*.018,s:2+Math.random()*(mode==='chuyin'?12:24),c:cols[(k.charCodeAt(0)+i)%cols.length]});if(particles.length>320)particles.splice(0,particles.length-320)}
function trigger(k){if(!ORDER.includes(k))return;audio();const c=hitCount(k);energy=Math.min(1,energy+.12+c*.035);stage.classList.add('active');const el=document.querySelector('[data-key="'+k+'"]');if(el)el.classList.add('on');word(label(k,c),c);burst(k,c);sound(k,c);down[k]=performance.now();clearTimeout(hold[k]);hold[k]=setTimeout(()=>{if(down[k]){word(label(k,c)+(mode==='chuyin'?'—HOLD':'——'),c+1);if('QWERTYUIOPN'.includes(k))osc(mode==='chuyin'?'sawtooth':'sine',mode==='chuyin'?220:110,.65,.03);energy=Math.min(1,energy+.18)}},480)}
function release(k){delete down[k];clearTimeout(hold[k]);const el=document.querySelector('[data-key="'+k+'"]');if(el)el.classList.remove('on');if(!document.querySelector('.key.on'))stage.classList.remove('active')}
function switchMode(){mode=mode==='core'?'chuyin':'core';document.body.classList.toggle('chuyin',mode==='chuyin');$('#modeLabel').textContent=CFG[mode].label;$('#modeTitle').textContent=CFG[mode].title;$('#bpm').textContent=CFG[mode].bpm;$('#hint').textContent=mode==='chuyin'?'出音牛来 MODE · A–Z PLAY · TAB 回到 CORE':'A–Z 演奏 · TAB 切换「出音牛来」· SPACE Drop · ESC Reset';build();word(CFG[mode].title,4)}
function reset(){energy=0;particles.length=0;words.innerHTML='';if('speechSynthesis'in window)speechSynthesis.cancel();stage.classList.remove('active');document.querySelectorAll('.key').forEach(e=>e.classList.remove('on'))}
function drop(){kick();sound('M',4);energy=1;word(mode==='chuyin'?'出音牛来!':'牛来!',5);ORDER.slice(0,10).forEach((k,i)=>setTimeout(()=>burst(k,3),i*25))}
function build(){keys.innerHTML='';ORDER.forEach(k=>{const b=document.createElement('button');b.className='key';b.dataset.key=k;b.innerHTML='<strong>'+k+'</strong><span>'+CFG[mode].labels[k]+'</span>';b.addEventListener('pointerdown',e=>{e.preventDefault();trigger(k)});b.addEventListener('pointerup',()=>release(k));b.addEventListener('pointerleave',()=>release(k));keys.appendChild(b)})}
function size(){const d=devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=Math.max(1,Math.floor(r.width*d));cv.height=Math.max(1,Math.floor(r.height*d));ctx.setTransform(d,0,0,d,0,0)}
function draw(){const r=cv.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.globalCompositeOperation='lighter';for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.988;p.vy*=.988;p.life-=p.d;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();if(mode==='chuyin')ctx.fillRect(p.x,p.y,p.s,p.s*.34);else{ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill()}if(p.life<=0)particles.splice(i,1)}ctx.globalAlpha=1;energy*=.987;requestAnimationFrame(draw)}
window.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();switchMode();return}if(e.key==='Escape'){reset();return}if(e.code==='Space'){e.preventDefault();if(!e.repeat)drop();return}const k=e.key.toUpperCase();if(ORDER.includes(k))trigger(k)});window.addEventListener('keyup',e=>release(e.key.toUpperCase()));window.addEventListener('resize',size);$('#audioBtn').addEventListener('click',audio);build();size();draw();
</script>
</body>
</html>
