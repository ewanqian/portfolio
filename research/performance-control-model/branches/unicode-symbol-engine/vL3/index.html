<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>◌ ● ➜ ↻ ╳ ✦ ⊙ ↶</title>
<style>
:root{color-scheme:dark;background:#050505}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}.app{position:fixed;inset:0;overflow:hidden;background:#050505}.stage,.gl,.hud{position:absolute;inset:0;width:100%;height:100%}.gl,.hud{display:block;touch-action:none}.hud{pointer-events:none}.dock{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:5px;padding:5px;border:1px solid rgba(255,255,255,.13);background:rgba(4,4,4,.72);backdrop-filter:blur(12px);z-index:5}.dock button{width:38px;height:34px;padding:0;border:1px solid rgba(255,255,255,.15);background:#080808;color:#e9e9e3;font:700 17px ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}.dock button.on,.dock button:hover{background:#efefe9;color:#050505}.stageMode{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;z-index:2147483647!important;background:#050505!important}.stageMode .dock{opacity:.12}.stageMode .dock:hover{opacity:1}@media(max-width:700px){.dock{left:8px;right:8px;transform:none;justify-content:center}.dock button{flex:0 0 38px}}
</style>
</head>
<body>
<main id="app" class="app" tabindex="0">
<section id="stage" class="stage">
<canvas id="gl" class="gl"></canvas>
<canvas id="hud" class="hud"></canvas>
<div class="dock">
<button id="play">▶</button>
<button id="auto">∞</button>
<button id="links">⌁</button>
<button id="full">⤢</button>
<button id="panic">⊘</button>
</div>
</section>
</main>
<script src="./core.js"></script>
<script src="./atlas-fix.js"></script>
<script src="./audio.js"></script>
<script src="./view.js"></script>
</body>
</html>
