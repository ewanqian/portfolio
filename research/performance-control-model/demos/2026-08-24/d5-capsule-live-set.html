<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D5 — Prepared Capsule Live Set</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#050505;color:#eee}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px}.tag{font-size:11px;letter-spacing:.16em;color:#808080}.status{font:11px ui-monospace,monospace;color:#aaa}.stage{height:500px;border:1px solid #282828;background:#020202;margin-top:10px;position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block}.hud{position:absolute;left:12px;top:12px;font:11px ui-monospace,monospace;color:#aaa;line-height:1.6;background:#070707c9;border:1px solid #222;padding:7px 9px}.pads{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:9px}.pad{min-height:78px;border:1px solid #303030;background:#101010;color:#eee;cursor:pointer;text-align:left;padding:9px}.pad strong{font:600 13px ui-monospace,monospace;display:block}.pad span{font-size:10px;color:#888;display:block;margin-top:5px;line-height:1.4}.pad.pending{border-color:#777}.pad.flash{background:#2c2c2c}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:8px}button{min-height:44px;border:1px solid #333;background:#131313;color:#eee;font:600 11px ui-monospace,monospace;cursor:pointer}.hint{font-size:12px;line-height:1.55;color:#999;margin-top:10px}@media(max-width:800px){.pads{grid-template-columns:repeat(4,1fr)}.controls{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap" id="app" tabindex="0"><div class="top"><div><div class="tag">PERFORMANCE CONTROL MODEL / D5</div><h1>Prepared Capsule Live Set</h1></div><div class="status" id="status">START AUDIO</div></div><div class="stage"><canvas id="c"></canvas><div class="hud" id="hud">120 BPM<br>quantize 1/8<br>capsules 0</div></div><div class="pads" id="pads"></div><div class="controls"><button id="start">START / RESET</button><button id="ground">GROUND ON</button><button id="auto">AUTO PLAY 36s</button><button id="thin">THIN OUT</button><button id="panic">CLEAR / RELEASE</button></div><div class="hint">这不是 Touch:waves 的复制品，而是验证它的技术语言：每个键调用一段已经准备好的 3–5 秒音乐结构 + 同长度视觉行为。所有 capsule 使用同一 BPM、同一调性与频谱预算，所以可以自由叠加。键盘：A S D F J K L ;。先 START，再随便按；故意乱按也应该还能像一个 Set。</div></main><script>
const BPM=120,BEAT=60/BPM,Q=BEAT/2;let ac=null,origin=0,ground=true,groundTimer=null,lastGround=-1,voices=0,visuals=[],autoTimers=[];const MAX_VOICES=18,$=s=>document.querySelector(s),c=$('#c'),ctx=c.getContext('2d'),pads=$('#pads'),hud=$('#hud'),status=$('#status');
const keys=['a','s','d','f','j','k','l',';'];
const C=[
 {name:'ROUTE',dur:8,role:'pulse path',kind:'route',events:[[0,'kick'],[1,50,.18,.08],[2,53,.16,.07],[3,57,.18,.07],[4,'kick'],[5,53,.16,.07],[6,60,.20,.06],[7,57,.18,.06]]},
 {name:'FIELD',dur:8,role:'low harmonic field',kind:'field',events:[[0,38,1.7,.055],[0,45,1.7,.035],[2,41,1.4,.045],[4,38,1.8,.055],[4,48,1.7,.03],[6,45,1.2,.04]]},
 {name:'ORBIT',dur:6,role:'circular high phrase',kind:'orbit',events:[[0,69,.18,.04],[.5,72,.13,.035],[1.5,74,.18,.04],[2,77,.20,.035],[3,72,.16,.035],[4,81,.22,.03],[5,77,.18,.03]]},
 {name:'REWIND',dur:8,role:'descending memory',kind:'rewind',events:[[0,74,.28,.04],[1,72,.28,.04],[2,69,.32,.045],[3,65,.36,.05],[4,62,.40,.055],[5.5,57,.55,.055],[7,53,.60,.045]]},
 {name:'CELLS',dur:6,role:'syncopated cells',kind:'cells',events:[[0,'noise'],[.5,65,.10,.035],[1.5,'noise'],[2,69,.12,.04],[2.5,72,.10,.035],[3.5,'noise'],[4.5,69,.12,.035],[5,77,.10,.03]]},
 {name:'PARTITION',dur:8,role:'staggered chord blocks',kind:'partition',events:[[0,50,.9,.04],[0,57,.9,.028],[2,53,.8,.04],[2,60,.8,.028],[4,45,1.1,.04],[4,53,1.1,.025],[6,48,.9,.04],[6,57,.9,.025]]},
 {name:'SCAN',dur:7,role:'spectral scan',kind:'scan',events:[[0,62,.13,.03],[.75,65,.13,.03],[1.5,69,.13,.03],[2.25,72,.13,.03],[3,74,.13,.03],[3.75,77,.13,.03],[4.5,81,.13,.025],[5.25,84,.16,.022],[6,77,.30,.025]]},
 {name:'DROP',dur:8,role:'impact and residue',kind:'drop',events:[[0,'kick'],[0,38,.7,.07],[2,'kick'],[2,45,.6,.05],[4,'noise'],[4,50,.9,.045],[6,53,.8,.04],[7,57,.45,.035]]}
];
C.forEach((p,i)=>{const b=document.createElement('button');b.className='pad';b.innerHTML=`<strong>${keys[i].toUpperCase()} · ${p.name}</strong><span>${p.role}<br>${(p.dur*BEAT).toFixed(1)} sec capsule</span>`;b.onclick=()=>trigger(i);pads.appendChild(b)});
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
async function start(){if(!ac)ac=new(AudioContext||webkitAudioContext)();if(ac.state==='suspended')await ac.resume();origin=ac.currentTime+.08;visuals=[];voices=0;autoTimers.forEach(clearTimeout);autoTimers=[];if(groundTimer)clearInterval(groundTimer);lastGround=-1;groundTimer=setInterval(scheduleGround,20);status.textContent='RUNNING · PREPARED SET';}
function nextGrid(){const now=ac.currentTime;return origin+Math.ceil((now-origin)/Q)*Q}
function trigger(i){if(!ac||ac.state!=='running')return;const startAt=nextGrid(),p=C[i],delay=Math.max(0,(startAt-ac.currentTime)*1000),button=pads.children[i];button.classList.add('pending');setTimeout(()=>{button.classList.remove('pending');button.classList.add('flash');setTimeout(()=>button.classList.remove('flash'),150)},delay);p.events.forEach(e=>{const t=startAt+e[0]*BEAT;if(e[1]==='kick')kick(t,.22);else if(e[1]==='noise')noise(t,.17,.022);else note(e[1],t,e[2],e[3],i)});visuals.push({kind:p.kind,start:startAt,end:startAt+p.dur*BEAT,seed:Math.random(),i});status.textContent=`${p.name} · COMMIT ${(startAt-origin).toFixed(2)}s`;}
function midi(n){return 440*Math.pow(2,(n-69)/12)}
function note(n,t,d=.2,gain=.04,idx=0){if(voices>=MAX_VOICES)return;voices++;const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type=['sine','sawtooth','triangle','square'][idx%4];o.frequency.value=midi(n);f.type='lowpass';f.frequency.value=800+idx*380;f.Q.value=2;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(f).connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.04);o.onended=()=>voices=Math.max(0,voices-1)}
function kick(t,gain=.2){if(voices>=MAX_VOICES)return;voices++;const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(145,t);o.frequency.exponentialRampToValueAtTime(46,t+.1);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.17);o.onended=()=>voices=Math.max(0,voices-1)}
function noise(t,d=.12,gain=.02){if(voices>=MAX_VOICES)return;voices++;const n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=ac.createBufferSource(),bp=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=1.2;g.gain.value=gain;s.connect(bp).connect(g).connect(ac.destination);s.start(t);s.stop(t+d);s.onended=()=>voices=Math.max(0,voices-1)}
function scheduleGround(){if(!ac||!ground)return;const s=Math.floor((ac.currentTime-origin)/Q);if(s<0||s===lastGround)return;for(let k=lastGround+1;k<=s;k++){const i=((k%8)+8)%8,t=origin+k*Q;if(i===0||i===4)kick(t,.09);if(i%2===1)noise(t,.035,.006);if(i===0){note(38,t,BEAT*1.8,.018,1);note(45,t,BEAT*1.7,.011,2)}}lastGround=s}
$('#start').onclick=start;$('#ground').onclick=e=>{ground=!ground;e.target.textContent=`GROUND ${ground?'ON':'OFF'}`};$('#panic').onclick=()=>{visuals=[];autoTimers.forEach(clearTimeout);autoTimers=[];status.textContent='CLEAR / RELEASE'};$('#thin').onclick=()=>{visuals=visuals.slice(-2);status.textContent='THIN OUT · KEEP LAST 2'};
$('#auto').onclick=()=>{autoTimers.forEach(clearTimeout);autoTimers=[];status.textContent='AUTO SET · 36s';const seq=[[0,0],[1,4500],[4,8500],[2,12000],[5,16500],[6,20500],[7,25000],[3,30000]];seq.forEach(([i,ms])=>autoTimers.push(setTimeout(()=>trigger(i),ms)))};
$('#app').addEventListener('keydown',e=>{if(e.repeat)return;const i=keys.indexOf(e.key.toLowerCase());if(i>=0)trigger(i)});
function life(v,now){return Math.max(0,Math.min(1,(now-v.start)/(v.end-v.start)))}
function env(p){return p<.12?p/.12:p>.72?(1-p)/.28:1}
function drawVisual(v,p,w,h,t){const a=Math.max(0,env(p));ctx.globalAlpha=a*.72;ctx.strokeStyle='#d7d7d7';ctx.fillStyle='#d7d7d7';ctx.lineWidth=1;const s=v.seed,i=v.i;if(v.kind==='route'){ctx.beginPath();for(let k=0;k<9;k++){const x=w*(.08+k*.105),y=h*(.5+Math.sin(k*.9+t*2+s*5)*.16*a);k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();const x=w*(.08+p*.84);ctx.fillRect(x,h*.5-5,10,10)}else if(v.kind==='field'){for(let k=0;k<16;k++){const y=h*(k+1)/17;ctx.beginPath();ctx.moveTo(0,y+Math.sin(t*.6+k)*20*a);ctx.lineTo(w,y-Math.sin(t*.4+k)*20*a);ctx.stroke()}}else if(v.kind==='orbit'){for(let k=0;k<6;k++){const r=35+k*28+p*25;ctx.beginPath();ctx.arc(w*.5,h*.5,r,0,Math.PI*2);ctx.stroke();const an=t*(.8+k*.11)+k;ctx.fillRect(w*.5+Math.cos(an)*r-3,h*.5+Math.sin(an)*r-3,6,6)}}else if(v.kind==='rewind'){for(let k=0;k<10;k++){const xx=w*(1-p*.8)-k*22,yy=h*(.2+k*.06)+Math.sin(t*2+k)*8;ctx.strokeRect(xx,yy,70+k*8,30+k*3)}}else if(v.kind==='cells'){for(let k=0;k<30;k++){const col=k%10,row=Math.floor(k/10),q=(Math.sin(t*3+k+s*10)+1)/2;ctx.globalAlpha=a*(.12+q*.48);ctx.fillRect(w*.1+col*w*.08,h*.28+row*54,7+q*17,7+q*17)}}else if(v.kind==='partition'){for(let k=0;k<8;k++){const xx=w*k/8,hh=h*(.2+.5*((k+i)%3)/3)*a;ctx.fillRect(xx+4,h*.5-hh/2,w/8-8,hh)}}else if(v.kind==='scan'){const xx=w*p;ctx.fillRect(xx,0,2,h);for(let k=0;k<12;k++){ctx.globalAlpha=a*(1-k/12)*.4;ctx.fillRect(xx-k*18,0,1,h)}}else if(v.kind==='drop'){const r=(1-p)*Math.min(w,h)*.34+10;ctx.beginPath();ctx.arc(w*.5,h*.5,r,0,Math.PI*2);ctx.stroke();for(let k=0;k<20;k++){const an=k/20*Math.PI*2+s*4,rr=p*Math.min(w,h)*.55;ctx.fillRect(w*.5+Math.cos(an)*rr,h*.5+Math.sin(an)*rr,3,3)}}ctx.globalAlpha=1}
function draw(){const w=c.clientWidth,h=c.clientHeight,t=performance.now()/1000;ctx.fillStyle='rgba(2,2,2,.20)';ctx.fillRect(0,0,w,h);if(ac){const now=ac.currentTime;visuals=visuals.filter(v=>now<v.end+.02);for(const v of visuals){const p=life(v,now);drawVisual(v,p,w,h,t)}hud.innerHTML=`${BPM} BPM<br>quantize 1/8<br>capsules ${visuals.length}<br>voices ${voices}/${MAX_VOICES}`}requestAnimationFrame(draw)}draw();
</script></body></html>
