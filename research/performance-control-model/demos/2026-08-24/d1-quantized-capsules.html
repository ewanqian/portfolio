<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D1 — Quantized Capsules</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#080808;color:#f4f4f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:14px}.tag{font-size:12px;letter-spacing:.14em;color:#888}.status{font:12px ui-monospace,monospace;color:#aaa}.transport{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.m{border:1px solid #262626;padding:10px}.m span{display:block;font-size:10px;color:#777}.m strong{font:18px ui-monospace,monospace}.stage{height:min(50vw,500px);min-height:330px;border:1px solid #292929;background:#040404}canvas{display:block;width:100%;height:100%}.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}button{min-height:66px;border:1px solid #333;background:#131313;color:#fff;font:600 13px ui-monospace,monospace;cursor:pointer}.pending{outline:2px solid #777}.log{margin-top:12px;border-top:1px solid #222;padding-top:10px;font:12px ui-monospace,monospace;color:#aaa;min-height:70px;white-space:pre-wrap}.hint{font-size:13px;color:#aaa;line-height:1.5;margin-top:12px}@media(max-width:650px){.pads,.transport{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap" id="app" tabindex="0">
<div class="top"><div><div class="tag">PERFORMANCE CONTROL MODEL / D1</div><h1>Quantized Audiovisual Capsules</h1></div><div id="status" class="status">CLICK START</div></div>
<div class="transport"><div class="m"><span>BPM</span><strong>120</strong></div><div class="m"><span>BEAT</span><strong id="beat">0</strong></div><div class="m"><span>BAR</span><strong id="bar">0</strong></div><div class="m"><span>PENDING</span><strong id="pending">0</strong></div></div>
<div class="stage"><canvas id="c"></canvas></div>
<div class="pads"><button id="start">START / RESET</button><button data-i="0">A · PULSE CELL</button><button data-i="1">S · LOW CELL</button><button data-i="2">D · HIGH CELL</button></div>
<div class="pads" style="grid-template-columns:1fr 1fr 1fr 1fr"><button data-i="3">F · TEXTURE CELL</button><button id="q8">GRID · 1/8</button><button id="q4">GRID · 1/4</button><button id="panic">PANIC</button></div>
<div class="log" id="log">No events yet.</div><div class="hint">测试：故意在拍点前后乱按 A/S/D/F。按钮会先进入 pending，再落到统一 Web Audio 时间网格。看“请求时间”和“执行时间”的差值，同时听结果是否仍然稳定。</div>
</main><script>
const BPM=120,beatDur=60/BPM;let grid=beatDur/2,ac=null,origin=0,timer=null,queue=[],visual=[];const $=s=>document.querySelector(s),canvas=$('#c'),ctx=canvas.getContext('2d'),status=$('#status'),log=$('#log');
function resize(){let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
async function ensure(){if(!ac)ac=new (AudioContext||webkitAudioContext)();if(ac.state==='suspended')await ac.resume();}
function nextGrid(t){return origin+Math.ceil((t-origin)/grid)*grid}
function synth(i,t){const master=ac.createGain();master.gain.setValueAtTime(.0001,t);master.gain.exponentialRampToValueAtTime([.09,.16,.07,.08][i],t+.01);master.gain.exponentialRampToValueAtTime(.0001,t+[.28,.6,.16,.8][i]);master.connect(ac.destination);if(i===3){const len=Math.floor(ac.sampleRate*.5),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let k=0;k<len;k++)d[k]=(Math.random()*2-1)*(1-k/len);const s=ac.createBufferSource();s.buffer=b;s.connect(master);s.start(t);s.stop(t+.5);return}const o=ac.createOscillator();o.type=['square','sine','triangle','sawtooth'][i];o.frequency.setValueAtTime([220,73.42,880,330][i],t);if(i===0)o.frequency.exponentialRampToValueAtTime(110,t+.12);o.connect(master);o.start(t);o.stop(t+1)}
function request(i){if(!ac)return;const req=ac.currentTime,exec=nextGrid(req+.005);queue.push({i,req,exec});document.querySelector(`[data-i="${i}"]`).classList.add('pending');updatePending();}
function scheduler(){if(!ac)return;const now=ac.currentTime,horizon=now+.12;for(const e of queue.filter(x=>!x.scheduled&&x.exec<=horizon)){e.scheduled=true;synth(e.i,e.exec);setTimeout(()=>fireVisual(e),Math.max(0,(e.exec-ac.currentTime)*1000));}queue=queue.filter(e=>!(e.scheduled&&e.exec<now-.25));updatePending();}
function fireVisual(e){document.querySelector(`[data-i="${e.i}"]`).classList.remove('pending');visual.push({i:e.i,born:performance.now(),life:1});const delta=(e.exec-e.req)*1000;log.textContent=`last: capsule ${e.i+1}\nrequest → execute: +${delta.toFixed(1)} ms\ngrid: ${(grid/beatDur===.5?'1/8':'1/4')} · audio time ${e.exec.toFixed(3)}s`}
function updatePending(){pending.textContent=String(queue.filter(e=>!e.scheduled).length)}
async function start(){await ensure();origin=ac.currentTime+.08;queue=[];visual=[];status.textContent='RUNNING · AUDIO CLOCK AUTHORITY';if(timer)clearInterval(timer);timer=setInterval(scheduler,25)}
$('#start').onclick=start;$('#panic').onclick=()=>{queue=[];visual=[];status.textContent='PANIC / QUEUE CLEARED';document.querySelectorAll('[data-i]').forEach(b=>b.classList.remove('pending'));updatePending()};$('#q8').onclick=()=>grid=beatDur/2;$('#q4').onclick=()=>grid=beatDur;document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>request(+b.dataset.i));
$('#app').addEventListener('keydown',e=>{if(e.repeat)return;let m={a:0,s:1,d:2,f:3}[e.key.toLowerCase()];if(m!==undefined)request(m)});
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.fillStyle='#040404';ctx.fillRect(0,0,w,h);if(ac){const pos=Math.max(0,ac.currentTime-origin),beatN=Math.floor(pos/beatDur),barN=Math.floor(beatN/4);beat.textContent=String((beatN%4)+1);bar.textContent=String(barN+1);const phase=(pos%beatDur)/beatDur;ctx.strokeStyle='#222';for(let i=0;i<4;i++){let x=w*(i/4);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}ctx.strokeStyle='#eee';ctx.beginPath();ctx.moveTo(phase*w,0);ctx.lineTo(phase*w,h);ctx.stroke()}visual=visual.filter(v=>(v.life-=.018)>0);for(const v of visual){const x=[.2,.4,.6,.8][v.i]*w,y=h*.5,r=(1-v.life)*Math.min(w,h)*.38+16;ctx.globalAlpha=v.life;ctx.strokeStyle='#eee';ctx.lineWidth=1+v.i*.5;ctx.beginPath();if(v.i===3)ctx.rect(x-r*.6,y-r*.6,r*1.2,r*1.2);else ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}requestAnimationFrame(draw)}draw();
</script></body></html>
