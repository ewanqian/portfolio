<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D3 — Shared State A/V</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#080808;color:#f3f3f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px}.tag{font-size:12px;letter-spacing:.14em;color:#888}.status{font:12px ui-monospace,monospace;color:#aaa}.stage{height:430px;border:1px solid #292929;background:#050505;margin-top:12px}canvas{width:100%;height:100%;display:block}.states,.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}button{min-height:52px;border:1px solid #333;background:#141414;color:#fff;cursor:pointer;font:600 13px ui-monospace,monospace}.active{background:#2a2a2a;border-color:#888}.read{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.r{border-top:1px solid #222;padding-top:8px}.r span{font-size:10px;color:#777;display:block}.r strong{font:18px ui-monospace,monospace}.hint{font-size:13px;color:#aaa;line-height:1.5;margin-top:12px}@media(max-width:700px){.states,.actions,.read{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap" id="app" tabindex="0"><div class="top"><div><div class="tag">PERFORMANCE CONTROL MODEL / D3</div><h1>Shared State A/V</h1></div><div class="status" id="status">CLICK START</div></div><div class="stage"><canvas id="c"></canvas></div><div class="states"><button id="start">START / RESET</button><button data-state="OPEN">1 · OPEN</button><button data-state="BUILD">2 · BUILD</button><button data-state="BREAK">3 · BREAK</button></div><div class="actions"><button data-a="ADD">A · ADD</button><button data-a="HOLD">S · HOLD</button><button data-a="REMOVE">D · REMOVE</button><button data-a="RELEASE">F · RELEASE</button></div><div class="read"><div class="r"><span>STATE</span><strong id="state">OPEN</strong></div><div class="r"><span>ENERGY</span><strong id="energy">0.20</strong></div><div class="r"><span>DENSITY</span><strong id="density">0.15</strong></div><div class="r"><span>MEMORY</span><strong id="memory">0</strong></div></div><div class="hint">测试重点：同一个 ADD 在 OPEN / BUILD / BREAK 中不做同样的事。声音和视觉读取同一 State，但不是简单 1:1 音量→大小。按 1/2/3 切状态，A/S/D/F 做高层动作。</div></main><script>
const $=s=>document.querySelector(s),canvas=$('#c'),ctx=canvas.getContext('2d');let ac=null,mode='OPEN',energy=.2,density=.15,memory=0,hold=false,particles=[],pulses=[];const status=$('#status');
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
async function start(){if(!ac)ac=new(AudioContext||webkitAudioContext)();if(ac.state==='suspended')await ac.resume();mode='OPEN';energy=.2;density=.15;memory=0;hold=false;particles=[];pulses=[];status.textContent='RUNNING · SHARED STATE';refresh()}
function tone(f,d,g=.08,type='sine'){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function action(a){if(!ac)return;if(a==='ADD'){if(mode==='OPEN'){energy=Math.min(.55,energy+.08);density=Math.min(.35,density+.04);tone(220,.38,.07,'sine');spawn(2)}if(mode==='BUILD'){energy=Math.min(1,energy+.14);density=Math.min(.9,density+.12);tone(440,.16,.08,'square');setTimeout(()=>tone(660,.12,.05,'triangle'),90);spawn(8)}if(mode==='BREAK'){memory++;energy=Math.max(.08,energy-.06);density=Math.max(.04,density-.05);tone(110,.65,.05,'sine');pulses.push({life:1,soft:true})}}if(a==='REMOVE'){energy=Math.max(.05,energy-.12);density=Math.max(.03,density-.14);particles.splice(0,Math.ceil(particles.length*.35));tone(82,.3,.06)}if(a==='HOLD'){hold=!hold;tone(330,.12,.04,'triangle')}if(a==='RELEASE'){energy=.12;density=.08;hold=false;memory++;tone(147,.8,.06,'sine');pulses.push({life:1,soft:true});particles=[]}refresh()}
function spawn(n){const w=canvas.clientWidth,h=canvas.clientHeight;for(let i=0;i<n;i++)particles.push({x:w*(.2+Math.random()*.6),y:h*(.2+Math.random()*.6),vx:(Math.random()-.5)*(mode==='BUILD'?3:1),vy:(Math.random()-.5)*(mode==='BUILD'?3:1),life:1})}
function setState(s){mode=s;if(s==='OPEN'){energy=Math.min(energy,.45);density=Math.min(density,.35)}if(s==='BUILD'){energy=Math.max(energy,.45);density=Math.max(density,.35)}if(s==='BREAK'){energy=Math.min(energy,.35);density=Math.min(density,.25)}refresh()}
function refresh(){state.textContent=mode;energyEl.textContent=energy.toFixed(2);densityEl.textContent=density.toFixed(2);memoryEl.textContent=memory;document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('active',b.dataset.state===mode))}
const state=$('#state'),energyEl=$('#energy'),densityEl=$('#density'),memoryEl=$('#memory');$('#start').onclick=start;document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>setState(b.dataset.state));document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>action(b.dataset.a));$('#app').addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k==='1')setState('OPEN');if(k==='2')setState('BUILD');if(k==='3')setState('BREAK');const a={a:'ADD',s:'HOLD',d:'REMOVE',f:'RELEASE'}[k];if(a)action(a)});
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.fillStyle='#050505';ctx.fillRect(0,0,w,h);const t=performance.now()/1000;if(mode==='OPEN'){ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.beginPath();ctx.arc(w*.5,h*.5,60+Math.sin(t)*12,0,Math.PI*2);ctx.stroke()}if(mode==='BUILD'){ctx.strokeStyle='#4f4f4f';for(let i=0;i<8;i++){const y=h*(i+1)/9;ctx.beginPath();ctx.moveTo(0,y+Math.sin(t*3+i)*14*energy);ctx.lineTo(w,y-Math.sin(t*2+i)*14*energy);ctx.stroke()}}if(mode==='BREAK'){ctx.strokeStyle='#303030';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(w*.5,h*.5,50+i*45+Math.sin(t+i)*6,0,Math.PI*2);ctx.stroke()}}for(const p of particles){p.x+=p.vx*(hold?.2:1);p.y+=p.vy*(hold?.2:1);p.life-=hold?.001:.005;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#ddd';ctx.fillRect(p.x,p.y,2+energy*5,2+energy*5)}particles=particles.filter(p=>p.life>0).slice(-Math.round(20+density*180));for(const q of pulses){q.life-=.012;ctx.globalAlpha=Math.max(0,q.life);ctx.strokeStyle='#ddd';ctx.beginPath();ctx.arc(w*.5,h*.5,(1-q.life)*260,0,Math.PI*2);ctx.stroke()}pulses=pulses.filter(q=>q.life>0);ctx.globalAlpha=1;requestAnimationFrame(draw)}refresh();draw();
</script></body></html>
