<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D5 v9 — Fullscreen Auto Conductor</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#020202;color:#eee}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#020202;overflow:hidden}button{border:1px solid #303030;background:#0c0c0c;color:#ddd;min-height:38px;padding:0 10px;font:600 10px ui-monospace,monospace;cursor:pointer}button.on{background:#292929;border-color:#aaa;color:#fff}.app{height:100vh;display:grid;grid-template-rows:1fr auto;position:relative}.stage{position:relative;min-height:0;overflow:hidden;background:#010101}.stage canvas{display:block;width:100%;height:100%}.hud{position:absolute;top:14px;left:14px;font:10px ui-monospace,monospace;line-height:1.65;color:#aaa;background:#030303b8;border:1px solid #222;padding:8px 10px;pointer-events:none}.status{position:absolute;top:14px;right:14px;font:10px ui-monospace,monospace;color:#aaa;background:#030303b8;border:1px solid #222;padding:8px 10px;pointer-events:none}.topDock{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:5px;z-index:4}.controls{background:#050505e8;border-top:1px solid #242424;padding:7px 9px 9px;backdrop-filter:blur(12px)}.padDeck{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.pad{min-height:58px;text-align:left;padding:7px;background:#0a0a0a}.pad strong{display:block;font:700 11px ui-monospace,monospace}.pad span{display:block;margin-top:4px;font:8px ui-monospace,monospace;color:#6f6f6f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pad.struct{border-color:#404040}.pad.fx{border-color:#252525}.pad.flash{background:#343434}.pad.filtered{border-color:#704848}.transport{display:flex;gap:5px;align-items:center;margin-top:5px;flex-wrap:wrap}.label{border:1px solid #222;background:#090909;color:#777;min-height:38px;display:flex;align-items:center;padding:0 8px;font:9px ui-monospace,monospace}.editPanel{position:absolute;inset:58px 12px 88px;background:#050505f2;border:1px solid #292929;padding:12px;overflow:auto;z-index:5}.editPanel.hidden{display:none}.editor{display:grid;grid-template-columns:1.2fr .8fr;gap:8px}.panel{border:1px solid #252525;background:#080808;padding:9px}.panel h2{font:600 11px ui-monospace,monospace;margin:0 0 8px}.clipList{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.clipBtn.sel{background:#292929;border-color:#888}.arranger{display:grid;grid-template-columns:120px repeat(16,minmax(28px,1fr));gap:3px;min-width:820px}.arranger .head{font:9px ui-monospace,monospace;color:#777;display:flex;align-items:center}.step{height:32px;padding:0}.step.on{background:#ddd;color:#111}.step.play{outline:1px solid #fff;outline-offset:1px}.hint{font:9px ui-monospace,monospace;color:#777;line-height:1.55;margin-top:7px}.danger{border-color:#5b3636!important}@media(max-width:900px){.padDeck{grid-template-columns:repeat(4,1fr)}.editor{grid-template-columns:1fr}.topDock{left:10px;transform:none}.pad{min-height:52px}}@media(max-width:560px){.padDeck{grid-template-columns:repeat(4,1fr)}.pad span{display:none}.controls{padding:5px}.topDock{display:none}}
</style>
</head>
<body>
<main class="app" id="app" tabindex="0">
<section class="stage" id="stage"><canvas id="c"></canvas><div class="hud" id="hud">140 BPM<br>AUTO OFF<br>ENERGY 2</div><div class="status" id="status">READY</div><div class="topDock"><button id="mode">EDIT</button><button id="fullscreen">FULLSCREEN</button></div></section>
<section class="controls" id="performControls"><div class="padDeck" id="pads"></div><div class="transport"><button id="play">PLAY</button><button id="auto">AUTO OFF</button><button id="energy">ENERGY 2</button><button id="ground">GROUND AUTO</button><span class="label">GUARD: DEBOUNCE · 1/8 QUANTIZE · ROLE BUDGET · MAX 5 ACTIVE</span><button id="panic" class="danger">PANIC</button></div></section>
<section class="editPanel hidden" id="editPanel"><div class="editor"><section class="panel"><h2>OPTIONAL ARRANGER — COMPLETE CLIPS ONLY</h2><div style="overflow-x:auto"><div class="arranger" id="arranger"></div></div><div class="transport"><button id="arrangeOn">ARRANGER OFF</button><button id="clearArrange">CLEAR</button></div><div class="hint">Arranger 只调度完整 Clip。PERFORM 的自动控制不依赖这张表。</div></section><section class="panel"><h2>CLIP SOURCE</h2><div class="clipList" id="clipList"></div><div class="hint">AUTO ASSIST：只在结构过空时补一条兼容材料。AUTO DRIVE：按内部 OPEN→BUILD→PEAK→BREAK 曲线主动组织，并自动选择 Ground。</div></section></div></section>
</main>
<script src="./d5-v9-auto-conductor.js"></script>
</body></html>
