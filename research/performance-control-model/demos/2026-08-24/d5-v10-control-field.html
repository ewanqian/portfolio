<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D5 v10 — Fullscreen Control Field</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#020202;color:#eee}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020202}button{font:600 10px ui-monospace,monospace;color:#ddd;background:#090909;border:1px solid #303030;cursor:pointer}.app,.stage{position:relative;width:100%;height:100%}.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.zones{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);z-index:2}.zone{position:relative;background:transparent;border:1px solid rgba(255,255,255,.055);min-width:0;min-height:0;overflow:hidden;touch-action:none;text-align:left;padding:10px}.zone:hover,.zone.sel{border-color:rgba(255,255,255,.26);background:rgba(255,255,255,.018)}.zone.active{border-color:rgba(255,255,255,.18)}.zone.filtered{border-color:rgba(255,255,255,.38)}.zone .key{position:absolute;left:10px;top:8px;font:700 12px ui-monospace,monospace;color:rgba(255,255,255,.7)}.zone .name{position:absolute;left:10px;bottom:9px;font:9px ui-monospace,monospace;color:rgba(255,255,255,.35);letter-spacing:.05em}.zone .map{position:absolute;right:9px;bottom:9px;max-width:62%;text-align:right;font:8px ui-monospace,monospace;color:rgba(255,255,255,.22);line-height:1.35}.zone .cursor{position:absolute;width:12px;height:12px;border:1px solid rgba(255,255,255,.8);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;left:50%;top:50%;opacity:.5}.zone.sel .cursor{opacity:1}.zone.deep .cursor{width:26px;height:26px}.guideOff .zone{border-color:transparent}.guideOff .zone .name,.guideOff .zone .map{opacity:0}.guideOff .zone .key{opacity:.15}.guideOff .zone.sel{border-color:rgba(255,255,255,.16)}.hud{position:absolute;z-index:5;top:12px;left:12px;padding:8px 10px;background:rgba(2,2,2,.72);border:1px solid #222;font:9px ui-monospace,monospace;color:#999;line-height:1.6;pointer-events:none}.status{position:absolute;z-index:5;top:12px;right:12px;padding:8px 10px;background:rgba(2,2,2,.72);border:1px solid #222;font:9px ui-monospace,monospace;color:#999;pointer-events:none}.dock{position:absolute;z-index:6;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:5px;padding:5px;background:rgba(3,3,3,.78);border:1px solid #242424;backdrop-filter:blur(12px)}.dock button{min-height:36px;padding:0 10px}.dock button.on{background:#292929;border-color:#999}.danger{border-color:#553535!important}.edit{position:absolute;z-index:7;inset:48px 12px 58px;background:rgba(4,4,4,.94);border:1px solid #292929;padding:12px;overflow:auto}.edit.hidden{display:none}.editGrid{display:grid;grid-template-columns:1.15fr .85fr;gap:8px}.panel{border:1px solid #242424;background:#080808;padding:9px}.panel h2{font:600 11px ui-monospace,monospace;margin:0 0 8px}.clipList{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.clipList button{min-height:36px;text-align:left;padding:0 8px}.clipList button.sel{background:#292929;border-color:#888}.arranger{display:grid;grid-template-columns:110px repeat(16,minmax(26px,1fr));gap:3px;min-width:800px}.arranger .head{font:9px ui-monospace,monospace;color:#777;display:flex;align-items:center}.arranger button{height:30px}.arranger button.on{background:#ddd;color:#111}.hint{font:9px ui-monospace,monospace;color:#777;line-height:1.55;margin-top:7px}@media(max-width:720px){.zone .map{display:none}.zone .name{font-size:8px}.dock{left:8px;right:8px;transform:none;overflow-x:auto}.editGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app" id="app" tabindex="0">
<section class="stage" id="stage">
<canvas id="c"></canvas>
<div class="zones" id="zones"></div>
<div class="hud" id="hud">144 BPM<br>CONTROL FIELD</div>
<div class="status" id="status">READY · TAP A ZONE</div>
<div class="dock">
<button id="play">PLAY</button>
<button id="auto">AUTO OFF</button>
<button id="energy">ENERGY 2</button>
<button id="guide" class="on">GUIDE ON</button>
<button id="editBtn">EDIT</button>
<button id="fullscreen">FULLSCREEN</button>
<button id="panic" class="danger">PANIC</button>
</div>
<section class="edit hidden" id="editPanel">
<div class="editGrid">
<section class="panel"><h2>OPTIONAL CLIP ARRANGER</h2><div style="overflow-x:auto"><div class="arranger" id="arranger"></div></div><div class="dock" style="position:static;transform:none;margin-top:8px;width:max-content"><button id="arrangeOn">ARRANGER OFF</button><button id="clearArrange">CLEAR</button></div><div class="hint">这里只决定完整 Clip 的调用时机。演出主界面不依赖 Arranger。</div></section>
<section class="panel"><h2>CLIP / CONTROL FIELD</h2><div class="clipList" id="clipList"></div><div class="hint" id="mapHelp">选择一个 Clip 后，方向键控制同一个 XY 场。Shift + 方向键为精细步进；Enter 重新触发。</div></section>
</div>
</section>
</section>
</main>
<script src="./d5-v10-control-field.js"></script>
</body>
</html>
