<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>D4 v2 — Vision Pro Capsule Field</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#050505;color:#eee}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1140px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px}.tag{font-size:11px;letter-spacing:.16em;color:#808080}.status{font:11px ui-monospace,monospace;color:#aaa}.stage{height:min(60vw,590px);min-height:380px;border:1px solid #282828;background:#020202;position:relative;margin-top:10px;overflow:hidden}.stage canvas{width:100%;height:100%;display:block}.hud{position:absolute;left:10px;top:10px;display:grid;gap:3px;font:10px ui-monospace,monospace;color:#aaa;background:#060606cf;padding:7px 8px;border:1px solid #222}.controls{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:8px}button{min-height:46px;border:1px solid #333;background:#121212;color:#eee;font:600 11px ui-monospace,monospace;cursor:pointer}.hint{font-size:12px;color:#999;line-height:1.55;margin-top:9px}.warn{color:#ddd;font-family:ui-monospace,monospace}@media(max-width:760px){.controls{grid-template-columns:1fr 1fr}.stage{min-height:340px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><main class="wrap"><div class="top"><div><div class="tag">PERFORMANCE CONTROL MODEL / D4 v2</div><h1>Vision Pro — Moving Capsule Field</h1></div><div class="status" id="status">BOOTING</div></div><div id="stage" class="stage"><div class="hud"><span id="xr">XR CHECKING</span><span id="hands">HANDS 0</span><span id="near">NEAR —</span><span id="motion">MOVE 0.00</span><span id="space">SPACE —</span><span id="action">ACTION —</span></div></div><div class="controls"><button id="audio">START AUDIO</button><button id="recenter">RECENTER</button><button data-c="0">ROUTE</button><button data-c="1">LOW FIELD</button><button data-c="2">ORBIT</button><button data-c="3">TEXTURE</button></div><div class="hint"><span class="warn">Vision Pro：</span>进入 XR 后控制场会自动重生在当前头部前方约 0.75m。节点会自己缓慢运动；手靠近节点时是连续控制，pinch 才提交 3–5 秒 Capsule。双手距离控制 SPACE；双手同时 pinch 可重新居中。桌面按钮调用相同 Capsule，用来先确认音乐结构。</div></main><script type="module">
import * as THREE from 'three';import{VRButton}from'three/addons/webxr/VRButton.js';
const BPM=120,BEAT=.5,Q=.25,stage=document.querySelector('#stage'),status=document.querySelector('#status'),xrEl=document.querySelector('#xr'),handsEl=document.querySelector('#hands'),nearEl=document.querySelector('#near'),motionEl=document.querySelector('#motion'),spaceEl=document.querySelector('#space'),actionEl=document.querySelector('#action');let ac=null,origin=0,groundTimer=null,lastGround=-1,masterFilter=null,masterGain=null,xrCentered=false,recenterRequested=false,gestureEnergy=0,spaceAmount=.5,effects=[];const pinchState={left:false,right:false},lastPos={left:null,right:null},lastTime={left:0,right:0};let bothCooldown=0;
const defs=[
 {name:'ROUTE',off:[-.30,.14,.02],freq:220,kind:'route',events:[[0,62,.15],[1,65,.12],[2,69,.15],[3,72,.18],[5,69,.18],[7,65,.20]]},
 {name:'LOW FIELD',off:[-.10,-.12,-.08],freq:110,kind:'field',events:[[0,38,.9],[0,45,.85],[2,41,.75],[4,38,.9],[4,48,.82],[6,45,.65]]},
 {name:'ORBIT',off:[.13,.14,-.06],freq:660,kind:'orbit',events:[[0,69,.12],[1,72,.10],[2,74,.12],[3,77,.14],[4,81,.13],[6,77,.16]]},
 {name:'TEXTURE',off:[.32,-.10,.02],freq:330,kind:'texture',events:[[0,'noise',.2],[1.5,65,.1],[3,'noise',.22],[4,69,.12],[5.5,72,.1],[7,'noise',.28]]}
];
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020202);scene.fog=new THREE.Fog(0x020202,2.5,6);const camera=new THREE.PerspectiveCamera(62,1,.01,20);camera.position.set(0,1.55,2.5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local-floor');stage.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x151515,2));const dl=new THREE.DirectionalLight(0xffffff,2.5);dl.position.set(1,3,2);scene.add(dl);scene.add(new THREE.GridHelper(6,12,0x252525,0x101010));
const controlRoot=new THREE.Group();scene.add(controlRoot);controlRoot.position.set(0,1.35,-.85);const centerMark=new THREE.Mesh(new THREE.RingGeometry(.035,.045,24),new THREE.MeshBasicMaterial({color:0x888888,side:THREE.DoubleSide}));centerMark.rotation.x=Math.PI/2;controlRoot.add(centerMark);
const nodeGeo=new THREE.SphereGeometry(.085,22,14),nodes=[];defs.forEach((d,i)=>{const m=new THREE.Mesh(nodeGeo,new THREE.MeshStandardMaterial({color:0x555555,roughness:.42,emissive:0x050505,transparent:true,opacity:.96}));m.position.set(...d.off);m.userData.base=new THREE.Vector3(...d.off);m.userData.i=i;controlRoot.add(m);nodes.push(m);const ring=new THREE.Mesh(new THREE.TorusGeometry(.115,.004,8,48),new THREE.MeshBasicMaterial({color:0x323232}));ring.rotation.x=Math.PI/2;m.add(ring)});
const pointerGeo=new THREE.SphereGeometry(.018,12,8),pointerMat=new THREE.MeshBasicMaterial({color:0xffffff}),pointers={left:new THREE.Mesh(pointerGeo,pointerMat),right:new THREE.Mesh(pointerGeo,pointerMat)};pointers.left.visible=pointers.right.visible=false;scene.add(pointers.left,pointers.right);const trail={left:[],right:[]};
const vrButton=VRButton.createButton(renderer,{optionalFeatures:['hand-tracking','local-floor']});document.body.appendChild(vrButton);
async function startAudio(){if(!ac)ac=new(AudioContext||webkitAudioContext)();if(ac.state==='suspended')await ac.resume();if(!masterFilter){masterFilter=ac.createBiquadFilter();masterFilter.type='lowpass';masterFilter.frequency.value=1200;masterGain=ac.createGain();masterGain.gain.value=.72;masterFilter.connect(masterGain).connect(ac.destination)}origin=ac.currentTime+.08;if(groundTimer)clearInterval(groundTimer);lastGround=-1;groundTimer=setInterval(scheduleGround,20);status.textContent='AUDIO READY · ENTER XR'}
document.querySelector('#audio').onclick=startAudio;document.querySelector('#recenter').onclick=()=>{recenterRequested=true;status.textContent='RECENTER REQUESTED'};document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>trigger(+b.dataset.c,'desktop'));
function out(node){return masterFilter||ac.destination}
function midi(n){return 440*Math.pow(2,(n-69)/12)}
function note(n,t,d=.18,gain=.04,type='triangle'){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();o.type=type;o.frequency.value=midi(n);lp.type='lowpass';lp.frequency.value=1400+gestureEnergy*1800;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(lp).connect(g).connect(out());o.start(t);o.stop(t+d+.03)}
function kick(t,gain=.11){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(47,t+.09);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(g).connect(out());o.start(t);o.stop(t+.16)}
function noise(t,d=.18,gain=.018){const n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=ac.createBufferSource(),bp=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;bp.type='bandpass';bp.frequency.value=1200+gestureEnergy*1800;g.gain.value=gain;s.connect(bp).connect(g).connect(out());s.start(t);s.stop(t+d)}
function nextGrid(){return origin+Math.ceil((ac.currentTime-origin)/Q)*Q}
function trigger(i,source){if(!ac||ac.state!=='running')return;const d=defs[i],t0=nextGrid();d.events.forEach(e=>{const t=t0+e[0]*BEAT;if(e[1]==='noise')noise(t,e[2]||.18,.018);else note(e[1],t,e[2]||.15,.035+i*.004,['triangle','sawtooth','square','sine'][i])});if(i===0||i===3)kick(t0,.08);spawnEffect(i);actionEl.textContent=`${d.name} · ${source}`;status.textContent=`CAPSULE ${d.name} · ${(t0-origin).toFixed(2)}s`}
function scheduleGround(){if(!ac)return;const s=Math.floor((ac.currentTime-origin)/Q);if(s<0||s===lastGround)return;for(let k=lastGround+1;k<=s;k++){const i=((k%8)+8)%8,t=origin+k*Q;if(i===0||i===4)kick(t,.055);if(i===0){note(38,t,.8,.012,'sine');note(45,t,.78,.008,'sine')}if(i%2===1)noise(t,.03,.0035)}lastGround=s}
function spawnEffect(i){const m=nodes[i],ring=new THREE.Mesh(new THREE.TorusGeometry(.09,.006,8,48),new THREE.MeshBasicMaterial({color:0xd0d0d0,transparent:true,opacity:.75}));ring.position.copy(m.position);ring.rotation.copy(m.rotation);controlRoot.add(ring);effects.push({mesh:ring,born:performance.now(),i})}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z)}
function recenterFromFrame(frame,ref){const pose=frame.getViewerPose(ref);if(!pose)return;const p=pose.transform.position,q=pose.transform.orientation,quat=new THREE.Quaternion(q.x,q.y,q.z,q.w),e=new THREE.Euler().setFromQuaternion(quat,'YXZ'),forward=new THREE.Vector3(0,0,-1).applyQuaternion(new THREE.Quaternion().setFromEuler(new THREE.Euler(0,e.y,0))).normalize();controlRoot.position.set(p.x+forward.x*.75,p.y-.20,p.z+forward.z*.75);controlRoot.rotation.set(0,e.y,0);xrCentered=true;recenterRequested=false;status.textContent='RECENTERED · FIELD 0.75m AHEAD'}
function processHand(frame,ref,source,now){const h=source.handedness==='left'?'left':'right',hand=source.hand,index=hand?.get('index-finger-tip'),thumb=hand?.get('thumb-tip');if(!index||!thumb)return null;const ip=frame.getJointPose(index,ref),tp=frame.getJointPose(thumb,ref);if(!ip||!tp)return null;const p=ip.transform.position,pos=new THREE.Vector3(p.x,p.y,p.z);pointers[h].visible=true;pointers[h].position.copy(pos);const dt=Math.max(16,now-lastTime[h])/1000;if(lastPos[h])gestureEnergy=Math.max(gestureEnergy*.86,Math.min(1,lastPos[h].distanceTo(pos)/dt*1.2));lastPos[h]=pos.clone();lastTime[h]=now;trail[h].push({p:pos.clone(),life:1});trail[h]=trail[h].slice(-18);let best=-1,bestD=.24;nodes.forEach((n,i)=>{const wp=new THREE.Vector3();n.getWorldPosition(wp);const d=wp.distanceTo(pos);if(d<bestD){bestD=d;best=i}});const prox=best>=0?1-bestD/.24:0;if(best>=0){nearEl.textContent=`NEAR ${defs[best].name} ${(bestD*100).toFixed(0)}cm`;nodes[best].scale.setScalar(1+prox*.45)}const pd=dist(ip.transform.position,tp.transform.position),pinching=pd<.028;if(pinching&&!pinchState[h]&&best>=0)trigger(best,`xr-${h}`);pinchState[h]=pinching;return {pinching,pos,best,prox}}
async function checkXR(){if(!navigator.xr){xrEl.textContent='XR NO API';status.textContent='DESKTOP FALLBACK';return}try{const ok=await navigator.xr.isSessionSupported('immersive-vr');xrEl.textContent=ok?'XR READY':'XR UNSUPPORTED';status.textContent=ok?'XR READY · START AUDIO':'DESKTOP FALLBACK'}catch(e){xrEl.textContent='XR ERROR'}}checkXR();
renderer.setAnimationLoop((ts,frame)=>{gestureEnergy*=.965;nodes.forEach((n,i)=>{const b=n.userData.base;n.position.x=b.x+Math.sin(ts*.00055+i*1.7)*.028;n.position.y=b.y+Math.sin(ts*.0008+i)*.035;n.position.z=b.z+Math.cos(ts*.00048+i*.7)*.022;n.rotation.y+=.006+i*.001;n.scale.lerp(new THREE.Vector3(1,1,1),.08)});let hc=0,results=[];pointers.left.visible=pointers.right.visible=false;if(frame&&renderer.xr.isPresenting){const ref=renderer.xr.getReferenceSpace(),session=renderer.xr.getSession();if(ref){if(!xrCentered||recenterRequested)recenterFromFrame(frame,ref);if(session)for(const source of session.inputSources)if(source.hand){const r=processHand(frame,ref,source,ts);if(r){hc++;results.push(r)}}}if(results.length===2){spaceAmount=Math.min(1,Math.max(0,(results[0].pos.distanceTo(results[1].pos)-.18)/.55));if(results[0].pinching&&results[1].pinching&&ts>bothCooldown){recenterFromFrame(frame,ref);bothCooldown=ts+900}}}handsEl.textContent=`HANDS ${hc}`;motionEl.textContent=`MOVE ${gestureEnergy.toFixed(2)}`;spaceEl.textContent=`SPACE ${spaceAmount.toFixed(2)}`;if(ac&&masterFilter){masterFilter.frequency.setTargetAtTime(350+gestureEnergy*2800+spaceAmount*900,ac.currentTime,.035);masterGain.gain.setTargetAtTime(.56+spaceAmount*.18,ac.currentTime,.06)}for(const side of ['left','right']){for(const t of trail[side]){t.life-=.07}trail[side]=trail[side].filter(t=>t.life>0)}effects=effects.filter(e=>{const age=(ts-e.born)/1000,p=age/3.4;e.mesh.scale.setScalar(1+p*5);e.mesh.material.opacity=Math.max(0,.72*(1-p));e.mesh.rotation.z+=.012;if(p>=1){controlRoot.remove(e.mesh);e.mesh.geometry.dispose();e.mesh.material.dispose();return false}return true});renderer.render(scene,camera)});
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();renderer.xr.addEventListener('sessionstart',()=>{xrCentered=false;status.textContent='XR SESSION · AUTO RECENTER'});renderer.xr.addEventListener('sessionend',()=>{xrCentered=false;status.textContent='XR ENDED · DESKTOP READY'});
</script></body></html>
