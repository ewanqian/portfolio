<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>D4 — Vision Pro Spatial Adapter</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#070707;color:#f2f2f2}*{box-sizing:border-box}body{margin:0;background:#070707}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:14px}.tag{font-size:12px;letter-spacing:.14em;color:#888}.status{font:12px ui-monospace,monospace;color:#aaa}.stage{height:min(56vw,560px);min-height:360px;border:1px solid #292929;background:#050505;position:relative;margin-top:12px}.stage canvas{width:100%;height:100%;display:block}.hud{position:absolute;left:12px;top:12px;display:grid;gap:4px;font:11px ui-monospace,monospace;color:#bbb;background:#080808cc;padding:8px;border:1px solid #282828}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}button{min-height:50px;border:1px solid #333;background:#141414;color:#fff;font:600 12px ui-monospace,monospace;cursor:pointer}.on{background:#303030;border-color:#aaa}.hint{font-size:13px;color:#aaa;line-height:1.5;margin-top:12px}.warn{color:#d0d0d0;font-family:ui-monospace,monospace}@media(max-width:700px){.controls{grid-template-columns:1fr 1fr}.stage{min-height:330px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><main class="wrap"><div class="top"><div><div class="tag">PERFORMANCE CONTROL MODEL / D4</div><h1>Vision Pro Spatial Adapter</h1></div><div class="status" id="status">BOOTING</div></div><div id="stage" class="stage"><div class="hud"><span id="xr">XR CHECKING</span><span id="hands">HANDS 0</span><span id="pinch">PINCH —</span><span id="action">ACTION —</span></div></div><div class="controls"><button id="audio">START AUDIO</button><button data-layer="0">KICK</button><button data-layer="1">LOW</button><button data-layer="2">HIGH</button><button data-layer="3">TEXTURE</button></div><div class="hint"><span class="warn">Vision Pro test:</span> 先点 START AUDIO，再 ENTER VR。空间中有 4 个球：把食指移到球附近并 pinch，切换对应 Layer。桌面按钮调用完全相同的语义动作，用来证明 WebXR 只是 input adapter，不是第二套音乐系统。当前页只能在真实设备测试后标记 PASSED。</div></main><script type="module">
import * as THREE from 'three';import{VRButton}from'three/addons/webxr/VRButton.js';
const stage=document.querySelector('#stage'),status=document.querySelector('#status'),xrEl=document.querySelector('#xr'),handsEl=document.querySelector('#hands'),pinchEl=document.querySelector('#pinch'),actionEl=document.querySelector('#action');let ac=null;const active=[false,false,false,false],lastPinch={left:false,right:false},cooldown={left:0,right:0};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050505);const camera=new THREE.PerspectiveCamera(60,1,.01,20);camera.position.set(0,1.55,2.6);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local-floor');stage.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x202020,2));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(1,3,2);scene.add(dl);scene.add(new THREE.GridHelper(8,16,0x333333,0x181818));
const defs=[['KICK',-0.72,1.25,-1.35,82],['LOW',-.24,1.25,-1.55,110],['HIGH',.24,1.25,-1.55,660],['TEXTURE',.72,1.25,-1.35,330]],targets=[];const geo=new THREE.SphereGeometry(.15,24,16);defs.forEach((d,i)=>{const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x555555,roughness:.5,emissive:0x000000}));m.position.set(d[1],d[2],d[3]);m.userData.i=i;scene.add(m);targets.push(m);const ring=new THREE.Mesh(new THREE.TorusGeometry(.21,.006,8,48),new THREE.MeshBasicMaterial({color:0x303030}));ring.position.copy(m.position);ring.rotation.x=Math.PI/2;scene.add(ring)});
const pointerMat=new THREE.MeshBasicMaterial({color:0xffffff});const pointerGeo=new THREE.SphereGeometry(.025,12,8),pointers={left:new THREE.Mesh(pointerGeo,pointerMat),right:new THREE.Mesh(pointerGeo,pointerMat)};pointers.left.visible=pointers.right.visible=false;scene.add(pointers.left,pointers.right);
const vrButton=VRButton.createButton(renderer,{optionalFeatures:['hand-tracking','local-floor']});document.body.appendChild(vrButton);
async function startAudio(){if(!ac)ac=new(AudioContext||webkitAudioContext)();if(ac.state==='suspended')await ac.resume();status.textContent='AUDIO READY · ENTER VR';}
document.querySelector('#audio').onclick=startAudio;document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>semanticToggle(+b.dataset.layer,'desktop'));
function semanticToggle(i,source){active[i]=!active[i];targets[i].material.color.set(active[i]?0xd8d8d8:0x555555);targets[i].material.emissive.set(active[i]?0x222222:0x000000);document.querySelector(`[data-layer="${i}"]`).classList.toggle('on',active[i]);actionEl.textContent=`ACTION ${active[i]?'ADD':'REMOVE'} L${i+1} · ${source}`;play(i,active[i]);}
function play(i,on){if(!ac||ac.state!=='running')return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=['sine','sine','square','triangle'][i];o.frequency.value=defs[i][4];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(on?.11:.05,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+(on?.35:.12));o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.5)}
async function checkXR(){if(!navigator.xr){xrEl.textContent='XR NO API';status.textContent='DESKTOP FALLBACK';return}try{const ok=await navigator.xr.isSessionSupported('immersive-vr');xrEl.textContent=ok?'XR READY':'XR UNSUPPORTED';status.textContent=ok?'XR READY · START AUDIO':'DESKTOP FALLBACK'}catch(e){xrEl.textContent='XR ERROR'}}checkXR();
function distance(a,b){const dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z;return Math.hypot(dx,dy,dz)}
function processHand(frame,ref,source,now){const hand=source.hand;if(!hand)return false;const indexSpace=hand.get('index-finger-tip'),thumbSpace=hand.get('thumb-tip');if(!indexSpace||!thumbSpace)return false;const ip=frame.getJointPose(indexSpace,ref),tp=frame.getJointPose(thumbSpace,ref);if(!ip||!tp)return false;const h=source.handedness==='left'?'left':'right',p=ip.transform.position;pointers[h].visible=true;pointers[h].position.set(p.x,p.y,p.z);const pd=distance(ip.transform.position,tp.transform.position),pinching=pd<.026;pinchEl.textContent=`PINCH ${h.toUpperCase()} ${(pd*1000).toFixed(0)}mm`;if(pinching&&!lastPinch[h]&&now>cooldown[h]){let best=-1,bestD=.22;targets.forEach((t,i)=>{const d=distance(p,t.position);if(d<bestD){bestD=d;best=i}});if(best>=0){semanticToggle(best,`xr-${h}`);cooldown[h]=now+350}}lastPinch[h]=pinching;return true}
renderer.setAnimationLoop((ts,frame)=>{let hc=0;if(frame&&renderer.xr.isPresenting){const ref=renderer.xr.getReferenceSpace(),session=renderer.xr.getSession();pointers.left.visible=pointers.right.visible=false;if(ref&&session)for(const source of session.inputSources)if(source.hand&&processHand(frame,ref,source,ts))hc++;handsEl.textContent=`HANDS ${hc}`;}else{pointers.left.visible=pointers.right.visible=false;handsEl.textContent='HANDS 0';targets.forEach((t,i)=>{t.rotation.y+=.003+i*.0006;t.position.y=defs[i][2]+Math.sin(ts*.001+i)*.02})}renderer.render(scene,camera)});
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();renderer.xr.addEventListener('sessionstart',()=>status.textContent='XR SESSION · PINCH NEAR A SPHERE');renderer.xr.addEventListener('sessionend',()=>status.textContent='XR ENDED · DESKTOP READY');
</script></body></html>
