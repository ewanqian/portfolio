<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050608" />
  <title>SceneForge Viewer</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;color:#f5f5f2}button,input,select{font:inherit}
    #stage{position:fixed;inset:0;width:100%;height:100%;display:block}.ui{position:fixed;z-index:20;inset:0;pointer-events:none}.panel{pointer-events:auto;position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));width:min(430px,calc(100vw - 28px));padding:14px;border:1px solid rgba(255,255,255,.13);border-radius:16px;background:rgba(5,7,10,.84);backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.38)}
    h1{font-size:15px;margin:0 0 4px;font-weight:680}.sub{font-size:11px;line-height:1.45;color:#9fa8b4;margin:0 0 12px}.tabs,.row{display:flex;gap:7px;flex-wrap:wrap}.tabs{margin-bottom:10px}.tabs button{flex:1}.row{margin-top:7px}.row>*{flex:1 1 0;min-width:0}.stack{display:grid;gap:7px}.field{display:grid;gap:5px}.field label{font-size:10px;color:#89939f;text-transform:uppercase;letter-spacing:.08em}.meta{font-size:10px;color:#9ea8b4;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}
    button,input,select{min-height:38px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);color:#f5f5f2;border-radius:9px;padding:8px 10px}button{cursor:pointer}button.primary{background:#f4f4ef;color:#07080a;border-color:transparent;font-weight:650}button.active{background:rgba(255,255,255,.17)}button:disabled{opacity:.42;cursor:not-allowed}input{text-transform:uppercase;letter-spacing:.12em}select{appearance:none}.status{font-size:11px;color:#aeb6c1;border-top:1px solid rgba(255,255,255,.1);margin-top:10px;padding-top:9px}.status[data-level="warn"]{color:#f2c575}.status[data-level="error"]{color:#ff8b8b}.recent{display:flex;gap:6px;overflow-x:auto;padding-top:7px}.recent button{white-space:nowrap;min-height:31px;padding:6px 8px;font-size:10px}.hide{display:none!important}
    .hud{pointer-events:none;position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));text-align:right;font-size:10px;color:#9ba4af;line-height:1.5}.hud b{color:#eef1f4;font-weight:600}
    @media(max-width:640px){.panel{padding:11px;width:min(390px,calc(100vw - 20px));left:10px;top:10px}.hud{display:none}}
  </style>
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/","peerjs":"https://cdn.jsdelivr.net/npm/peerjs@1.5.5/+esm"}}
  </script>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="ui">
    <section class="panel">
      <h1>SceneForge Viewer</h1>
      <p class="sub">Browser first · WebRTC media · optional WebXR. 普通电脑可直接查看，Vision Pro 只是 XR 终端之一。</p>

      <div class="tabs">
        <button id="tab-quick" class="active" type="button">Quick Test</button>
        <button id="tab-venue" type="button">Venue Test</button>
      </div>

      <div id="venue-tools" class="stack hide">
        <div class="field"><label for="venue">Venue preset</label><select id="venue"></select></div>
        <div id="venue-meta" class="meta">—</div>
      </div>

      <div class="row">
        <button id="host" class="primary" type="button">Share + Host</button>
        <button id="preview" type="button">Local Preview</button>
        <button id="stop" type="button">Stop</button>
      </div>

      <div class="field" style="margin-top:10px">
        <label for="room">Temporary room</label>
        <div class="row" style="margin-top:0"><input id="room" maxlength="8" placeholder="ROOM CODE" /><button id="new-room" type="button">New</button></div>
      </div>
      <div class="row">
        <button id="join" type="button">Join Room</button>
        <button id="copy-room" type="button">Copy Room Link</button>
      </div>
      <div id="recent-wrap" class="hide"><div class="meta">Recent rooms</div><div id="recent" class="recent"></div></div>

      <div class="row" style="margin-top:10px">
        <button id="enter-xr" type="button">Enter XR</button>
        <button id="screen-ahead" type="button">Screen Ahead</button>
        <button id="reset" type="button">Reset View</button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">Ready.</div>
    </section>
    <div class="hud"><b id="hud-venue">Quick 16:9</b><br><span id="hud-screen">3.20 × 1.80 m · 1920 × 1080</span><br><span id="hud-peer">RTC idle</span></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
