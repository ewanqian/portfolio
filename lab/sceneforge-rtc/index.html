<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050608" />
  <title>SceneForge RTC Test</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;color:#f5f5f2}
    #stage{position:fixed;inset:0;width:100%;height:100%;display:block}
    .panel{position:fixed;z-index:20;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));width:min(420px,calc(100vw - 28px));padding:14px;border:1px solid rgba(255,255,255,.13);border-radius:14px;background:rgba(5,7,10,.82);backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.36)}
    h1{font-size:15px;margin:0 0 4px;font-weight:650} p{font-size:12px;line-height:1.45;color:#aab1ba;margin:0 0 10px}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.row>*{flex:1 1 auto}
    button,textarea{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);color:#f5f5f2;border-radius:9px;font:inherit}button{min-height:38px;padding:8px 10px;cursor:pointer}button.primary{background:#f4f4ef;color:#07080a;border-color:transparent;font-weight:650}button:hover{background:rgba(255,255,255,.12)}
    textarea{width:100%;min-height:74px;padding:9px;resize:vertical;font-size:10px;line-height:1.35}.status{font-size:11px;color:#aeb6c1;border-top:1px solid rgba(255,255,255,.1);margin-top:10px;padding-top:9px}.status[data-level="warn"]{color:#f2c575}.status[data-level="error"]{color:#ff8b8b}
    details{margin-top:9px}summary{font-size:11px;color:#cbd1d8;cursor:pointer}.pill{display:inline-flex;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);font-size:10px;color:#bcc4cd;margin-left:5px}
    .hide{display:none!important}@media(max-width:640px){.panel{padding:11px}.compact-on-xr{opacity:.92}}
  </style>
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"}}
  </script>
</head>
<body>
  <canvas id="stage"></canvas>
  <section class="panel compact-on-xr">
    <h1>SceneForge RTC Test <span class="pill">direct WebRTC</span></h1>
    <p>16:9 共享屏幕空间。无 Needle。Desktop → WebRTC → Vision Pro / browser → Three.js VideoTexture → WebXR。</p>
    <div class="row">
      <button id="host" class="primary" type="button">1 · Host Screen</button>
      <button id="join" type="button">2 · Join Offer</button>
      <button id="enter-xr" type="button">Enter XR</button>
    </div>
    <div class="row">
      <button id="screen-ahead" type="button">Screen Ahead</button>
      <button id="reset" type="button">Reset Scene</button>
      <button id="stop" type="button">Stop</button>
    </div>
    <details id="signal-box" open>
      <summary>Manual P2P signaling</summary>
      <p style="margin-top:7px">Host 生成 Offer Link → 在 Vision Pro 打开 → Join Offer → 生成 Answer → 把 Answer Link 发回 Host 并打开/粘贴。</p>
      <textarea id="signal" placeholder="Offer / Answer JSON or URL"></textarea>
      <div class="row">
        <button id="make-answer" type="button">Create Answer</button>
        <button id="apply-answer" type="button">Apply Answer</button>
        <button id="copy-link" type="button">Copy Signal Link</button>
      </div>
    </details>
    <div id="status" class="status" role="status" aria-live="polite">Ready.</div>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
