<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>No Further Input Required — Exhibition Study</title>
<meta name="description" content="《无需进一步输入》三分钟全自动展览版本。">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
  body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#050505}
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.055;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E")}
  .sound-hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font:9px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.11em;text-transform:uppercase;color:rgba(235,235,228,.16);pointer-events:none;opacity:1;transition:opacity 1.2s ease}
  .sound-hint.off{opacity:0}
</style>
</head>
<body>
<canvas id="stage" aria-label="No Further Input Required exhibition runtime"></canvas>
<div class="grain"></div>
<div class="sound-hint" id="soundHint">tap once for sound</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('stage');
const ctx=canvas.getContext('2d',{alpha:false});
const hint=document.getElementById('soundHint');
const TAU=Math.PI*2;
const LOOP=180;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t*t*(3-2*t);
const fract=x=>x-Math.floor(x);
function hash(n){return fract(Math.sin(n*127.1+311.7)*43758.5453123)}

let W=0,H=0,DPR=1,startTime=performance.now(),lastTime=startTime;
let memory=[];
let lastCapture=-99;
let ac=null,master=null,audioStarted=false;

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

function phaseAt(t){
  if(t<35)return {id:0,u:t/35};
  if(t<85)return {id:1,u:(t-35)/50};
  if(t<135)return {id:2,u:(t-85)/50};
  return {id:3,u:(t-135)/45};
}

function tri(cx,cy,r,rot=-Math.PI/2){
  return [0,1,2].map(i=>({x:cx+Math.cos(rot+i*TAU/3)*r,y:cy+Math.sin(rot+i*TAU/3)*r}));
}
function mid(a,b){return{x:(a.x+b.x)*.5,y:(a.y+b.y)*.5}}
function subdivide(points,depth,out,seed=1){
  const [a,b,c]=points;
  if(depth<=0){out.push({p:points,seed});return}
  const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);
  const skip=Math.floor(hash(seed*17+depth)*4);
  const kids=[[a,ab,ca],[ab,b,bc],[ca,bc,c],[ab,bc,ca]];
  kids.forEach((k,i)=>{if(i!==skip||depth<2)subdivide(k,depth-1,out,seed*4+i+1)});
}

function geometryAt(t){
  const p=phaseAt(t);
  let depth=1,spread=.2,drop=.08,scale=1;
  if(p.id===0){depth=p.u<.38?0:p.u<.72?1:2;spread=.04+.09*ease(p.u);drop=.02+.06*p.u;scale=.92+.04*Math.sin(p.u*Math.PI)}
  if(p.id===1){depth=2+(p.u>.4?1:0);spread=.10+.20*ease(p.u);drop=.08+.15*p.u;scale=.96+.08*Math.sin(p.u*Math.PI)}
  if(p.id===2){depth=3;spread=.24+.10*Math.sin(p.u*Math.PI);drop=.18+.06*Math.sin(p.u*Math.PI);scale=1.02+.06*Math.sin(p.u*TAU)}
  if(p.id===3){depth=p.u<.55?3:2;spread=.24*(1-ease(p.u))+.035;drop=.18*(1-p.u)+.035;scale=1.02-.12*ease(p.u)}
  const size=Math.min(W,H)*.31*scale;
  const cx=W*.5,cy=H*.33+drop*H;
  const root=tri(cx,cy,size);
  const cells=[];subdivide(root,depth,cells,3);
  cells.forEach((c,i)=>{
    const h=hash(c.seed*9.13+i*2.3);
    const d=(h-.5)*spread*Math.min(W,H);
    const vertical=(.45+hash(c.seed*5.7)*.8)*drop*H;
    c.p=c.p.map((q,j)=>({
      x:q.x+d*(j===0?.34:j===1?-.2:.12),
      y:q.y+vertical*(.28+.72*hash(c.seed+j*11.7))
    }));
  });
  return {cells,root,p};
}

function capture(t,g){
  if(t-lastCapture<7.5)return;
  lastCapture=t;
  const chosen=g.cells.filter((_,i)=>i%Math.max(1,Math.floor(g.cells.length/6))===0).slice(0,8);
  memory.push({born:t,cells:chosen.map(c=>c.p.map(q=>({x:q.x/W,y:q.y/H}))),weight:.25+.4*hash(t*3.7)});
  if(memory.length>16)memory.shift();
}

function drawTriangle(points,alpha,width=1){
  ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);ctx.lineTo(points[1].x,points[1].y);ctx.lineTo(points[2].x,points[2].y);ctx.closePath();
  ctx.strokeStyle=`rgba(235,236,229,${alpha})`;ctx.lineWidth=width;ctx.stroke();
}

function drawCurrent(g,t){
  const p=g.p;
  const fadeIn=clamp(t/8);
  const finalFade=p.id===3?1-.38*ease(clamp((p.u-.72)/.28)):1;
  const alphaBase=fadeIn*finalFade;

  // main decomposition body
  g.cells.forEach((c,i)=>{
    const ageWave=.62+.38*Math.sin(t*.18+i*1.7);
    const hierarchy=.26+.42*(1-i/Math.max(1,g.cells.length));
    const a=alphaBase*hierarchy*ageWave;
    drawTriangle(c.p,a, i%5===0?1.15:.72);

    if((p.id===1||p.id===2)&&i%3===0){
      const cen={x:(c.p[0].x+c.p[1].x+c.p[2].x)/3,y:(c.p[0].y+c.p[1].y+c.p[2].y)/3};
      const len=(18+55*hash(c.seed*4.1))*Math.min(W,H)/800;
      ctx.beginPath();ctx.moveTo(cen.x,cen.y);ctx.lineTo(cen.x+(hash(c.seed)-.5)*len,cen.y+len*(.7+hash(c.seed*3.2)));
      ctx.strokeStyle=`rgba(235,236,229,${.05+.11*alphaBase})`;ctx.lineWidth=.65;ctx.stroke();
    }
  });

  // downward structural rails
  const rails=4+(p.id>0?3:0)+(p.id===2?4:0);
  for(let i=0;i<rails;i++){
    const x=W*(.22+.56*(i/(Math.max(1,rails-1))));
    const wob=(hash(i*13+Math.floor(t/6))-.5)*W*.025;
    const y0=H*(.23+.04*hash(i*4));
    const y1=H*(.55+.26*hash(i*8.1));
    ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x+wob,y1);
    ctx.strokeStyle=`rgba(235,236,229,${alphaBase*(.025+.055*hash(i*7))})`;ctx.lineWidth=.55;ctx.stroke();
  }
}

function drawMemory(t,p){
  const recall=(p.id===2)?ease(p.u):(p.id===3)?(1-ease(p.u))*.7:(p.id===1?.18*ease(p.u):0);
  if(recall<=0)return;
  memory.forEach((m,mi)=>{
    const age=t-m.born;
    const ghost=clamp(1-age/150)*m.weight*recall;
    const xShift=Math.sin((t+mi*9)*.08)*W*.012;
    const yShift=(mi%4-1.5)*H*.007;
    m.cells.forEach((c,ci)=>{
      const pts=c.map(q=>({x:q.x*W+xShift,y:q.y*H+yShift}));
      drawTriangle(pts,ghost*(.18+.22*(ci%3===0)),.55);
      if(ci%2===0){
        const cen={x:(pts[0].x+pts[1].x+pts[2].x)/3,y:(pts[0].y+pts[1].y+pts[2].y)/3};
        ctx.beginPath();ctx.arc(cen.x,cen.y,.7+ghost*2,0,TAU);ctx.fillStyle=`rgba(235,236,229,${ghost*.45})`;ctx.fill();
      }
    });
  });
}

function drawRoutes(g,t){
  const p=g.p;
  let strength=0;
  if(p.id===0)strength=.08*p.u;
  if(p.id===1)strength=.16+.22*p.u;
  if(p.id===2)strength=.32+.22*Math.sin(p.u*Math.PI);
  if(p.id===3)strength=.28*(1-ease(p.u));
  if(strength<=.01)return;
  const centers=g.cells.map(c=>({x:(c.p[0].x+c.p[1].x+c.p[2].x)/3,y:(c.p[0].y+c.p[1].y+c.p[2].y)/3,seed:c.seed}));
  for(let i=0;i<centers.length;i+=2){
    const a=centers[i],j=(i+1+Math.floor(hash(a.seed*19)*Math.max(1,centers.length-1)))%centers.length,b=centers[j];
    ctx.beginPath();ctx.moveTo(a.x,a.y);
    const mx=lerp(a.x,b.x,.5),my=lerp(a.y,b.y,.5)+Math.sin(t*.2+a.seed)*H*.015;
    ctx.quadraticCurveTo(mx,my,b.x,b.y);
    ctx.strokeStyle=`rgba(235,236,229,${strength*(.08+.13*hash(a.seed))})`;ctx.lineWidth=.55;ctx.stroke();
  }
}

function drawField(g,t){
  const p=g.p;
  let amount=p.id===0?.16:p.id===1?.3:p.id===2?.52:.18*(1-p.u);
  const n=Math.floor(22+90*amount);
  for(let i=0;i<n;i++){
    const hx=hash(i*13.11+7),hy=hash(i*27.3+3);
    const drift=Math.sin(t*(.04+.02*hash(i))+i)*8;
    const x=W*(.08+.84*hx)+drift;
    const y=H*(.1+.82*hy)+Math.cos(t*.025+i*2)*7;
    const a=(.018+.07*hash(i*4.2))*amount;
    ctx.beginPath();ctx.arc(x,y,.45+1.2*hash(i*8.3),0,TAU);ctx.fillStyle=`rgba(235,236,229,${a})`;ctx.fill();
  }
}

function drawRegistration(t,g){
  const p=g.p;
  const alpha=p.id===0?(.14+.1*Math.sin(t*.5)):.04;
  if(alpha<=.01)return;
  const r=Math.min(W,H)*(.04+.015*Math.sin(t*.22));
  const cx=W*.5,cy=H*.33;
  ctx.beginPath();ctx.moveTo(cx-r,cy);ctx.lineTo(cx+r,cy);ctx.moveTo(cx,cy-r);ctx.lineTo(cx,cy+r);
  ctx.strokeStyle=`rgba(235,236,229,${alpha})`;ctx.lineWidth=.55;ctx.stroke();
}

function draw(t){
  ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);
  const g=geometryAt(t);capture(t,g);
  drawField(g,t);
  drawMemory(t,g.p);
  drawRoutes(g,t);
  drawCurrent(g,t);
  drawRegistration(t,g);

  // subtle exposure breathing, not a HUD
  const vign=ctx.createRadialGradient(W*.5,H*.45,Math.min(W,H)*.12,W*.5,H*.45,Math.max(W,H)*.72);
  vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(1,'rgba(0,0,0,.46)');
  ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
}

function frame(now){
  const total=(now-startTime)/1000;
  const t=total%LOOP;
  // Keep a little memory across loops, but restart capture timing at wrap.
  if(t<1 && ((lastTime-startTime)/1000)%LOOP>170){lastCapture=-99;memory=memory.slice(-5)}
  draw(t);
  updateAudio(t);
  lastTime=now;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// --- subtle autonomous sound layer; browser gesture is required only to unlock audio.
function startAudio(){
  if(audioStarted)return;
  audioStarted=true;hint.classList.add('off');
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=.16;master.connect(ac.destination);
}
function tone(freq,dur=.08,amp=.05,when=0){
  if(!ac||!master)return;
  const t=when||ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
  o.type='sine';o.frequency.value=freq;f.type='lowpass';f.frequency.value=1400;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(amp,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+dur+.05);
}
let lastPulse=-1;
function updateAudio(t){
  if(!ac)return;
  const p=phaseAt(t);
  const interval=p.id===0?4.5:p.id===1?2.7:p.id===2?1.85:5.2;
  const pulse=Math.floor(t/interval);
  if(pulse!==lastPulse){
    lastPulse=pulse;
    const degree=[0,3,5,7,10][pulse%5];
    const base=p.id===2?110:82.4;
    tone(base*Math.pow(2,degree/12),p.id===2?.16:.09,p.id===3?.022:.045);
    if(p.id===2&&pulse%3===0)tone(base*2*Math.pow(2,(degree+7)/12),.055,.018,ac.currentTime+.055);
  }
}
addEventListener('pointerdown',startAudio,{once:true});
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='s')startAudio()},{once:true});
})();
</script>
</body>
</html>
