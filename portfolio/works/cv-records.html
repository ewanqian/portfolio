*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f7f7f4;color:#1f2221;font:13px/1.65 -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC",sans-serif}a{color:inherit}.wrap{max-width:1130px;margin:auto;padding:0 34px}nav{display:flex;justify-content:space-between;gap:24px;padding:22px 0;border-bottom:1px solid #dedfdb;font-size:11px;letter-spacing:.08em}nav a{text-decoration:none}h1{font:400 clamp(45px,6vw,85px)/1.08 Georgia,"Noto Serif CJK SC",serif;letter-spacing:-.045em;margin:65px 0 20px}header{padding-bottom:42px;border-bottom:1px solid #aaa}header p{max-width:720px;color:#646765}header .label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#888}.controls{display:flex;gap:12px;align-items:center;padding:19px 0;border-bottom:1px solid #ddd;background:#f7f7f4;position:sticky;top:0;z-index:2;flex-wrap:wrap}input,select{background:white;border:1px solid #cfd0cd;padding:9px 12px;border-radius:0;font:inherit}input{flex:1;min-width:220px}#count{margin-left:auto;font-size:11px;color:#747675}.section{padding:35px 0 15px}.section h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;padding-bottom:12px;border-bottom:1px solid #777;margin:0 0 5px}.record{display:grid;grid-template-columns:110px minmax(0,1fr) 180px;gap:20px;padding:16px 2px;border-bottom:1px solid #e0e1dd;scroll-margin-top:95px}.record:target{background:#eceee9;outline:12px solid #eceee9}.record .year{color:#797c78;font-size:12px;font-variant-numeric:tabular-nums}.record h3{font-weight:500;font-size:13px;line-height:1.65;margin:0}.record p{color:#7b7f7b;font-size:11px;margin:7px 0 0}.record .actions{display:flex;align-items:flex-start;flex-direction:column;gap:6px;font-size:11px}.record .actions a{border-bottom:1px solid #9a9c96;text-decoration:none}.record .actions a:hover{color:#486e80}.record .actions span{color:#9b9d98}.foot{padding:35px 0 70px;font-size:11px;color:#838783}.hide{display:none!important}@media(max-width:750px){.wrap{padding:0 18px}.record{grid-template-columns:65px minmax(0,1fr);gap:10px}.record .actions{grid-column:2}.controls{position:static}.record{scroll-margin-top:20px}}
</style></head><body><div class="wrap"><nav><a href="../">EWAN QIAN / PORTFOLIO</a><a href="archive-2026.html">PROJECT ARCHIVE</a></nav><header><div class="label">2026.11 · PUBLIC RECORD INDEX / 单一履历入口</div><h1>CV Records<br>履历记录</h1><p>每条履历具有永久链接，包括学历、课程、获奖、展览、现场演出、工作坊和制作经历。项目母页集中展示作品、版本、图片和署名。部分记录仍在收集外部证明材料，记录存在不等于已获得主办方独立核验。</p></header><div class="controls"><input id="search" placeholder="搜索履历 / Search entries" aria-label="Search"><select id="section"><option value="">所有类别</option><option value="education">教育</option><option value="awards">奖项</option><option value="exhibitions">展览</option><option value="live">演出</option><option value="workshops">教学</option><option value="production">制作</option><option value="research">研究</option></select><span id="count"></span></div><main id="records"></main><footer class="foot">Source: <a href="https://github.com/ewanqian/portfolio/blob/main/content/cv-records-2026-11.json">CV records</a> · <a href="https://github.com/ewanqian/portfolio/blob/main/content/project-registry-2026-11.json">Project registry</a><p>© Ewan Qian / All credit and proof records are subject to verification.</p></footer></div><script>
let rows=[], names={education:"教育经历 / EDUCATION",awards:"入选与奖项 / AWARDS",exhibitions:"展览 / EXHIBITIONS",live:"现场视听 / LIVE AUDIOVISUAL",workshops:"公开教学 / WORKSHOPS",production:"精选制作 / PRODUCTION",research:"持续研究 / RESEARCH"};const el=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));function render(){let q=el('search').value.trim().toLowerCase(),c=el('section').value,found=rows.filter(x=>(!c||x.section===c)&&(!q||(x.zh+' '+x.year+' '+x.id).toLowerCase().includes(q)));el('count').textContent=found.length+' / '+rows.length;el('records').innerHTML=Object.entries(names).map(([k,title])=>{let a=found.filter(x=>x.section===k);if(!a.length)return '';return '<section class="section" id="section-'+k+'"><h2>'+esc(title)+'</h2>'+a.map(r=>'<article class="record" id="'+esc(r.id)+'"><div class="year">'+esc(r.year)+'</div><div><h3>'+esc(r.zh)+'</h3>'+(r.evidence_status?.includes('pending')?'<p>官方证据待补 / Source pending</p>':'')+'</div><div class="actions"><a href="#'+esc(r.id)+'" title="Permanent record" href="records/'+esc(r.id)+'.html">查看记录页 / View record</a>'+(r.project_url?'<a href="'+esc(r.project_url)+'" target="_blank" rel="noopener">查看作品及图片 / View work</a>':'<span>详情页筹备中 / Project page pending</span>')+'</div></article>').join('')+'</section>'}).join('');}fetch('../content/cv-records-2026-11.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(j=>{rows=j.records;render();if(location.hash){let a=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(a)a.scrollIntoView()}}).catch(()=>el('records').textContent='记录暂时无法加载，请通过下方 GitHub 链接查看。');el('search').addEventListener('input',render);el('section').addEventListener('change',render);
</script></body></html>
