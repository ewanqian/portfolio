<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NFI Keyboard Liveset</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--fg:#f5f5f2;--muted:rgba(245,245,242,.52);--line:rgba(245,245,242,.16)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}body{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}.app{min-height:100vh;display:grid;grid-template-rows:auto minmax(58vh,1fr) auto auto;padding:20px;gap:14px}.top,.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.eyebrow,.status,.foot,.hint{font-size:11px;letter-spacing:.1em;color:var(--muted)}h1{margin:4px 0 0;font-size:clamp(20px,2.4vw,32px);font-weight:650}.status{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}.stage{position:relative;overflow:hidden;border:1px solid var(--line);display:grid;place-items:center;min-height:58vh;background:#101010;isolation:isolate;transition:background-color .1s linear,filter .1s linear}.word{position:relative;z-index:3;font-size:clamp(72px,19vw,270px);font-weight:800;letter-spacing:-.08em;line-height:.82;text-align:center;user-select:none}.shape{position:absolute;z-index:1;width:min(42vw,460px);aspect-ratio:1;border:2px solid rgba(255,255,255,.72);opacity:.12;transform:scale(.35);pointer-events:none}.hint{position:absolute;left:14px;bottom:12px;z-index:5}.keyboard{display:grid;grid-template-columns:repeat(13,minmax(34px,1fr));gap:6px}.key{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);min-height:42px;cursor:pointer}.key:hover,.key.active{background:var(--fg);color:#111}.flash .word{animation:hit .22s cubic-bezier(.2,.9,.1,1)}.flash .shape{animation:shape .42s cubic-bezier(.2,.8,.2,1)}.shake .stage{animation:shake .15s linear}.hold .shape{opacity:.52;transform:scale(1.05);transition:transform .8s ease-out,opacity .3s ease}@keyframes hit{0%{transform:scale(.74);opacity:.25}45%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}@keyframes shape{0%{transform:scale(.2);opacity:.78}100%{transform:scale(1.22);opacity:.04}}@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}}@media(max-width:760px){.app{padding:12px}.keyboard{grid-template-columns:repeat(7,minmax(34px,1fr))}.foot{align-items:flex-start;flex-direction:column;gap:2px}}
</style>
</head>
<body>
<main id="app" class="app">
<header class="top"><div><div class="eyebrow">PERSONAL A/V INSTRUMENT · DEMO 01</div><h1>NFI Keyboard Liveset</h1></div><div class="status"><span id="sceneLabel">SCENE · PLAYFUL</span><span id="keyLabel">KEY · —</span></div></header>
<section id="stage" class="stage"><div id="shape" class="shape"></div><div id="word" class="word">A–Z</div><div class="hint">A–Z 演奏 · 1/2/3 切场景 · 0 重置 · 也可点击下方按键</div></section>
<section id="keyboard" class="keyboard"></section>
<footer class="foot"><span>Minimal Input / Audiovisual System</span><span>Ewan Qian · workshop prototype</span></footer>
</main>
<script>
const app=document.querySelector('#app'),stage=document.querySelector('#stage'),word=document.querySelector('#word'),shape=document.querySelector('#shape'),sceneLabel=document.querySelector('#sceneLabel'),keyLabel=document.querySelector('#keyLabel'),keyboard=document.querySelector('#keyboard');
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const labels=['大','狗','叫','汪','叮','咚','鸡','搞','核','酸','来','了','喂','哈','嘿','啊','嗷','呜','哒','咔','啪','嘭','滴','答','嗯','嘘'];
const palettes={playful:['#ff5b45','#2d7cff','#ffd52e','#71ef70','#f05cff','#00d7c9','#f4f1ea','#ff8bc8'],club:['#f6f6f3','#a8ff2f','#ff4141','#4b6cff','#111111','#e9ff00'],ambient:['#dbe7ef','#d7d2ff','#b7e3d2','#f0dfd0','#ccd9cf','#ebe8df']};
const scenes={'1':{name:'PLAYFUL',key:'playful'},'2':{name:'CLUB',key:'club'},'3':{name:'AMBIENT',key:'ambient'}};let currentScene=scenes['1'],audioCtx,active=new Set(),pressed=new Map(),lastHit=new Map(),timer;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function idx(k){return Math.max(0,letters.indexOf(k))}function color(k){const p=palettes[currentScene.key];return p[idx(k)%p.length]}
function voice(k,long=false){ensureAudio();const i=idx(k),now=audioCtx.currentTime,o=audioCtx.createOscillator(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();o.connect(f);f.connect(g);g.connect(audioCtx.destination);const base=currentScene.key==='ambient'?110:currentScene.key==='club'?70:150,scale=[0,2,3,5,7,8,10,12],semi=scale[i%8]+Math.floor(i/8)*12;o.frequency.value=base*Math.pow(2,semi/12);o.type=currentScene.key==='club'?'square':currentScene.key==='ambient'?'sine':(i%2?'triangle':'sine');f.type='lowpass';f.frequency.value=currentScene.key==='ambient'?900:2600+(i%5)*800;const a=currentScene.key==='ambient'?.08:.005,r=long?.8:(currentScene.key==='ambient'?1.1:.22);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(currentScene.key==='club'?.11:.08,now+a);g.gain.exponentialRampToValueAtTime(.0001,now+a+r);o.start(now);o.stop(now+a+r+.03)}
function visual(k,repeat=false){const i=idx(k),label=labels[i];word.textContent=label;word.style.color=currentScene.key==='ambient'?'#161616':'#f8f7f2';stage.style.backgroundColor=color(k);shape.style.borderRadius=i%3===0?'0':i%3===1?'50%':'24%';shape.style.borderColor=currentScene.key==='ambient'?'rgba(20,20,20,.45)':'rgba(255,255,255,.76)';app.classList.remove('flash','shake');void app.offsetWidth;app.classList.add('flash');if(repeat||i%5===0)app.classList.add('shake');keyLabel.textContent=`KEY · ${k} / ${label}`;setBtn(k,true);clearTimeout(timer);timer=setTimeout(()=>app.classList.remove('flash','shake'),440)}
function trigger(k,repeat=false){if(!letters.includes(k))return;voice(k);visual(k,repeat)}
function down(k){if(scenes[k]){currentScene=scenes[k];sceneLabel.textContent=`SCENE · ${currentScene.name}`;stage.style.backgroundColor='#101010';word.textContent=currentScene.name;return}if(k==='0'){reset();return}if(!letters.includes(k))return;if(!active.has(k)){active.add(k);pressed.set(k,performance.now());const now=performance.now(),prev=lastHit.get(k)||0;trigger(k,now-prev<260);lastHit.set(k,now);app.classList.add('hold')}}
function up(k){if(!letters.includes(k))return;const d=performance.now()-(pressed.get(k)||performance.now());active.delete(k);pressed.delete(k);setBtn(k,false);if(active.size===0)app.classList.remove('hold');if(d>360){voice(k,true);word.style.opacity='.64';setTimeout(()=>word.style.opacity='1',260)}}
function reset(){active.clear();pressed.clear();app.classList.remove('flash','shake','hold');stage.style.backgroundColor='#101010';word.style.color='#f5f5f2';word.textContent='A–Z';shape.style.opacity='.12';sceneLabel.textContent=`SCENE · ${currentScene.name}`;keyLabel.textContent='KEY · —';document.querySelectorAll('.key').forEach(e=>e.classList.remove('active'))}
function setBtn(k,on){const b=keyboard.querySelector(`[data-key="${k}"]`);if(b)b.classList.toggle('active',on)}
letters.forEach((k,i)=>{const b=document.createElement('button');b.className='key';b.dataset.key=k;b.textContent=`${k} · ${labels[i]}`;b.onpointerdown=e=>{e.preventDefault();down(k)};b.onpointerup=()=>up(k);b.onpointercancel=()=>up(k);keyboard.appendChild(b)});
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toUpperCase();if(letters.includes(k)||scenes[e.key]||e.key==='0')e.preventDefault();down(scenes[e.key]?e.key:k)});addEventListener('keyup',e=>up(e.key.toUpperCase()));addEventListener('blur',()=>[...active].forEach(up));reset();
</script>
</body>
</html>
