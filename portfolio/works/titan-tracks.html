<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TITAN — Track Visual Archive / Ewan Qian</title><meta name="description" content="TITAN 的逐曲视觉画面、原始截图、封面及演出影像。"><style>
:root{color-scheme:dark;--bg:#050505;--text:#f3f1eb;--muted:#9e9b93;--line:rgba(243,241,235,.16)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 "IBM Plex Sans","Noto Sans SC","PingFang SC",Arial,sans-serif}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:5px}a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:4px}.container{width:min(1360px,calc(100% - 40px));margin:auto}.nav{display:flex;gap:18px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:22px 0;flex-wrap:wrap;font-size:12px}.nav-links{display:flex;gap:20px;flex-wrap:wrap}.language{display:flex;gap:4px}.language button{font:inherit;color:var(--muted);border:1px solid var(--line);background:transparent;padding:7px 12px;cursor:pointer}.language button[aria-pressed=true]{color:var(--bg);background:var(--text)}header{padding:70px 0 42px}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted)}h1{font-size:clamp(38px,6vw,80px);line-height:1.1;margin:24px 0;letter-spacing:-.03em}header p{color:var(--muted);max-width:760px}.tracks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:44px 24px;padding-bottom:70px}.track{min-width:0}.track img{display:block;width:100%;height:auto}.track h2{font-size:24px;margin:18px 0 12px;line-height:1.3}.track h2 small{color:var(--muted);font-size:12px;margin-right:16px;font-weight:400}.links{display:flex;gap:12px 20px;flex-wrap:wrap;font-size:12px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:28px 0 44px;color:var(--muted);font-size:12px}@media(max-width:640px){header{padding-top:42px}.tracks{grid-template-columns:1fr;gap:34px}}
</style></head><body><div class="container"><nav class="nav" aria-label="Primary navigation"><a href="../#/"><strong>Ewan Qian / 钱誉文</strong></a><div class="nav-links"><a href="../#/projects/kashiwa-titan" data-zh="TITAN 项目" data-en="TITAN project">TITAN 项目</a><a href="../#/cv">CV</a></div><div class="language" role="group" aria-label="Language"><button data-lang="zh" type="button">中文</button><button data-lang="en" type="button">English</button></div></nav><header><p class="eyebrow">TITAN / VISUAL ARCHIVE</p><h1 data-zh="逐曲视觉档案" data-en="Track-by-track visuals">逐曲视觉档案</h1><p data-zh="从 Lead 的金属构成到 Aurora 的光线结构，十个视觉单元组织出不同的节奏、密度与空间。" data-en="From the metallic forms of Lead to the light structures of Aurora, ten visual studies explore distinct rhythms, densities and spaces.">从 Lead 的金属构成到 Aurora 的光线结构，十个视觉单元组织出不同的节奏、密度与空间。</p></header><main class="tracks" id="tracks" aria-live="polite"></main><noscript><p><a href="../assets/data/titan-tracks.json">逐曲图片与视频索引 / Track image and video index</a></p></noscript><footer>Ewan Qian / 钱誉文 · TITAN · 2025</footer></div><script type="module">
let lang='zh';try{lang=localStorage.getItem('portfolio-lang')==='en'?'en':'zh'}catch{}
let archive;
function link(label,href){const a=document.createElement('a');a.textContent=label;a.href=href;a.target='_blank';a.rel='noopener noreferrer';return a}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-zh]').forEach(e=>e.textContent=e.dataset[lang]);document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));if(!archive)return;const root=document.getElementById('tracks');root.replaceChildren();for(const track of archive.tracks){const asset=f=>'../'+archive.asset_base+f;const article=document.createElement('article');article.className='track';article.dataset.trackId=track.id;const imageLink=link('',asset(track.original||track.cover));const img=document.createElement('img');img.src=asset(track.preview);img.alt=track.title;img.loading='lazy';imageLink.append(img);const h=document.createElement('h2');const small=document.createElement('small');small.textContent=track.id;h.append(small,track.title);const links=document.createElement('div');links.className='links';if(track.original)links.append(link((lang==='zh'?'原始画面':'Original still')+' · '+track.width+' × '+track.height+' ↗',asset(track.original)));links.append(link((lang==='zh'?'曲目封面':'Track cover')+' ↗',asset(track.cover)));if(track.mana)links.append(link('MANA ↗',track.mana));if(track.bilibili)links.append(link('Bilibili ↗',track.bilibili));if(track.related_video)links.append(link('Phantom · CAN Festival ↗',track.related_video));article.append(imageLink,h,links);root.append(article)}}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('portfolio-lang',lang)}catch{}render()}));render();try{const r=await fetch('../assets/data/titan-tracks.json');if(!r.ok)throw Error('Archive unavailable');archive=await r.json();render()}catch{document.getElementById('tracks').append(link(lang==='zh'?'查看逐曲索引':'Open track index','../assets/data/titan-tracks.json'))}
</script></body></html>
