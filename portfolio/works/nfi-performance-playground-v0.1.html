<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NFI Performance Playground v0.1</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#eee;font-family:ui-monospace,Menlo,monospace}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;font-size:11px;line-height:1.5;pointer-events:none;text-shadow:0 2px 8px #000}.help{position:fixed;left:14px;bottom:14px;font-size:10px;line-height:1.65;color:#aaa;background:#050505aa;padding:10px 12px;border:1px solid #333;backdrop-filter:blur(7px)}.start{position:fixed;inset:0;background:#050505;display:grid;place-items:center;z-index:5}.start button{background:none;border:1px solid #666;color:#eee;padding:18px 28px;font:12px ui-monospace,monospace;letter-spacing:.08em}</style></head><body><canvas id="c"></canvas><div class="hud"><div><b>NFI PERFORMANCE PLAYGROUND v0.1</b><br><span id="process">P05 · WEIGHT SPACE</span></div><div><span id="section">GROUND</span><br><span id="clock">104 BPM · BAR 01</span></div></div><div class="help" id="help">拖动 / 画圈 / 反复擦动：演奏手势<br>Q W E R T Y U I：P01–P08<br>1 2 3 4：GROUND / BUILD / PEAK / BRIDGE<br>SPACE：SAFE FILL · H：隐藏提示 · 0：RESET</div><div class="start" id="start"><button id="go">ENTER / 点击开始</button></div><script>(()=>{'use strict';const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,dpr=1;function rs(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',rs);rs();const names=['DECOMPOSE','TOKEN FIELD','CONTEXT ASSEMBLY','BRANCH SEARCH','WEIGHT SPACE','COMMIT / COLLAPSE','KNOWLEDGE EDGE','RESIDUAL MEMORY'];let process=4,section=0,bpm=104,bar=1,started=false,down=false,path=[],events=[],residue=[],last=performance.now(),nextBeat=0,beat=0;const processEl=document.querySelector('#process'),sectionEl=document.querySelector('#section'),clockEl=document.querySelector('#clock'),help=document.querySelector('#help');const sections=['GROUND','BUILD','PEAK','BRIDGE'];function ui(){processEl.textContent=`P0${process+1} · ${names[process]}`;sectionEl.textContent=sections[section];clockEl.textContent=`${bpm} BPM · BAR ${String(bar).padStart(2,'0')}`}ui();let ac,master;function audio(){if(ac)return;ac=new (AudioContext||webkitAudioContext)();master=ac.createGain();master.gain.value=.16;master.connect(ac.destination);nextBeat=ac.currentTime+.08;schedule()}function tone(freq,t=.15,type='sine',gain=.12){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(gain,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t);o.connect(g).connect(master);o.start();o.stop(ac.currentTime+t+.03)}function kick(){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(110,ac.currentTime);o.frequency.exponentialRampToValueAtTime(42,ac.currentTime+.12);g.gain.setValueAtTime(.22,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.16);o.connect(g).connect(master);o.start();o.stop(ac.currentTime+.18)}function schedule(){if(!ac)return;const q=60/bpm;while(nextBeat<ac.currentTime+.12){const b=beat%4;if(section===2||section===1){if(b===0||b===2)kick();if(section===2&&b%2===1)tone(1800,.04,'square',.025)}else if(section===0&&b===0)kick();else if(section===3&&b===0)tone(110,.45,'sine',.05);beat++;if(beat%4===0){bar++;if(bar%2===0)autoEvent();ui()}nextBeat+=q}setTimeout(schedule,25)}function autoEvent(){if(Math.random()<.55){const px=.15+Math.random()*.7,py=.2+Math.random()*.6;spawn(process,px,py,.25+Math.random()*.25,'AUTO')}}function spawn(type,px,py,energy=.5,gesture='SWIPE'){events.push({type,x:px,y:py,e:energy,t:0,life:2.5+energy*4,gesture,seed:Math.random()*99});const scale=[146.83,164.81,196,220,246.94,293.66];tone(scale[(type+Math.floor(energy*5))%scale.length],.1+.35*energy,type%2?'triangle':'sine',.05+.08*energy)}function metrics(p){if(p.length<2)return{len:0,vel:0,loop:false};let len=0;for(let i=1;i<p.length;i++)len+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);const d=Math.hypot(p[0].x-p.at(-1).x,p[0].y-p.at(-1).y);return{len,vel:len/Math.max(1,p.at(-1).t-p[0].t),loop:len>220&&d<80}}function classify(m,dur){if(dur<180&&m.len<35)return'TAP';if(m.loop)return'LOOP';if(m.len>500)return'SCRUB';return'SWIPE'}c.addEventListener('pointerdown',e=>{if(!started)return;down=true;path=[{x:e.clientX,y:e.clientY,t:performance.now()}];c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!down)return;path.push({x:e.clientX,y:e.clientY,t:performance.now()});if(path.length>120)path.shift()});c.addEventListener('pointerup',e=>{if(!down)return;down=false;path.push({x:e.clientX,y:e.clientY,t:performance.now()});const m=metrics(path),dur=path.at(-1).t-path[0].t,g=classify(m,dur),en=Math.min(1,.25+m.len/700);spawn(process,e.clientX/W,e.clientY/H,en,g);if(g==='LOOP')for(let i=0;i<2;i++)setTimeout(()=>spawn(process,e.clientX/W,e.clientY/H,en*.75,'LOOP'),i*110);path=[]});function drawEvent(o,dt){o.t+=dt;const p=o.t/o.life;if(p>=1){if(Math.random()<.45)residue.push({x:o.x,y:o.y,type:o.type,a:.22,life:6+Math.random()*8});return false}const px=o.x*W,py=o.y*H,e=o.e,a=Math.sin(Math.min(1,p)*Math.PI);x.save();x.translate(px,py);x.globalAlpha=.18+.72*a;if(o.type===0){const n=3+Math.floor(e*7);for(let i=0;i<n;i++){const yy=(i-(n-1)/2)*18*(1+p*1.5);x.strokeStyle='#eee';x.strokeRect(-35-i*2,yy,70+i*4,12)}}else if(o.type===1){x.fillStyle='#eee';const n=5+Math.floor(e*16);for(let i=0;i<n;i++){const ang=i*2.399+o.seed,r=(18+i*8)*(1+p*.7);x.fillRect(Math.cos(ang)*r,Math.sin(ang)*r,4+e*7,4+e*7)}}else if(o.type===2){x.strokeStyle='#eee';for(let i=0;i<5;i++){x.beginPath();x.arc(0,0,25+i*20+p*45,0,Math.PI*2*(.45+.1*i));x.stroke()}}else if(o.type===3){x.strokeStyle='#eee';const branches=4+Math.floor(e*6);for(let i=0;i<branches;i++){const ang=-1.1+i*(2.2/(branches-1));x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(ang)*(70+160*p),Math.sin(ang)*(70+160*p));x.stroke()}}else if(o.type===4){x.strokeStyle='#eee';const r=40+120*e;for(let i=0;i<3;i++){x.beginPath();x.ellipse(Math.sin(o.t*.8+i)*r*.35,0,r*(.7+.15*i),r*(.25+.1*i),o.t*.25+i,0,Math.PI*2);x.stroke()}}else if(o.type===5){x.fillStyle='#eee';const s=(1-p)*(180+e*180);x.fillRect(-s/2,-4,s,8);if(p>.55){x.globalAlpha*=1-p;x.fillRect(-8,-8,16,16)}}else if(o.type===6){x.strokeStyle='#eee';const r=60+140*p;x.beginPath();x.arc(0,0,r,-1.2,1.2);x.stroke();x.beginPath();x.moveTo(r*Math.cos(.1),r*Math.sin(.1));x.lineTo(r*1.5,0);x.stroke()}else{ x.strokeStyle='#aaa';for(let i=0;i<6;i++){x.globalAlpha=(.25+.4*a)*(1-i/7);x.beginPath();x.arc(0,0,25+i*16+p*20,0,Math.PI*2);x.stroke()}}x.restore();return true}function render(t){const dt=Math.min(.04,(t-last)/1000);last=t;x.fillStyle='rgba(5,5,5,.16)';x.fillRect(0,0,W,H);x.strokeStyle='rgba(255,255,255,.055)';for(let i=0;i<10;i++){const yy=(i/9)*H;x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke()}residue=residue.filter(r=>{r.life-=dt;r.a*=.998;if(r.life<=0)return false;x.globalAlpha=r.a;x.strokeStyle='#888';x.beginPath();x.arc(r.x*W,r.y*H,10+20*r.type,0,Math.PI*2);x.stroke();return true});x.globalAlpha=1;events=events.filter(o=>drawEvent(o,dt));if(down&&path.length>1){x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=1.5;x.beginPath();x.moveTo(path[0].x,path[0].y);for(const p of path)x.lineTo(p.x,p.y);x.stroke()}requestAnimationFrame(render)}requestAnimationFrame(render);addEventListener('keydown',e=>{if(!started)return;const k=e.key.toUpperCase();const idx='QWERTYUI'.indexOf(k);if(idx>=0){process=idx;ui();spawn(process,.5,.5,.55,'KEY');return}if('1234'.includes(k)){section=Number(k)-1;ui();spawn(5,.5,.5,.45,'SECTION');return}if(k===' '){e.preventDefault();for(let i=0;i<3;i++)setTimeout(()=>spawn((process+i)%8,.25+i*.25,.5,.45,'FILL'),i*90)}if(k==='H')help.style.display=help.style.display==='none'?'block':'none';if(k==='0'){events=[];residue=[];section=0;process=4;ui()}});document.querySelector('#go').onclick=()=>{audio();started=true;document.querySelector('#start').remove();autoEvent()}})();</script></body></html>
