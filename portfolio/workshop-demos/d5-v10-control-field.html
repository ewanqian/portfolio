<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D5 v10 — Fullscreen Control Field / Sonic Revision</title>
<style>
:root{color-scheme:dark;background:#020202;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020202}.stage{position:fixed;inset:0}.stage canvas{position:absolute;inset:0;width:100%;height:100%}.zones{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);z-index:2}.zone{position:relative;border:1px solid rgba(255,255,255,.05);background:transparent;color:#eee;padding:10px;text-align:left;cursor:pointer;touch-action:none}.zone:hover,.zone.active{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.02)}.key{position:absolute;left:10px;top:8px;font-weight:700;font-size:12px;color:rgba(255,255,255,.72)}.name{position:absolute;left:10px;bottom:8px;font-size:8px;letter-spacing:.06em;color:rgba(255,255,255,.32)}.dock{position:absolute;z-index:5;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:5px;padding:5px;border:1px solid rgba(255,255,255,.12);background:rgba(3,3,3,.8);backdrop-filter:blur(12px)}button{height:36px;padding:0 10px;border:1px solid rgba(255,255,255,.14);background:#080808;color:#ddd;font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}button.on{background:#e8e8e3;color:#090909}.hud{position:absolute;z-index:5;left:12px;top:12px;font-size:9px;line-height:1.55;color:rgba(255,255,255,.45);pointer-events:none}.status{position:absolute;z-index:5;right:12px;top:12px;text-align:right;font-size:9px;line-height:1.55;color:rgba(255,255,255,.45);pointer-events:none}.guideOff .zone{border-color:transparent}.guideOff .name{opacity:0}.guideOff .key{opacity:.13}.guideOff .hud,.guideOff .status{opacity:.08}.stageMode .dock{opacity:.13}.stageMode .dock:hover{opacity:1}@media(max-width:720px){.dock{left:8px;right:8px;transform:none;overflow-x:auto}.name{display:none}}
</style>
</head>
<body><main class="stage" id="stage" tabindex="0"><canvas id="c"></canvas><div class="zones" id="zones"></div><div class="hud">D5 v10 · SONIC REVISION<br>144 BPM · D MINOR / SHARED CLOCK</div><div class="status" id="status">READY<br>MASTER +5 dB</div><div class="dock"><button id="play">PLAY</button><button id="auto">AUTO OFF</button><button id="energy">ENERGY 2</button><button id="guide" class="on">GUIDE ON</button><button id="vol">VOL +5</button><button id="full">FULLSCREEN</button><button id="panic">PANIC</button></div></main>
<script>
const $=s=>document.querySelector(s),stage=$('#stage'),c=$('#c'),ctx=c.getContext('2d'),zonesEl=$('#zones'),statusEl=$('#status');
const BPM=144,BEAT=60/BPM,EIGHTH=BEAT/2,LOOK=.12,MAX_VOICES=56,MAX_ACTIVE=5;
const KEYS=['a','s','d','f','j','k','l',';','q','w','e','r','u','i','o','p'];
const M=[
['ROUTE','mid'],['FIELD','low'],['ORBIT','high'],['REWIND','mid'],['CELLS','high'],['PARTITION','mid'],['SCAN','high'],['DROP','low'],
['AIR','fx'],['METAL','high'],['GLASS','high'],['IMPACT','low'],['STUTTER','fx'],['RISE','fx'],['SUCTION','fx'],['RESIDUE','ambient']
].map((x,i)=>({name:x[0],group:x[1],key:KEYS[i].toUpperCase(),base:[50,38,69,74,62,50,65,38,72,83,84,33,69,50,81,45][i],x:(i%4+.5)/4,y:(Math.floor(i/4)+.5)/4,last:-99}));
const SCALE=[0,3,5,7,10],GROUP_CAP={low:1,mid:2,high:2,fx:2,ambient:1};
let W=0,H=0,DPR=1,ac=null,pre=null,master=null,comp=null,lim=null,delay=null,delayFb=null,rev=null,noiseBuf=null,voices=0,running=false,nextTick=0,tick=0,timer=null,auto=0,energy=2,guide=true,masterDb=5,active=[],visuals=[],phase=0,manualGuard=0,stageMode=false;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function midi(n){return 440*Math.pow(2,(n-69)/12)}function db(v){return Math.pow(10,v/20)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function curve(){const a=new Float32Array(44100);for(let i=0;i<a.length;i++){const x=i/(a.length-1)*2-1;a[i]=Math.tanh(2.2*x)}return a}
function ir(sec=1.45){const b=ac.createBuffer(2,ac.sampleRate*sec,ac.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)}return b}
async function audio(){if(!ac)ac=new(AudioContext||webkitAudioContext)();if(ac.state==='suspended')await ac.resume();if(master)return;pre=ac.createGain();pre.gain.value=db(masterDb);const sat=ac.createWaveShaper();sat.curve=curve();sat.oversample='4x';comp=ac.createDynamicsCompressor();comp.threshold.value=-17;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=.005;comp.release.value=.17;lim=ac.createDynamicsCompressor();lim.threshold.value=-3;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.001;lim.release.value=.08;master=ac.createGain();master.gain.value=.9;pre.connect(sat).connect(comp).connect(lim).connect(master).connect(ac.destination);delay=ac.createDelay(1);delay.delayTime.value=.22;delayFb=ac.createGain();delayFb.gain.value=.24;delay.connect(delayFb).connect(delay);delay.connect(comp);rev=ac.createConvolver();rev.buffer=ir();rev.connect(comp);noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
function send(pan=0,wet=.14){const p=ac.createStereoPanner(),dg=ac.createGain(),rg=ac.createGain();p.pan.value=pan;dg.gain.value=wet;rg.gain.value=wet*.75;p.connect(pre);p.connect(dg).connect(delay);p.connect(rg).connect(rev);return p}
function env(t,a,d,r,l){const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(l,t+a);g.gain.exponentialRampToValueAtTime(Math.max(.0002,l*.38),t+a+d);g.gain.exponentialRampToValueAtTime(.0001,t+a+d+r);return g}
function tone(note,t,dur,opt={}){if(!ac||voices>=MAX_VOICES)return;voices++;const o=ac.createOscillator(),o2=ac.createOscillator(),f=ac.createBiquadFilter(),g=env(t,opt.a||.007,dur*.45,dur*.38,opt.g||.05),p=send(opt.pan||0,opt.wet??.14);o.type=opt.type||'triangle';o2.type=opt.type2||'sine';o.frequency.value=midi(note);o2.frequency.value=midi(note)*(opt.detune||1.003);f.type='lowpass';f.frequency.value=opt.cut||2600;f.Q.value=opt.q||1.2;o.connect(f);o2.connect(f);f.connect(g).connect(p);o.start(t);o2.start(t);const stop=t+dur+.8;o.stop(stop);o2.stop(stop);o.onended=()=>voices=Math.max(0,voices-1)}
function kick(t,g=.18){const o=ac.createOscillator(),v=ac.createGain();o.frequency.setValueAtTime(165,t);o.frequency.exponentialRampToValueAtTime(43,t+.11);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(v).connect(pre);o.start(t);o.stop(t+.2)}
function noise(t,dur,g=.018,freq=6500,q=2,pan=0,wet=.08){if(!ac||voices>=MAX_VOICES)return;voices++;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),v=env(t,.002,dur*.28,dur*.65,g),p=send(pan,wet);s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;s.connect(f).connect(v).connect(p);s.start(t);s.stop(t+dur+.1);s.onended=()=>voices=Math.max(0,voices-1)}
function chord(ns,t,d=.7,g=.026,pan=0){ns.forEach((n,i)=>tone(n,t+i*.01,d,{g,type:'sine',type2:'triangle',cut:1400+700*i,pan:pan+(i-1)*.12,wet:.26,a:.05}))}
function octave(base,step=0){const n=base+SCALE[step%SCALE.length];return n}
function clean(){const now=ac?.currentTime||0;active=active.filter(a=>a.end>now);visuals=visuals.filter(v=>v.end>performance.now())}
function occupancy(group){clean();return active.filter(a=>M[a.i].group===group).length}
function canLaunch(i){clean();const now=ac.currentTime;if(active.length>=MAX_ACTIVE)return false;if(occupancy(M[i].group)>=GROUP_CAP[M[i].group])return false;if(now-M[i].last<.14)return false;return true}
async function launch(i,src='manual'){await audio();if(!running)await start();if(!canLaunch(i))return;const now=src==='manual'?Math.ceil(ac.currentTime/EIGHTH)*EIGHTH+.004:ac.currentTime+.02;M[i].last=ac.currentTime;active.push({i,end:now+2.8+energy*.55});visuals.push({i,start:performance.now(),end:performance.now()+3200+energy*500,seed:Math.random()});playVoice(i,now);statusEl.innerHTML=`${M[i].key} · ${M[i].name}<br>ENERGY ${energy} · +${masterDb} dB`;manualGuard=src==='manual'?ac.currentTime+BEAT:manualGuard;zonesEl.children[i]?.classList.add('active');setTimeout(()=>zonesEl.children[i]?.classList.remove('active'),240)}
function playVoice(i,t){const m=M[i],pan=(m.x-.5)*1.4,e=.7+energy*.18,step=(tick+i)%5,n=octave(m.base,step);if(m.name==='FIELD'){chord([38,45,50],t,1.5,.024*e,pan);noise(t+.08,.22,.010*e,2600,1,pan,.32)}else if(m.name==='ROUTE'){for(let k=0;k<4;k++)tone(62+SCALE[(k+step)%5],t+k*EIGHTH,.22,{g:.038*e,cut:3200,pan:(k-1.5)*.2,wet:.20})}else if(m.name==='ORBIT'){for(let k=0;k<3;k++)tone(72+SCALE[(k+step)%5],t+k*.09,.55,{g:.026*e,type:'sine',type2:'triangle',cut:5200,pan:pan*(k%2?1:-1),wet:.34})}else if(m.name==='REWIND'){[74,69,65,62].forEach((nn,k)=>tone(nn,t+k*.12,.5,{g:.027*e,type:'triangle',cut:1800,pan:.45-k*.3,wet:.30}))}else if(m.name==='CELLS'){for(let k=0;k<6;k++)noise(t+k*.065,.035,.010*e,4700+k*500,4,(k%2?-.5:.5),.08)}else if(m.name==='PARTITION'){chord([50,55,60,65],t,1.0,.025*e,pan);tone(74,t+.35,.45,{g:.025*e,cut:4200,pan:-pan,wet:.28})}else if(m.name==='SCAN'){for(let k=0;k<5;k++)tone(65+SCALE[k],t+k*.08,.18,{g:.026*e,type:'triangle',cut:2200+k*600,pan:-.7+k*.35,wet:.16})}else if(m.name==='DROP'){kick(t,.18*e);tone(38,t,.32,{g:.055*e,type:'sine',cut:500,pan:0,wet:.02});noise(t,.08,.016*e,1800,1.2,0,.05)}else if(m.name==='AIR'){noise(t,.42,.018*e,4200,1,pan,.34);noise(t+.03,.25,.010*e,9000,2,-pan,.16)}else if(m.name==='METAL'){tone(83,t,.48,{g:.025*e,type:'sawtooth',type2:'triangle',cut:6000,q:3,pan,wet:.25})}else if(m.name==='GLASS'){tone(84,t,.9,{g:.026*e,type:'sine',type2:'sine',cut:7000,pan,wet:.42})}else if(m.name==='IMPACT'){kick(t,.16*e);noise(t,.12,.018*e,1100,1,0,.08);tone(33,t,.38,{g:.06*e,type:'sine',cut:420,wet:.02})}else if(m.name==='STUTTER'){for(let k=0;k<7;k++)noise(t+k*.045,.025,.008*e,5600,5,k%2?-.4:.4,.05)}else if(m.name==='RISE'){for(let k=0;k<6;k++)tone(50+SCALE[k%5]+12,t+k*.11,.2,{g:.020*e,cut:1800+k*700,pan:-.6+k*.24,wet:.20})}else if(m.name==='SUCTION'){[81,77,72,69].forEach((nn,k)=>tone(nn,t+k*.09,.42,{g:.022*e,type:'sine',cut:2000,pan:.6-k*.4,wet:.38}));noise(t,.35,.012*e,2500,1,0,.30)}else if(m.name==='RESIDUE'){chord([45,50,57],t,1.8,.018*e,pan);noise(t+.2,.5,.008*e,5200,1,pan,.38)}}
async function start(){await audio();if(running)return;running=true;nextTick=ac.currentTime+.05;timer=setInterval(schedule,20);$('#play').textContent='STOP';$('#play').classList.add('on')}
function stop(){running=false;clearInterval(timer);timer=null;$('#play').textContent='PLAY';$('#play').classList.remove('on')}
function schedule(){while(running&&nextTick<ac.currentTime+LOOK){ground(tick,nextTick);if(auto&&tick%8===0&&ac.currentTime>manualGuard){const pool=phase===0?[1,0,15,8]:phase===1?[0,4,5,13,9]:phase===2?[5,2,6,7,11,12]:[3,1,14,15];launch(pool[Math.floor(Math.random()*pool.length)],'auto');phase=(phase+(tick%32===0?1:0))%4}nextTick+=EIGHTH;tick++}}
function ground(k,t){const s=k%8;if(energy>=2&&(s===0||s===4))kick(t,energy===3?.12:.09);if(s%2===1&&energy>=2)noise(t,.028,.006*energy,7600,2,s<4?-.35:.35,.02);if(energy===1&&s===0)tone(38,t,.8,{g:.018,type:'sine',cut:600,wet:.12})}
M.forEach((m,i)=>{const z=document.createElement('button');z.className='zone';z.innerHTML=`<span class="key">${m.key}</span><span class="name">${m.name}</span>`;z.onpointerdown=e=>{e.preventDefault();launch(i)};zonesEl.appendChild(z)});
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase(),i=KEYS.indexOf(k);if(i>=0){e.preventDefault();launch(i)}else if(k===' '){e.preventDefault();launch(Math.floor(Math.random()*8))}else if(k==='a'){auto=(auto+1)%2;$('#auto').textContent=`AUTO ${auto?'ON':'OFF'}`;$('#auto').classList.toggle('on',!!auto)}else if(k==='g'){guide=!guide;stage.classList.toggle('guideOff',!guide)}else if(k==='f')toggleFull();else if(k==='escape')panic()});
function setVol(d){masterDb=clamp(masterDb+d,0,9);if(pre&&ac)pre.gain.setTargetAtTime(db(masterDb),ac.currentTime,.05);$('#vol').textContent=`VOL +${masterDb}`;statusEl.innerHTML=`MASTER +${masterDb} dB<br>LIMITER SAFE`}
function panic(){active=[];visuals=[];statusEl.innerHTML=`RESET<br>MASTER +${masterDb} dB`;if(master&&ac)master.gain.cancelScheduledValues(ac.currentTime)}
function toggleFull(){if(!document.fullscreenElement){stage.requestFullscreen?.();stage.classList.add('stageMode');stageMode=true}else{document.exitFullscreen?.();stage.classList.remove('stageMode');stageMode=false}}
$('#play').onclick=()=>running?stop():start();$('#auto').onclick=()=>{auto=(auto+1)%2;$('#auto').textContent=`AUTO ${auto?'ON':'OFF'}`;$('#auto').classList.toggle('on',!!auto)};$('#energy').onclick=()=>{energy=energy%3+1;$('#energy').textContent=`ENERGY ${energy}`};$('#guide').onclick=()=>{guide=!guide;stage.classList.toggle('guideOff',!guide);$('#guide').textContent=`GUIDE ${guide?'ON':'OFF'}`;$('#guide').classList.toggle('on',guide)};$('#vol').onclick=()=>setVol(masterDb>=9?-9:1);$('#full').onclick=toggleFull;$('#panic').onclick=panic;
function draw(){requestAnimationFrame(draw);ctx.fillStyle='rgba(2,2,2,.16)';ctx.fillRect(0,0,W,H);const now=performance.now();visuals=visuals.filter(v=>v.end>now);for(const v of visuals){const m=M[v.i],p=clamp((now-v.start)/(v.end-v.start),0,1),life=1-p,x=m.x*W,y=m.y*H;ctx.strokeStyle=`rgba(235,238,240,${.08+life*.25})`;ctx.lineWidth=1+life*2;if(['ROUTE','SCAN','RISE','STUTTER'].includes(m.name)){ctx.beginPath();ctx.moveTo(0,y+(p-.5)*H*.15);ctx.lineTo(W,y-(p-.5)*H*.15);ctx.stroke()}else if(['FIELD','RESIDUE','AIR','SUCTION'].includes(m.name)){const r=(.04+p*.42)*Math.min(W,H);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke()}else if(['PARTITION','CELLS'].includes(m.name)){const s=(.08+.18*p)*Math.min(W,H);ctx.strokeRect(x-s,y-s,s*2,s*2)}else{const r=(.02+.17*p)*Math.min(W,H);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(x-r*1.4,y);ctx.lineTo(x+r*1.4,y);ctx.stroke()}}}
draw();
</script></body></html>
