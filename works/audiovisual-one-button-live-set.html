<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#070805" />
<title>One Button Live Set · 音画同源</title>
<meta name="description" content="一个按钮启动的浏览器音画 Live Set。声音与视觉共享同一节拍、步进与段落结构。" />
<style>
:root{color-scheme:dark;--bg:#070805;--ink:#e8eadf;--muted:#8e9388;--line:rgba(232,234,223,.22);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"PingFang SC",sans-serif}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.top{position:fixed;z-index:4;left:18px;right:18px;top:18px;display:flex;justify-content:space-between;pointer-events:none}.kicker,.meta,.timeline-label,.start button,.stop{font:10px/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase}.kicker{color:var(--muted);margin-bottom:6px}.name{font-size:clamp(17px,2vw,26px);font-weight:520;letter-spacing:-.04em}.meta{text-align:right;color:var(--muted)}.meta b{color:var(--ink);font-weight:500}.scene{position:fixed;z-index:4;left:18px;top:50%;transform:translateY(-50%);pointer-events:none}.scene-no{font:11px/1 var(--mono);letter-spacing:.1em;color:var(--muted)}.scene h1{margin:10px 0 0;font-size:clamp(56px,11vw,156px);font-weight:500;line-height:.8;letter-spacing:-.075em}.scene p{margin:16px 0 0;color:var(--muted);font-size:12px;max-width:300px;line-height:1.6}.bottom{position:fixed;z-index:5;left:18px;right:18px;bottom:18px;display:grid;grid-template-columns:1fr auto;gap:8px}.timeline{height:46px;border:1px solid var(--line);background:rgba(7,8,5,.82);backdrop-filter:blur(10px);display:grid;grid-template-columns:repeat(4,1fr);position:relative;overflow:hidden}.part{position:relative;border-right:1px solid var(--line);display:flex;align-items:center;padding:0 12px;color:var(--muted)}.part:last-child{border-right:0}.part.active{color:var(--ink)}.progress{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--ink)}.stop{min-width:92px;border:1px solid rgba(232,234,223,.42);background:rgba(7,8,5,.86);color:var(--ink);cursor:pointer}.stop:hover{background:var(--ink);color:var(--bg)}.start{position:fixed;z-index:10;inset:0;display:grid;place-items:center;background:rgba(7,8,5,.94);transition:opacity .35s ease}.start.hidden{opacity:0;pointer-events:none}.start button{width:min(360px,76vw);height:112px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}.start button:hover{background:var(--ink);color:var(--bg)}.start small{position:absolute;top:calc(50% + 78px);color:var(--muted);font:10px/1.5 var(--mono);text-align:center}.end{position:fixed;z-index:9;inset:0;display:none;place-items:center;background:rgba(7,8,5,.84)}.end.show{display:grid}.end button{width:220px;height:74px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:10px/1 var(--mono);letter-spacing:.09em;cursor:pointer}.end button:hover{background:var(--ink);color:var(--bg)}
@media(max-width:700px){.top{left:10px;right:10px;top:10px}.meta{display:none}.scene{left:14px;top:44%}.scene p{display:none}.bottom{left:10px;right:10px;bottom:10px;grid-template-columns:1fr}.stop{height:42px}.timeline{height:38px}.part{padding:0 7px}.timeline-label{font-size:8px}}
</style>
</head>
<body>
<canvas id="c" aria-label="自动运行的音画 Live Set"></canvas>
<header class="top"><div><div class="kicker">One-button browser performance</div><div class="name">音画同源 · Live Set 01</div></div><div class="meta"><b id="clock">00:00</b><br>112 BPM · 32 BARS · 4 SCENES</div></header>
<section class="scene"><div class="scene-no" id="sceneNo">SCENE 01 / 04</div><h1 id="sceneName">PULSE</h1><p id="sceneDesc">脉冲建立统一时钟。声音与画面不是彼此分析，而是读取同一组 step / beat / bar。</p></section>
<footer class="bottom"><div class="timeline" id="timeline"><div class="part active"><span class="timeline-label">01 PULSE</span></div><div class="part"><span class="timeline-label">02 ROUTE</span></div><div class="part"><span class="timeline-label">03 FOLD</span></div><div class="part"><span class="timeline-label">04 DENSITY</span></div><div class="progress" id="progress"></div></div><button class="stop" id="stop">STOP</button></footer>
<div class="start" id="start"><button id="startBtn">START LIVE SET</button><small>一次点击启动约 69 秒自动演出<br>WebAudio + Canvas · no samples</small></div>
<div class="end" id="end"><button id="replay">REPLAY LIVE SET</button></div>
<script>
(()=>{'use strict';
const C=document.querySelector('#c'),g=C.getContext('2d',{alpha:false}),$=s=>document.querySelector(s),clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const BPM=112,STEP=60/BPM/4,TOTAL_STEPS=32*16,TOTAL=TOTAL_STEPS*STEP,SCENE_STEPS=8*16;let W=0,H=0,dpr=1,ac=null,master=null,noise=null,timer=null,startTime=0,nextTime=0,stepIndex=0,running=false,seed=2147483647,scheduled=[],marks=[];
const scenes=[['PULSE','脉冲建立统一时钟。声音与画面读取同一组 step / beat / bar。'],['ROUTE','输入被组织成路径。节拍触发音高，也触发方向、节点与轨迹。'],['FOLD','一个参数同时影响多个结果：滤波、音区、结构尺度与画面折叠。'],['DENSITY','密度逐步增加，再在最后一个 phrase 收束为单一信号。']];
function rnd(){seed=seed*16807%2147483647;return(seed-1)/2147483646}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function init(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.48;master.connect(ac.destination);noise=ac.createBuffer(1,ac.sampleRate*.16,ac.sampleRate);let d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)}
function osc(t,freq,type='sine',dur=.12,amp=.08,cut=7000){const o=ac.createOscillator(),fil=ac.createBiquadFilter(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);fil.type='lowpass';fil.frequency.setValueAtTime(cut,t);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(amp,t+.006);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(fil).connect(v).connect(master);o.start(t);o.stop(t+dur+.03)}
function hit(t,amp=.045,band=2400){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();s.buffer=noise;f.type='bandpass';f.frequency.value=band;f.Q.value=4;v.gain.setValueAtTime(amp,t);v.gain.exponentialRampToValueAtTime(.0001,t+.055);s.connect(f).connect(v).connect(master);s.start(t);s.stop(t+.07)}
function schedule(i,t){const scene=Math.min(3,Math.floor(i/SCENE_STEPS)),local=i%16,bar=Math.floor(i/16),beat=Math.floor(local/4),onBeat=local%4===0;let x=(local%8)/7,y=.5,e=.28;
if(scene===0){x=(beat+1)/5;y=.52;e=onBeat?.72:.18;if(onBeat){osc(t,55*(beat%2?1.5:1),'sine',.2,.11,800);hit(t,.025,3200)}if(local===6||local===14)osc(t,220*(local===14?1.5:1),'triangle',.1,.035,2400)}
if(scene===1){const seq=[0,7,3,10,5,12,2,9];x=(seq[local%8]%12)/11;y=.72-(seq[local%8]%7)*.055;e=local%2?.34:.64;if(local%2===0)osc(t,110*Math.pow(2,seq[local%8]/12),'triangle',.18,.065,900+x*4500);if(local===4||local===12)hit(t,.045,1500+x*2600)}
if(scene===2){const chord=[0,3,7,10];x=.22+.56*((local%4)/3);y=.28+.18*Math.sin((bar+local)*.7);e=.42+.3*(local%4===0);if(local%4===0)for(let k=0;k<3;k++)osc(t,110*Math.pow(2,(chord[(beat+k)%4]+12*k)/12),'sine',.42,.025,1300+x*3500);if(local===2||local===10)hit(t,.03,5200)}
if(scene===3){const density=clamp((i-3*SCENE_STEPS)/SCENE_STEPS);x=rnd();y=rnd()*.72+.14;e=.25+density*.65;if(local%(density>.6?1:2)===0){const n=43+[0,2,5,7,10,12][Math.floor(rnd()*6)];osc(t,440*Math.pow(2,(n-69)/12),density>.7?'square':'triangle',.08+density*.13,.025+density*.045,700+x*6000)}if(onBeat)hit(t,.025+density*.035,900+y*5000);if(i>TOTAL_STEPS-17){const fade=(TOTAL_STEPS-i)/16;master.gain.setTargetAtTime(.48*fade,t,.04)}}
scheduled.push({i,t,scene,x,y,e,local,bar});}
function scheduler(){while(running&&nextTime<ac.currentTime+.12&&stepIndex<TOTAL_STEPS){schedule(stepIndex,nextTime);nextTime+=STEP;stepIndex++}if(stepIndex>=TOTAL_STEPS&&scheduled.length===0)finish()}
function start(){init();ac.resume().then(()=>{seed=2147483647;scheduled.length=0;marks.length=0;stepIndex=0;master.gain.cancelScheduledValues(ac.currentTime);master.gain.setValueAtTime(.48,ac.currentTime);startTime=ac.currentTime+.08;nextTime=startTime;running=true;$('#start').classList.add('hidden');$('#end').classList.remove('show');timer=setInterval(scheduler,25);scheduler()})}
function stop(showEnd=false){running=false;if(timer){clearInterval(timer);timer=null}scheduled.length=0;marks.length=0;if(master&&ac){master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(.0001,ac.currentTime,.03)}if(showEnd)$('#end').classList.add('show')}
function finish(){stop(true)}
function consume(){if(!ac)return;while(scheduled.length&&scheduled[0].t<=ac.currentTime){const e=scheduled.shift();marks.push({...e,born:performance.now()});const s=e.scene;$('#sceneNo').textContent=`SCENE 0${s+1} / 04`;$('#sceneName').textContent=scenes[s][0];$('#sceneDesc').textContent=scenes[s][1];document.querySelectorAll('.part').forEach((p,k)=>p.classList.toggle('active',k===s))}if(marks.length>120)marks.splice(0,marks.length-120)}
function draw(now){requestAnimationFrame(draw);consume();g.fillStyle='#070805';g.fillRect(0,0,W,H);let current=scheduled[0]?.scene??marks.at(-1)?.scene??0;const grid=64;g.strokeStyle='rgba(232,234,223,.05)';g.lineWidth=.6;for(let x=grid;x<W;x+=grid){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=grid;y<H;y+=grid){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
for(let j=marks.length-1;j>=0;j--){const m=marks[j],age=(now-m.born)/1000,a=clamp(1-age/(current===3?1.4:2.4));if(a<=0){marks.splice(j,1);continue}const x=m.x*W,y=m.y*H,e=m.e;if(m.scene===0){g.strokeStyle=`rgba(232,234,223,${a*(.25+e*.55)})`;g.lineWidth=.8+e;const r=10+age*120*e;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.stroke();g.fillStyle=`rgba(232,234,223,${a})`;g.fillRect(x-2,y-2,4,4)}else if(m.scene===1){g.strokeStyle=`rgba(232,234,223,${a*(.3+e*.5)})`;g.lineWidth=.8+e;const xx=((m.local%2)?W*.78:W*.22);g.beginPath();g.moveTo(x,y);g.lineTo(xx,y);g.lineTo(xx,H*(.2+.6*((m.bar%8)/7)));g.stroke()}else if(m.scene===2){const size=40+e*180;g.strokeStyle=`rgba(232,234,223,${a*.55})`;g.lineWidth=.8;g.save();g.translate(x,y);g.rotate((m.local%4)*Math.PI/8);g.strokeRect(-size/2,-size/2,size,size);g.strokeRect(-size*.28,-size*.28,size*.56,size*.56);g.restore()}else{const len=20+e*260;g.strokeStyle=`rgba(232,234,223,${a*(.22+e*.6)})`;g.lineWidth=.5+e*1.4;g.beginPath();g.moveTo(x-len*.5,y);g.lineTo(x+len*.5,y);g.stroke();if(e>.7){g.beginPath();g.moveTo(x,y-len*.25);g.lineTo(x,y+len*.25);g.stroke()}}}
if(running&&ac){const elapsed=clamp(ac.currentTime-startTime,0,TOTAL),pct=elapsed/TOTAL;$('#progress').style.width=(pct*100)+'%';const sec=Math.floor(elapsed);$('#clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}else if(!running&&stepIndex===0){$('#progress').style.width='0%'}
}
$('#startBtn').addEventListener('click',start);$('#replay').addEventListener('click',start);$('#stop').addEventListener('click',()=>{stop(true)});requestAnimationFrame(draw);
})();
</script>
</body>
</html>
