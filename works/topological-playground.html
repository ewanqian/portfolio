const BY=Object.fromEntries(C.map(c=>[c.id,c]));let W=0,H=0,DPR=1,selected=C[0],hover=null,current=null,pointerDown=false,lastP=null,trail=[],showLinks=false,clean=false,stageMode=false;let ac=null,master=null,comp=null,noiseBuffer=null,running=false,timer=null,nextTick=0,tick=0,voices=0,heat={},visuals=[];
function resize(){const r=stage.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),midi=n=>440*Math.pow(2,(n-69)/12);
function mkNoise(){const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;return b}async function audio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')await ac.resume();if(master)return;master=ac.createGain();master.gain.value=.72;comp=ac.createDynamicsCompressor();comp.threshold.value=-12;comp.knee.value=12;comp.ratio.value=5;comp.attack.value=.003;comp.release.value=.18;master.connect(comp).connect(ac.destination);noiseBuffer=mkNoise()}

async function togglePlay(){await audio();running=!running;if(running){nextTick=ac.currentTime+.04;timer&&clearInterval(timer);timer=setInterval(schedule,18);$('#play').textContent='■';$('#play').classList.add('on')}else{clearInterval(timer);timer=null;$('#play').textContent='▶';$('#play').classList.remove('on')}updateState()}function schedule(){while(running&&nextTick<ac.currentTime+LOOK){for(const c of C){const h=heat[c.id]||0;if(h<.035)continue;const s=tick%c.len,v=c.pattern[s]||0;if(v&&Math.random()<c.prob)playStep(c,nextTick,v,h)}nextTick+=EIGHTH;tick++;for(const id in heat)heat[id]*=.992}}
function playStep(c,t,v,h){const g=c.level*(v===2?1.25:1)*(.35+.65*h),pan=(c.x-.5)*1.3;if(c.g==='F'){if(c.id==='SUB')tone(36,t,.35,.018*g,'sine',600,pan);else if(c.id==='HAZE')noise(t,.08,.012*g,7200,2,pan);else tone(c.id==='DRONE'?45:50,t,.45,.008*g,'triangle',1300,pan)}else if(c.g==='P'){if(c.id==='KICK')kick(t,.075*g);else if(c.id==='GATE')noise(t,.035,.008*g,3600,5,pan);else tone(c.id==='TRIPLET'?69:62,t,.07,.012*g,'square',2800,pan)}else if(c.g==='M')tone(c.id==='ORBIT'?77:69,t,.065,.01*g,'triangle',4500,pan);else if(c.g==='S'){if(c.id==='PARTITION')noise(t,.04,.009*g,5100,6,pan);else{tone(50,t,.18,.01*g,'triangle',1800,pan);tone(c.id==='CHORD'?57:55,t,.18,.007*g,'triangle',2300,-pan)}}else if(c.g==='X'){if(c.id==='IMPACT'){kick(t,.12*g);noise(t,.09,.018*g,1300,1.2,0)}else if(c.id==='RISE')sweep(57,t,.24,.009*g,700,5200,pan);else noise(t,.035,.016*g,c.id==='STROBE'?8600:7000,4,pan)}else{if(c.id==='SILENCE')return;if(c.id==='REWIND')sweep(72,t,.28,.006*g,4500,620,-.35);else noise(t,.12,.005*g,c.id==='SHIMMER'?8200:3200,2,pan)}}
function enter(c){if(current===c)return;if(current)exit(current);current=c;selected=c;heat[c.id]=Math.max(heat[c.id]||0,.76);const t=qTime();if(c.id==='BURST'){noise(t,.09,.026*c.level,7600,2);kick(t+.1,.07*c.level)}else if(c.id==='DROP'||c.id==='IMPACT'){kick(t,.14*c.level);tone(31,t,.8,.032*c.level,'sine',500,0)}else if(c.id==='RISE')sweep(50,t,1.2,.016*c.level,400,6500,.25);else if(c.id==='SUCTION')sweep(74,t,.8,.012*c.level,6000,360,-.3);else if(c.id==='CHORD')[50,57,62].forEach((n,k)=>tone(n,t,1.1,.012*c.level,'triangle',1600+k*350,(k-1)*.22));else if(c.id==='SILENCE'){for(const id in heat)heat[id]*=.25}else playStep(c,t,2,1);visuals.push({type:1,c,t:performance.now()});updateUI()}function exit(c){if(!ac)return;const t=qTime();if(c.g==='X'||c.id==='GATE')noise(t,.18,.008*c.level,3600,1.2);else sweep(65,t,.55,.005*c.level,2200,500,c.x-.5);visuals.push({type:0,c,t:performance.now()});current=null;updateState()}function hit(x,y){for(let i=C.length-1;i>=0;i--){const c=C[i],cx=c.x*W,cy=c.y*H,w=c.w*W,h=c.h*H;if(Math.abs(x-cx)<=w/2&&Math.abs(y-cy)<=h/2)return c}return null}const pos=e=>{const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
stage.addEventListener('pointerdown',async e=>{e.preventDefault();app.focus();await audio();if(!running)await togglePlay();pointerDown=true;lastP={...pos(e),t:performance.now()};const c=hit(lastP.x,lastP.y);if(c)enter(c)});stage.addEventListener('pointermove',e=>{const p=pos(e);hover=hit(p.x,p.y);if(!pointerDown)return;trail.push({...p,t:performance.now()});if(trail.length>120)trail.shift();if(hover&&hover!==current)enter(hover);else if(!hover&&current)exit(current);if(current){const sp=lastP?Math.hypot(p.x-lastP.x,p.y-lastP.y)/Math.max(10,performance.now()-lastP.t):0;heat[current.id]=clamp((heat[current.id]||.7)+sp*.04,.2,1)}lastP={...p,t:performance.now()}});stage.addEventListener('pointerup',()=>{pointerDown=false;if(current)exit(current);lastP=null});stage.addEventListener('pointercancel',()=>{pointerDown=false;if(current)exit(current);lastP=null});
function updateUI(){const c=selected;$('#hero').textContent=c.icon;$('#enterIcon').textContent=c.in;$('#insideIcon').textContent=c.mid;$('#exitIcon').textContent=c.out;$('#selected').textContent=c.icon+' '+K[c.g];$('#next').innerHTML=c.next.filter(id=>BY[id]).map(id=>`<span>${BY[id].icon}</span>`).join('');$('#len').textContent=c.len;$('#prob').value=c.prob;$('#probV').textContent=Math.round(c.prob*100);$('#level').value=c.level;$('#levelV').textContent=Math.round(c.level*100);renderSeq();updateState()}function updateState(){const n=Object.values(heat).filter(v=>v>.08).length;$('#state').textContent=(running?'▶':'○')+' · '+(current?current.icon:'⋯')+' · '+String(n).padStart(2,'0')}function renderSeq(){const c=selected,el=$('#seq');el.innerHTML='';for(let i=0;i<16;i++){const b=document.createElement('button'),v=c.pattern[i]||0;b.className='step '+(i>=c.len?'off':v===2?'accent':v?'on':'off');if(i<c.len&&running&&i===tick%c.len)b.classList.add('play');b.onclick=e=>{if(i>=c.len)return;c.pattern[i]=e.shiftKey?(v===2?0:2):(v?0:1);renderSeq()};el.appendChild(b)}}function rotate(d){const c=selected,a=c.pattern.slice(0,c.len);d>0?a.unshift(a.pop()):a.push(a.shift());c.pattern=a.concat(Array(16-c.len).fill(0));renderSeq()}function density(d){const c=selected,a=c.pattern.slice(0,c.len);if(d>0){const off=a.map((v,i)=>v?null:i).filter(i=>i!==null);if(off.length)a[off[Math.floor(Math.random()*off.length)]]=1}else{const on=a.map((v,i)=>v?i:null).filter(i=>i!==null);if(on.length>1)a[on[Math.floor(Math.random()*on.length)]]=0}c.pattern=a.concat(Array(16-c.len).fill(0));renderSeq()}
$('#rotL').onclick=()=>rotate(-1);$('#rotR').onclick=()=>rotate(1);$('#densM').onclick=()=>density(-1);$('#densP').onclick=()=>density(1);$('#lenBtn').onclick=()=>{selected.len=selected.len===8?12:selected.len===12?16:8;updateUI()};$('#clearBtn').onclick=()=>{selected.pattern=Array(16).fill(0);renderSeq()};$('#resetBtn').onclick=()=>{selected.pattern=selected.base.concat(Array(16-selected.base.length).fill(0));selected.len=selected.base.length;updateUI()};$('#prob').oninput=e=>{selected.prob=+e.target.value;$('#probV').textContent=Math.round(selected.prob*100)};$('#level').oninput=e=>{selected.level=+e.target.value;$('#levelV').textContent=Math.round(selected.level*100)};$('#play').onclick=togglePlay;$('#links').onclick=()=>{showLinks=!showLinks;$('#links').classList.toggle('on',showLinks)};$('#clean').onclick=()=>{clean=!clean;document.body.classList.toggle('clean',clean);$('#clean').classList.toggle('on',clean)};$('#panic').onclick=()=>{heat={};current=null;visuals=[];trail=[];updateState()};async function fs(){const f=document.fullscreenElement||document.webkitFullscreenElement;if(f){try{await(document.exitFullscreen?.()||document.webkitExitFullscreen?.())}catch{}stageMode=false;app.classList.remove('stageMode');setTimeout(resize,60);return}try{const fn=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;if(fn){await fn.call(document.documentElement);setTimeout(resize,60);return}}catch{}stageMode=!stageMode;app.classList.toggle('stageMode',stageMode);setTimeout(resize,60)}$('#fullscreen').onclick=fs;app.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')fs();if(e.key==='Escape'&&stageMode){stageMode=false;app.classList.remove('stageMode');resize()}});
function mini(c,x,y,w,h){const n=c.len,cell=Math.max(2,Math.min(5,(w*.78)/n)),gap=1,total=n*(cell+gap)-gap,x0=x-total/2,yy=y+h*.25,play=tick%n;for(let i=0;i<n;i++){const v=c.pattern[i]||0;ctx.fillStyle=`rgba(255,255,255,${i===play&&running?.9:v===2?.55:v?.28:.06})`;ctx.fillRect(x0+i*(cell+gap),yy,cell,cell*(v?1:.42))}}function chunk(c,time){const x=c.x*W,y=c.y*H,w=c.w*W,h=c.h*H,a=current===c?1:selected===c?.5:.25,ht=heat[c.id]||0;ctx.save();ctx.translate(x,y);ctx.strokeStyle=`rgba(245,245,238,${a})`;ctx.fillStyle=`rgba(245,245,238,${.012+ht*.05})`;ctx.lineWidth=current===c?1.5:1;if(['blob','cloud'].includes(c.shape)){ctx.beginPath();for(let k=0;k<40;k++){const q=k/40*Math.PI*2,rx=w*.47*(1+.06*Math.sin(k*.8+time*.001)),ry=h*.44*(1+.07*Math.cos(k*.7-time*.001)),px=Math.cos(q)*rx,py=Math.sin(q)*ry;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fill();ctx.stroke()}else if(c.shape==='orbit'){ctx.beginPath();ctx.ellipse(0,0,w*.43,h*.42,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(0,0,w*.24,h*.22,0,0,Math.PI*2);ctx.stroke()}else if(c.shape==='star'){ctx.beginPath();for(let k=0;k<16;k++){const q=-Math.PI/2+k*Math.PI/8,r=k%2?Math.min(w,h)*.18:Math.min(w,h)*.45,px=Math.cos(q)*r,py=Math.sin(q)*r;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fill();ctx.stroke()}else if(c.shape==='diamond'||c.shape==='tri'){ctx.beginPath();if(c.shape==='diamond'){ctx.moveTo(0,-h*.45);ctx.lineTo(w*.46,0);ctx.lineTo(0,h*.45);ctx.lineTo(-w*.46,0)}else{ctx.moveTo(0,-h*.46);ctx.lineTo(w*.45,h*.42);ctx.lineTo(-w*.45,h*.42)}ctx.closePath();ctx.fill();ctx.stroke()}else if(c.shape==='route'){ctx.beginPath();ctx.moveTo(-w*.45,h*.15);ctx.bezierCurveTo(-w*.2,-h*.3,w*.18,h*.28,w*.46,-h*.12);ctx.stroke();ctx.beginPath();ctx.moveTo(w*.32,-h*.25);ctx.lineTo(w*.46,-h*.12);ctx.lineTo(w*.3,0);ctx.stroke()}else{ctx.fillRect(-w*.48,-h*.43,w*.96,h*.86);ctx.strokeRect(-w*.48,-h*.43,w*.96,h*.86);if(['partition','gate','cells','steps'].includes(c.shape)){ctx.strokeStyle='rgba(5,5,5,.65)';const n=c.shape==='cells'?4:c.shape==='steps'?3:2;for(let i=1;i<n;i++){ctx.beginPath();ctx.moveTo(-w*.45+i*w*.9/n,-h*.4);ctx.lineTo(-w*.45+i*w*.9/n,h*.4);ctx.stroke()}}}ctx.restore();ctx.fillStyle=`rgba(255,255,255,${current===c?.88:.46})`;ctx.font='700 17px system-ui';ctx.textAlign='center';ctx.fillText(c.icon,x,y-h*.47);mini(c,x,y,w,h)}function links(){if(!showLinks||!selected)return;for(const id of selected.next){const b=BY[id];if(!b)continue;ctx.strokeStyle='rgba(255,255,255,.13)';ctx.setLineDash([4,7]);ctx.beginPath();ctx.moveTo(selected.x*W,selected.y*H);ctx.lineTo(b.x*W,b.y*H);ctx.stroke();ctx.setLineDash([])}}function global(time){const peak=(heat.BURST||0)+(heat.STROBE||0)+(heat.IMPACT||0),field=(heat.DRIFT||0)+(heat.DRONE||0)+(heat.HAZE||0);ctx.fillStyle=`rgba(5,5,5,${.12+Math.min(.08,field*.02)})`;ctx.fillRect(0,0,W,H);if(field>.1){const g=ctx.createRadialGradient(W*.25,H*.68,20,W*.25,H*.68,Math.max(W,H)*.7);g.addColorStop(0,`rgba(245,245,238,${.02+field*.015})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}if((heat.PARTITION||0)>.1){ctx.strokeStyle='rgba(255,255,255,.045)';for(let i=1;i<8;i++){ctx.beginPath();ctx.moveTo(W*i/8,0);ctx.lineTo(W*i/8+Math.sin(time*.001+i)*20,H);ctx.stroke()}}if((heat.ORBIT||0)>.1){ctx.strokeStyle='rgba(255,255,255,.055)';for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(W*.52,H*.45,W*(.14+i*.08),H*(.09+i*.05),time*.00008,0,Math.PI*2);ctx.stroke()}}if(peak>.15){ctx.fillStyle=`rgba(255,255,255,${Math.min(.07,peak*.018)})`;ctx.fillRect(0,0,W,H)}}function trailDraw(now){trail=trail.filter(p=>now-p.t<1200);if(trail.length<2)return;ctx.beginPath();trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='rgba(255,255,255,.14)';ctx.stroke()}function vdraw(now){visuals=visuals.filter(v=>now-v.t<1400);for(const v of visuals){const age=(now-v.t)/1400,q=1-age,x=v.c.x*W,y=v.c.y*H;ctx.strokeStyle=`rgba(255,255,255,${(v.type?.22:.1)*q})`;ctx.beginPath();ctx.arc(x,y,22+age*(v.type?210:150),v.type?0:.2,v.type?Math.PI*2:Math.PI*1.6);ctx.stroke()}}function draw(){requestAnimationFrame(draw);const now=performance.now();ctx.clearRect(0,0,W,H);global(now);links();C.forEach(c=>chunk(c,now));trailDraw(now);vdraw(now);if(running&&now%160<17)renderSeq()}draw();updateUI();
</script>
