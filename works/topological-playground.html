const BY=Object.fromEntries(CHUNKS.map(c=>[c.id,c]));let W=0,H=0,DPR=1,selected=CHUNKS[0],hover=null,current=null,previous=null,pointerDown=false,lastP=null,trail=[],showLinks=false,guide=true,stageMode=false;let ac=null,master=null,comp=null,noiseBuffer=null,running=false,scheduler=null,nextTick=0,tick=0,voices=0,visuals=[],clusterHeat={};function resize(){const r=stage.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function midi(n){return 440*Math.pow(2,(n-69)/12)}function makeNoise(){const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;return b}async function ensureAudio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')await ac.resume();if(master)return;master=ac.createGain();master.gain.value=.72;comp=ac.createDynamicsCompressor();comp.threshold.value=-12;comp.knee.value=12;comp.ratio.value=5;comp.attack.value=.003;comp.release.value=.18;master.connect(comp).connect(ac.destination);noiseBuffer=makeNoise()}function tone(n,t,d,g,type='triangle',cut=2600,pan=0){if(!ac||voices>=MAX_VOICES)return;voices++;const o=ac.createOscillator(),f=ac.createBiquadFilter(),v=ac.createGain(),p=ac.createStereoPanner();o.type=type;o.frequency.value=midi(n);f.type='lowpass';f.frequency.value=cut;f.Q.value=1.8;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(Math.max(.0002,g),t+.006);v.gain.exponentialRampToValueAtTime(.0001,t+d);p.pan.value=pan;o.connect(f).connect(v).connect(p).connect(master);o.start(t);o.stop(t+d+.03);o.onended=()=>voices=Math.max(0,voices-1)}function noise(t,d,g,f=5000,q=2,pan=0){if(!ac||voices>=MAX_VOICES)return;voices++;const s=ac.createBufferSource(),bp=ac.createBiquadFilter(),v=ac.createGain(),p=ac.createStereoPanner();s.buffer=noiseBuffer;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);p.pan.value=pan;s.connect(bp).connect(v).connect(p).connect(master);s.start(t);s.stop(t+d+.02);s.onended=()=>voices=Math.max(0,voices-1)}function sweep(n,t,d,g,a,b,pan=0){if(!ac||voices>=MAX_VOICES)return;voices++;const o=ac.createOscillator(),f=ac.createBiquadFilter(),v=ac.createGain(),p=ac.createStereoPanner();o.type='sawtooth';o.frequency.value=midi(n);f.type='bandpass';f.Q.value=4;f.frequency.setValueAtTime(Math.max(120,a),t);f.frequency.exponentialRampToValueAtTime(Math.max(120,b),t+d*.92);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);p.pan.value=pan;o.connect(f).connect(v).connect(p).connect(master);o.start(t);o.stop(t+d+.03);o.onended=()=>voices=Math.max(0,voices-1)}function kick(t,g=.08){const o=ac.createOscillator(),v=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.11);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(v).connect(master);o.start(t);o.stop(t+.18)}function qTime(){return Math.ceil(ac.currentTime/EIGHTH)*EIGHTH+.002}async function playToggle(){await ensureAudio();running=!running;if(running){nextTick=ac.currentTime+.04;scheduler&&clearInterval(scheduler);scheduler=setInterval(schedule,18);$('#play').textContent='STOP';$('#play').classList.add('on')}else{clearInterval(scheduler);scheduler=null;$('#play').textContent='PLAY';$('#play').classList.remove('on')}updateState()}function schedule(){while(running&&nextTick<ac.currentTime+LOOK){for(const c of CHUNKS){const h=clusterHeat[c.id]||0;if(h<.035)continue;const step=tick%c.len,val=c.pattern[step]||0;if(val&&Math.random()<c.prob)playStep(c,nextTick,val,h)}nextTick+=EIGHTH;tick++;for(const id in clusterHeat)clusterHeat[id]*=.992}}function playStep(c,t,val,heat){const g=c.level*(val===2?1.25:1)*(.35+.65*heat),pan=(c.x-.5)*1.3;switch(c.cluster){case'FIELD':if(c.id==='SUB')tone(36,t,.35,.018*g,'sine',600,pan);else if(c.id==='HAZE')noise(t,.08,.012*g,7200,2,pan);else tone(c.id==='DRONE'?45:50,t,.45,.008*g,'triangle',1300,pan);break;case'PULSE':if(c.id==='KICK')kick(t,.075*g);else if(c.id==='GATE')noise(t,.035,.008*g,3600,5,pan);else tone(c.id==='TRIPLET'?69:62,t,.07,.012*g,'square',2800,pan);break;case'MOTION':tone(c.id==='ORBIT'?77:69,t,.065,.01*g,'triangle',4500,pan);break;case'STRUCT':if(c.id==='PARTITION')noise(t,.04,.009*g,5100,6,pan);else{tone(50,t,.18,.01*g,'triangle',1800,pan);tone(c.id==='CHORD'?57:55,t,.18,.007*g,'triangle',2300,-pan)}break;case'PEAK':if(c.id==='IMPACT'){kick(t,.12*g);noise(t,.09,.018*g,1300,1.2,0)}else if(c.id==='RISE')sweep(57,t,.24,.009*g,700,5200,pan);else noise(t,.035,.016*g,c.id==='STROBE'?8600:7000,4,pan);break;case'RELEASE':if(c.id==='SILENCE')break;if(c.id==='REWIND')sweep(72,t,.28,.006*g,4500,620,-.35);else noise(t,.12,.005*g,c.id==='SHIMMER'?8200:3200,2,pan);break}}function triggerPhrase(c){if(!ac)return;const t=qTime(),g=c.level;clusterHeat[c.id]=Math.max(clusterHeat[c.id]||0,.75);if(c.id==='BURST'){noise(t,.09,.026*g,7600,2);kick(t+.1,.07*g)}else if(c.id==='DROP'||c.id==='IMPACT'){kick(t,.14*g);tone(31,t,.8,.032*g,'sine',500,0)}else if(c.id==='RISE')sweep(50,t,1.2,.016*g,400,6500,.25);else if(c.id==='SUCTION')sweep(74,t,.8,.012*g,6000,360,-.3);else if(c.id==='CHORD'){[50,57,62].forEach((n,k)=>tone(n,t,1.1,.012*g,'triangle',1600+k*350,(k-1)*.22))}else if(c.id==='SILENCE'){for(const id in clusterHeat)clusterHeat[id]*=.25}else playStep(c,t,2,1);visuals.push({type:'enter',c,t:performance.now(),power:c.energy})}function exitPhrase(c){if(!ac)return;const t=qTime();if(c.cluster==='PEAK'||c.id==='GATE')noise(t,.18,.008*c.level,3600,1.2);else sweep(65,t,.55,.005*c.level,2200,500,(c.x-.5));visuals.push({type:'exit',c,t:performance.now(),power:c.energy})}function hit(x,y){for(let i=CHUNKS.length-1;i>=0;i--){const c=CHUNKS[i],cx=c.x*W,cy=c.y*H,w=c.w*W,h=c.h*H;if(Math.abs(x-cx)<=w/2&&Math.abs(y-cy)<=h/2)return c}return null}function enter(c){if(current===c)return;previous=current;if(current)exitPhrase(current);current=c;selected=c;triggerPhrase(c);updateEditor();updateNotes();updateState()}function leave(){if(current){exitPhrase(current);previous=current;current=null;updateState()}}function pos(e){const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}stage.addEventListener('pointerdown',async e=>{e.preventDefault();app.focus();await ensureAudio();if(!running)await playToggle();pointerDown=true;lastP={...pos(e),t:performance.now()};const c=hit(lastP.x,lastP.y);if(c)enter(c)});stage.addEventListener('pointermove',e=>{const p0=pos(e);hover=hit(p0.x,p0.y);if(!pointerDown)return;trail.push({...p0,t:performance.now()});if(trail.length>120)trail.shift();if(hover&&hover!==current)enter(hover);else if(!hover&&current)leave();if(current){const speed=lastP?Math.hypot(p0.x-lastP.x,p0.y-lastP.y)/Math.max(10,performance.now()-lastP.t):0;clusterHeat[current.id]=clamp((clusterHeat[current.id]||.7)+speed*.04,.2,1)}lastP={...p0,t:performance.now()}});stage.addEventListener('pointerup',()=>{pointerDown=false;if(current)leave();lastP=null});stage.addEventListener('pointercancel',()=>{pointerDown=false;if(current)leave();lastP=null});function updateNotes(){const c=selected;$('#notes').innerHTML=`<h3>${c.cn} / ${c.id}</h3><p class="signal">${CLUSTERS[c.cluster].cn} · ${c.note}</p><p>进入：${c.enter}</p><p>区域内：${c.inside}</p><p>离开：${c.exit}</p><p class="soft">建议相邻：${c.next.filter(id=>BY[id]).map(id=>BY[id].cn).join(' / ')}</p>`}function updateState(){stateEl.textContent=`${running?'PLAY':'STOP'} · ${current?'INSIDE '+current.cn:'BETWEEN'} · ACTIVE ${Object.values(clusterHeat).filter(v=>v>.08).length}`}function updateEditor(){const c=selected;$('#editorTitle').textContent=`${c.cn} / ${c.id}`;$('#editorRole').textContent=`${CLUSTERS[c.cluster].cn} · ${c.band} · E ${Math.round(c.energy*100)}`;$('#lenLabel').textContent=`${c.len} STEP`;$('#prob').value=c.prob;$('#probV').textContent=Math.round(c.prob*100)+'%';$('#level').value=c.level;$('#levelV').textContent=Math.round(c.level*100)+'%';renderSeq()}function renderSeq(){const c=selected,el=$('#seq');el.innerHTML='';for(let i=0;i<16;i++){const b=document.createElement('button');b.className='step '+(i>=c.len?'off':((c.pattern[i]||0)===2?'accent':(c.pattern[i]?'on':'off')));if(i<c.len&&running&&i===tick%c.len)b.classList.add('play');b.onclick=e=>{if(i>=c.len)return;const v=c.pattern[i]||0;c.pattern[i]=e.shiftKey?(v===2?0:2):(v?0:1);renderSeq()};el.appendChild(b)}}function rotate(dir){const c=selected,a=c.pattern.slice(0,c.len);dir>0?a.unshift(a.pop()):a.push(a.shift());c.pattern=a.concat(Array(16-c.len).fill(0));renderSeq()}function density(delta){const c=selected,a=c.pattern.slice(0,c.len);if(delta>0){const off=a.map((v,i)=>v?null:i).filter(i=>i!==null);if(off.length)a[off[Math.floor(Math.random()*off.length)]]=1}else{const on=a.map((v,i)=>v?i:null).filter(i=>i!==null);if(on.length>1)a[on[Math.floor(Math.random()*on.length)]]=0}c.pattern=a.concat(Array(16-c.len).fill(0));renderSeq()}$('#rotL').onclick=()=>rotate(-1);$('#rotR').onclick=()=>rotate(1);$('#densM').onclick=()=>density(-1);$('#densP').onclick=()=>density(1);$('#lenBtn').onclick=()=>{selected.len=selected.len===8?12:selected.len===12?16:8;updateEditor()};$('#clearBtn').onclick=()=>{selected.pattern=Array(16).fill(0);renderSeq()};$('#resetBtn').onclick=()=>{selected.pattern=selected.base.concat(Array(16-selected.base.length).fill(0));selected.len=selected.base.length;updateEditor()};$('#prob').oninput=e=>{selected.prob=+e.target.value;$('#probV').textContent=Math.round(selected.prob*100)+'%'};$('#level').oninput=e=>{selected.level=+e.target.value;$('#levelV').textContent=Math.round(selected.level*100)+'%'};$('#play').onclick=playToggle;$('#suggest').onclick=()=>{showLinks=!showLinks;$('#suggest').classList.toggle('on',showLinks)};$('#notesBtn').onclick=()=>{guide=!guide;document.body.classList.toggle('guideOff',!guide);$('#notesBtn').textContent=guide?'NOTES ON':'NOTES OFF';$('#notesBtn').classList.toggle('on',guide)};$('#panic').onclick=()=>{clusterHeat={};current=null;previous=null;visuals=[];trail=[];stateEl.textContent='PANIC / CLEARED'};async function toggleFullscreen(){const fs=document.fullscreenElement||document.webkitFullscreenElement;if(fs){try{await(document.exitFullscreen?.()||document.webkitExitFullscreen?.())}catch(e){}stageMode=false;app.classList.remove('stageMode');$('#fullscreen').textContent='FULLSCREEN';setTimeout(resize,80);return}try{const fn=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;if(fn){await fn.call(document.documentElement);$('#fullscreen').textContent='EXIT FULLSCREEN';setTimeout(resize,80);return}}catch(e){}stageMode=!stageMode;app.classList.toggle('stageMode',stageMode);$('#fullscreen').textContent=stageMode?'EXIT STAGE':'FULLSCREEN';setTimeout(resize,80)}$('#fullscreen').onclick=toggleFullscreen;document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){$('#fullscreen').textContent='FULLSCREEN';setTimeout(resize,60)}});app.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')toggleFullscreen();if(e.key==='Escape'&&stageMode){stageMode=false;app.classList.remove('stageMode');$('#fullscreen').textContent='FULLSCREEN';resize()}});function drawChunk(c,time){const x=c.x*W,y=c.y*H,w=c.w*W,h=c.h*H,active=current===c,sel=selected===c,heat=clusterHeat[c.id]||0;ctx.save();ctx.translate(x,y);ctx.strokeStyle=`rgba(245,245,238,${active?.88:sel?.42:.2})`;ctx.fillStyle=`rgba(245,245,238,${.015+heat*.045})`;ctx.lineWidth=active?1.5:1;if(['blob','cloud'].includes(c.shape)){ctx.beginPath();for(let k=0;k<40;k++){const a=k/40*Math.PI*2,rx=w*.48*(1+.07*Math.sin(k*.8+time*.001)),ry=h*.45*(1+.08*Math.cos(k*.7-time*.001)),px=Math.cos(a)*rx,py=Math.sin(a)*ry;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fill();ctx.stroke()}else if(c.shape==='orbit'){ctx.beginPath();ctx.ellipse(0,0,w*.43,h*.42,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(0,0,w*.24,h*.22,0,0,Math.PI*2);ctx.stroke()}else if(c.shape==='star'){ctx.beginPath();for(let k=0;k<16;k++){const a=-Math.PI/2+k*Math.PI/8,r=k%2?Math.min(w,h)*.18:Math.min(w,h)*.45,px=Math.cos(a)*r,py=Math.sin(a)*r;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fill();ctx.stroke()}else if(c.shape==='diamond'||c.shape==='tri'){ctx.beginPath();if(c.shape==='diamond'){ctx.moveTo(0,-h*.45);ctx.lineTo(w*.46,0);ctx.lineTo(0,h*.45);ctx.lineTo(-w*.46,0)}else{ctx.moveTo(0,-h*.46);ctx.lineTo(w*.45,h*.42);ctx.lineTo(-w*.45,h*.42)}ctx.closePath();ctx.fill();ctx.stroke()}else if(c.shape==='route'){ctx.beginPath();ctx.moveTo(-w*.45,h*.15);ctx.bezierCurveTo(-w*.2,-h*.3,w*.18,h*.28,w*.46,-h*.12);ctx.stroke();ctx.beginPath();ctx.moveTo(w*.32,-h*.25);ctx.lineTo(w*.46,-h*.12);ctx.lineTo(w*.3,0);ctx.stroke()}else{ctx.fillRect(-w*.48,-h*.43,w*.96,h*.86);ctx.strokeRect(-w*.48,-h*.43,w*.96,h*.86);if(c.shape==='partition'||c.shape==='gate'||c.shape==='cells'||c.shape==='steps'){ctx.strokeStyle='rgba(5,5,5,.65)';const n=c.shape==='cells'?4:c.shape==='steps'?3:2;for(let i=1;i<n;i++){ctx.beginPath();ctx.moveTo(-w*.45+i*w*.9/n,-h*.4);ctx.lineTo(-w*.45+i*w*.9/n,h*.4);ctx.stroke()}}}ctx.restore();ctx.fillStyle=`rgba(255,255,255,${active?.8:.35})`;ctx.font='700 8px ui-monospace,monospace';ctx.fillText(c.cn,x-w*.42,y-h*.52);drawMiniSeq(c,x,y,w,h)}function drawMiniSeq(c,x,y,w,h){const n=c.len,cell=Math.max(2,Math.min(5,(w*.8)/n)),gap=1,total=n*(cell+gap)-gap,x0=x-total/2,yy=y+h*.26,play=tick%n;for(let i=0;i<n;i++){const v=c.pattern[i]||0;ctx.fillStyle=`rgba(255,255,255,${i===play&&running?.9:v===2?.55:v?.28:.07})`;ctx.fillRect(x0+i*(cell+gap),yy,cell,cell*(v?1:.45))}}function drawLinks(){if(!showLinks||!selected)return;for(const id of selected.next){const b=BY[id];if(!b)continue;ctx.strokeStyle='rgba(255,255,255,.12)';ctx.setLineDash([4,7]);ctx.beginPath();ctx.moveTo(selected.x*W,selected.y*H);ctx.lineTo(b.x*W,b.y*H);ctx.stroke();ctx.setLineDash([])}}function drawGlobal(time){const peak=(clusterHeat.BURST||0)+(clusterHeat.STROBE||0)+(clusterHeat.IMPACT||0),field=(clusterHeat.DRIFT||0)+(clusterHeat.DRONE||0)+(clusterHeat.HAZE||0);ctx.fillStyle=`rgba(5,5,5,${.12+Math.min(.08,field*.02)})`;ctx.fillRect(0,0,W,H);if(field>.1){const g=ctx.createRadialGradient(W*.25,H*.68,20,W*.25,H*.68,Math.max(W,H)*.7);g.addColorStop(0,`rgba(245,245,238,${.02+field*.015})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}if((clusterHeat.PARTITION||0)>.1){ctx.strokeStyle='rgba(255,255,255,.045)';for(let i=1;i<8;i++){ctx.beginPath();ctx.moveTo(W*i/8,0);ctx.lineTo(W*i/8+Math.sin(time*.001+i)*20,H);ctx.stroke()}}if((clusterHeat.ORBIT||0)>.1){ctx.strokeStyle='rgba(255,255,255,.055)';for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(W*.52,H*.45,W*(.14+i*.08),H*(.09+i*.05),time*.00008,0,Math.PI*2);ctx.stroke()}}if(peak>.15){ctx.fillStyle=`rgba(255,255,255,${Math.min(.07,peak*.018)})`;ctx.fillRect(0,0,W,H)}}function drawTrail(now){trail=trail.filter(p=>now-p.t<1200);if(trail.length<2)return;ctx.beginPath();trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle='rgba(255,255,255,.14)';ctx.stroke()}function drawVisuals(now){visuals=visuals.filter(v=>now-v.t<1400);for(const v of visuals){const age=(now-v.t)/1400,q=1-age,x=v.c.x*W,y=v.c.y*H;if(v.type==='enter'){ctx.strokeStyle=`rgba(255,255,255,${.22*q})`;for(let k=0;k<2;k++){ctx.beginPath();ctx.arc(x,y,20+age*(80+k*130),0,Math.PI*2);ctx.stroke()}}else{ctx.strokeStyle=`rgba(255,255,255,${.1*q})`;ctx.beginPath();ctx.arc(x,y,25+age*160,.2,Math.PI*1.6);ctx.stroke()}}}function draw(){requestAnimationFrame(draw);const now=performance.now();ctx.clearRect(0,0,W,H);drawGlobal(now);drawLinks();CHUNKS.forEach(c=>drawChunk(c,now));drawTrail(now);drawVisuals(now);if(running&&now%150<17)renderSeq()}draw();updateNotes();updateEditor();updateState();
