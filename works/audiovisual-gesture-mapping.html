<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070805"><title>Gesture Mapping</title><style>:root{color-scheme:dark;--bg:#070805;--ink:#e8eadf;--dim:rgba(232,234,223,.22);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.tempo{position:fixed;right:18px;bottom:18px;width:46px;height:46px;border:1px solid var(--dim);background:rgba(7,8,5,.72);color:var(--ink);font:10px/1 var(--mono);cursor:pointer}.tempo.on{background:var(--ink);color:var(--bg)}.axis{position:fixed;left:18px;bottom:18px;width:44px;height:44px;opacity:.38;pointer-events:none}.axis:before,.axis:after{content:"";position:absolute;background:var(--ink)}.axis:before{left:0;bottom:0;width:100%;height:1px}.axis:after{left:0;bottom:0;width:1px;height:100%}@media(max-width:600px){.tempo{right:10px;bottom:10px}.axis{left:10px;bottom:10px}}</style></head><body><canvas id="c"></canvas><div class="axis" aria-hidden="true"></div><button id="tempo" class="tempo" aria-label="toggle 120 BPM accompaniment">120</button><script>(()=>{'use strict';const C=document.querySelector('#c'),g=C.getContext('2d',{alpha:false}),tempo=document.querySelector('#tempo');let W=0,H=0,dpr=1,ac=null,out=null,osc=null,filter=null,gain=null,panner=null,drag=false,last=null,points=[],clock=false,nextBeat=0,timer=0,beat=0;const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function init(){if(ac)return;ac=new(AudioContext||webkitAudioContext)();out=ac.createGain();out.gain.value=.5;out.connect(ac.destination);osc=ac.createOscillator();filter=ac.createBiquadFilter();gain=ac.createGain();panner=ac.createStereoPanner();osc.type='sawtooth';osc.frequency.value=110;filter.type='lowpass';filter.frequency.value=1000;filter.Q.value=3;gain.gain.value=.0001;osc.connect(filter).connect(gain).connect(panner).connect(out);osc.start()}async function wake(){init();if(ac.state!=='running')await ac.resume()}function apply(x,y,speed){if(!ac)return;const now=ac.currentTime;const note=43+Math.round((1-y)*24);const freq=440*Math.pow(2,(note-69)/12);osc.frequency.setTargetAtTime(freq,now,.025);filter.frequency.setTargetAtTime(350+x*7200,now,.03);filter.Q.setTargetAtTime(1.2+speed*9,now,.03);gain.gain.setTargetAtTime(.018+.13*speed,now,.02);panner.pan.setTargetAtTime(x*2-1,now,.03)}function release(){if(ac)gain.gain.setTargetAtTime(.0001,ac.currentTime,.08)}function pos(e){const r=C.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width),y:clamp((e.clientY-r.top)/r.height)}}C.addEventListener('pointerdown',async e=>{await wake();drag=true;C.setPointerCapture?.(e.pointerId);const p=pos(e);last={...p,t:performance.now()};apply(p.x,p.y,.25);points.push({...p,s:.25,t:performance.now()})});C.addEventListener('pointermove',e=>{if(!drag)return;const p=pos(e),now=performance.now(),dt=Math.max(12,now-last.t),dist=Math.hypot(p.x-last.x,p.y-last.y),speed=clamp(dist*1400/dt,.08,1);apply(p.x,p.y,speed);if(now-(points.at(-1)?.t||0)>18)points.push({...p,s:speed,t:now});if(points.length>160)points.shift();last={...p,t:now}});C.addEventListener('pointerup',()=>{drag=false;last=null;release()});tempo.addEventListener('click',async()=>{await wake();clock=!clock;tempo.classList.toggle('on',clock);if(clock){nextBeat=ac.currentTime+.01;beat=0;timer=setInterval(()=>{while(clock&&nextBeat<ac.currentTime+.08){const t=nextBeat,b=beat++;setTimeout(()=>{if(!clock)return;const o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.value=b%4===0?55:82.4;v.gain.setValueAtTime(.03,ac.currentTime);v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.09);o.connect(v).connect(out);o.start();o.stop(ac.currentTime+.1)},Math.max(0,(t-ac.currentTime)*1000));nextBeat+=.5}},25)}else clearInterval(timer)});function draw(now){requestAnimationFrame(draw);g.fillStyle='#070805';g.fillRect(0,0,W,H);g.strokeStyle='rgba(232,234,223,.055)';g.lineWidth=.7;for(let i=1;i<6;i++){g.beginPath();g.moveTo(W*i/6,0);g.lineTo(W*i/6,H);g.stroke()}for(let i=1;i<5;i++){g.beginPath();g.moveTo(0,H*i/5);g.lineTo(W,H*i/5);g.stroke()}if(points.length>1){for(let i=1;i<points.length;i++){const a=clamp(1-(now-points[i].t)/2400),p=points[i-1],q=points[i];if(a<=0)continue;g.strokeStyle=`rgba(232,234,223,${a*(.18+q.s*.7)})`;g.lineWidth=.7+q.s*2.6;g.beginPath();g.moveTo(p.x*W,p.y*H);g.lineTo(q.x*W,q.y*H);g.stroke();const r=2+q.s*11;g.strokeRect(q.x*W-r,q.y*H-r,r*2,r*2)}}while(points.length&&now-points[0].t>2600)points.shift();if(last){const x=last.x*W,y=last.y*H;g.strokeStyle='rgba(232,234,223,.74)';g.lineWidth=1;g.beginPath();g.moveTo(x-18,y);g.lineTo(x+18,y);g.moveTo(x,y-18);g.lineTo(x,y+18);g.stroke()}}requestAnimationFrame(draw)})();</script></body></html>
