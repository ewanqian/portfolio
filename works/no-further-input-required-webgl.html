<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030403">
<title>无需进一步输入 / No Further Input Required</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030403}body{overscroll-behavior:none;touch-action:none}canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#030403}#gate{position:fixed;inset:0;z-index:2;cursor:pointer}#gate:after{content:"";position:absolute;left:50%;bottom:18px;width:7px;height:7px;transform:translateX(-50%);border:1px solid rgba(230,232,220,.34)}#gate.off{display:none}#err{position:fixed;left:14px;bottom:12px;font:10px/1.4 ui-monospace,monospace;color:#cfd0c9;display:none}
</style>
</head>
<body>
<canvas id="stage"></canvas><div id="gate"></div><div id="err"></div>
<script>
(()=>{'use strict';
const LOOP=180, BPM=120;
const canvas=document.getElementById('stage'), gate=document.getElementById('gate'), err=document.getElementById('err');
let start=performance.now(), offset=Math.max(0,Math.min(179.999,Number(new URLSearchParams(location.search).get('t'))||0));
let audio=null, recorder=null, chunks=[], recording=false;
const gl=canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,preserveDrawingBuffer:false,powerPreference:'high-performance'});
if(!gl){err.style.display='block';err.textContent='WebGL 2 required';return;}
const VS=`#version 300 es
precision highp float;
out vec2 v;
void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);v=p;gl_Position=vec4(p*2.0-1.0,0.0,1.0);}`;
const FS=`#version 300 es
precision highp float;
precision highp int;
in vec2 v;
out vec4 O;
uniform vec2 R;
uniform float T;
const ivec2 G=ivec2(45,25);
const vec3 BG=vec3(0.010,0.011,0.009);
const vec3 INK=vec3(0.91,0.92,0.875);
const vec3 ACC=vec3(0.76,0.96,0.18);
float sat(float x){return clamp(x,0.0,1.0);}float sm(float x){x=sat(x);return x*x*(3.0-2.0*x);}float ease(float a,float b,float x){return sm((x-a)/(b-a));}
float band(float x,float a,float b,float e){return ease(a,a+e,x)*(1.0-ease(b-e,b,x));}
float h12(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}float pulse(float x,float c,float w){float d=abs(x-c);return 1.0-sm(d/max(w,1e-4));}
float cell(vec2 f,float pad){vec2 a=step(vec2(pad),f),b=step(f,vec2(1.0-pad));return a.x*a.y*b.x*b.y;}
float qlevel(float v){if(v<.035)return 0.;if(v<.075)return .055;if(v<.13)return .105;if(v<.21)return .17;if(v<.32)return .26;if(v<.46)return .39;if(v<.64)return .56;if(v<.82)return .76;return .96;}
bool onH(ivec2 c,int x0,int x1,int y){return c.y==y&&c.x>=min(x0,x1)&&c.x<=max(x0,x1);}bool onV(ivec2 c,int x,int y0,int y1){return c.x==x&&c.y>=min(y0,y1)&&c.y<=max(y0,y1);}
float routeDist(int id,ivec2 c,out float len){len=1.;
 if(id==0){len=17.;if(onH(c,4,14,5))return float(c.x-4);if(onV(c,14,5,12))return 10.+float(c.y-5);}
 if(id==1){len=18.;if(onV(c,14,12,4))return float(12-c.y);if(onH(c,14,24,4))return 8.+float(c.x-14);}
 if(id==2){len=20.;if(onH(c,24,33,4))return float(c.x-24);if(onV(c,33,4,15))return 9.+float(c.y-4);}
 if(id==3){len=17.;if(onV(c,33,15,9))return float(15-c.y);if(onH(c,33,42,9))return 6.+float(c.x-33);}
 if(id==4){len=21.;if(onH(c,7,29,17))return float(c.x-7);}
 if(id==5){len=17.;if(onV(c,7,17,8))return float(17-c.y);if(onH(c,7,15,8))return 9.+float(c.x-7);}
 return -1.;}
float rain(ivec2 c,float sec,float activity,out float head){head=0.;float col=float(c.x);float sp=3.0+floor(h12(vec2(col,7.1))*7.0);float off=floor(h12(vec2(col,3.7))*25.0);float pos=mod(floor(sec*sp)+off,25.0);float d=pos-float(c.y);if(d<0.)d+=25.;float chosen=step(.34,h12(vec2(col,1.3)));float width=1.0+floor(h12(vec2(col,8.4))*3.0);head=chosen*step(d,.1)*activity;float trail=chosen*step(d,width+2.0)*(1.0-d/(width+2.1))*activity;return max(head,trail*.52);}
float memory(ivec2 c,float sec,float density,float recall,float autonomy){float stepNow=floor(sec*2.0);float born=stepNow-float(c.y);float h=h12(vec2(float(c.x),born*1.37+12.));float h2=h12(vec2(float(c.x)*2.7+5.,born*.73));float exists=step(.77-.12*density-.04*autonomy,h);float important=step(.93-.04*autonomy,h2)*exists;float age=float(c.y)/24.;float fade=mix(.96,.09,pow(age,.76));float base=exists*fade*(.10+.24*density);float diagBase=13.0+floor(h12(vec2(floor(sec/7.0),6.))*15.0);float diagCol=mod(diagBase+float(c.y)*1.62,45.0);float chain=1.0-step(.65,abs(float(c.x)-diagCol));float chainGate=step(.50,h12(vec2(float(c.y),floor(sec/7.0)+9.)));return max(base+important*.08,chain*chainGate*recall*(.24+.52*(1.-age)));}
float sier(ivec2 c,float reveal){int rr=c.y-3;if(rr<0||rr>18)return 0.;int left=22-rr;int dx=c.x-left;if(dx<0||dx>rr*2||(dx&1)!=0)return 0.;int k=dx/2;if((k&rr)!=k)return 0.;return step(float(rr)/18.,reveal);}
float graph(ivec2 c,float sec,float amount,out float accent){accent=0.;float v=0.;float starts[6]=float[6](126.,130.,134.,139.,144.,149.);float dur[6]=float[6](7.,7.,8.,7.,8.,7.);for(int i=0;i<6;i++){float len;float d=routeDist(i,c,len);if(d<0.)continue;float q=sat((sec-starts[i])/dur[i]);float head=q*len;float passed=step(d,head);float h=1.0-smoothstep(0.,1.15,abs(d-head));float residue=passed*(.09+.17*(1.-q));v=max(v,(residue+h*.76)*amount);accent=max(accent,h*amount*step(.01,q)*step(q,.995));}return v;}
void main(){
 vec2 uv=gl_FragCoord.xy/R;float aspect=R.x/R.y,target=16./9.;vec2 p=uv;if(aspect>target){float s=target/aspect;p.x=(uv.x-(1.-s)*.5)/s;}else{float s=aspect/target;p.y=(uv.y-(1.-s)*.5)/s;}if(any(lessThan(p,vec2(0.)))||any(greaterThan(p,vec2(1.)))){O=vec4(BG,1);return;}
 vec2 gg=vec2(p.x,1.-p.y)*vec2(G);ivec2 c=ivec2(floor(gg));vec2 f=fract(gg);if(c.x<0||c.x>=G.x||c.y<0||c.y>=G.y){O=vec4(BG,1);return;}
 float sec=mod(T,180.);
 float wRain=.88*(1.-ease(55.,94.,sec))+.18*(1.-ease(164.,180.,sec));
 float wMem=.12+.92*ease(24.,80.,sec)*(1.-.32*ease(166.,180.,sec));
 float wSier=band(sec,82.,137.,13.);
 float wGraph=band(sec,118.,176.,10.);
 float autonomy=ease(108.,151.,sec), density=.26+.62*band(sec,38.,150.,18.);
 float rainHead=0.;float vr=rain(c,sec,wRain,rainHead);
 float vm=memory(c,sec,density,wSier,autonomy)*wMem;
 float vs=sier(c,sat((sec-82.)/25.))*wSier*(.52+.28*pulse(fract(sec/23.),.5,.18));
 float graphAcc=0.;float vg=graph(c,sec,wGraph,graphAcc);
 float v0=max(max(vr*.76,vm),max(vs,vg));
 if((c.x%5==0)||(c.y%5==0))v0=max(v0,.028+.026*density);
 if(h12(vec2(c)+19.)>.965)v0=max(v0,.075+.05*wMem);
 float body=cell(f,.085);float val=qlevel(v0)*body;
 float inner=cell(fract(f*2.),.16)*step(.52,h12(vec2(c)+floor(sec*.5)))*step(.33,v0)*.12;
 vec3 col=BG+INK*(val+inner);
 col=mix(col,ACC,sat(max(graphAcc,rainHead*.22))*body*.78);
 float edge=min(min(p.x,p.y),min(1.-p.x,1.-p.y));col*=mix(.72,1.,smoothstep(0.,.035,edge));
 O=vec4(col,1.);
}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'shader compile failed');return s}
let program;try{program=gl.createProgram();gl.attachShader(program,sh(gl.VERTEX_SHADER,VS));gl.attachShader(program,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||'link failed')}catch(e){err.style.display='block';err.textContent=e.message;return}
gl.useProgram(program);const uR=gl.getUniformLocation(program,'R'),uT=gl.getUniformLocation(program,'T');
function resize(){const d=Math.min(devicePixelRatio||1,2),w=Math.max(1,Math.floor(innerWidth*d)),h=Math.max(1,Math.floor(innerHeight*d));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}}
function time(){return ((performance.now()-start)/1000+offset)%LOOP}
function frame(){resize();gl.uniform2f(uR,canvas.width,canvas.height);gl.uniform1f(uT,time());gl.drawArrays(gl.TRIANGLES,0,3);if(audio)audio.tick(time());requestAnimationFrame(frame)}requestAnimationFrame(frame);
class AE{constructor(){const AC=window.AudioContext||window.webkitAudioContext;this.c=new AC();this.m=this.c.createGain();this.m.gain.value=.12;this.m.connect(this.c.destination);this.dest=this.c.createMediaStreamDestination();this.m.connect(this.dest);this.last=-1;this.drone()}drone(){const g=this.c.createGain();g.gain.value=.045;const f=this.c.createBiquadFilter();f.type='lowpass';f.frequency.value=180;g.connect(f).connect(this.m);[41.203,55].forEach((hz,i)=>{const o=this.c.createOscillator();o.type=i?'triangle':'sine';o.frequency.value=hz;o.detune.value=i?3:-2;const og=this.c.createGain();og.gain.value=i?.12:.18;o.connect(og).connect(g);o.start()})}ping(hz,a=.02,d=.08){const n=this.c.currentTime,o=this.c.createOscillator(),g=this.c.createGain(),f=this.c.createBiquadFilter();o.type='sine';o.frequency.value=hz;f.type='lowpass';f.frequency.value=760;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(a,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(f).connect(g).connect(this.m);o.start(n);o.stop(n+d+.03)}tick(t){const k=Math.floor(t*.8);if(k!==this.last){this.last=k;if(t<118&&k%3===0)this.ping([55,61.735,73.416,82.407][k%4],.014,.07);if(t>=118&&k%2===0)this.ping([55,73.416,82.407,110][k%4],.022,.09)}}}
async function enter(){gate.classList.add('off');if(!audio){audio=new AE();await audio.c.resume()}else if(audio.c.state==='suspended')await audio.c.resume();if(!document.fullscreenElement)try{await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch(e){}}
gate.addEventListener('pointerdown',enter,{once:true});
addEventListener('keydown',async e=>{const k=e.key.toLowerCase();if(k==='s')await enter();if(k==='f'){if(!document.fullscreenElement)try{await document.documentElement.requestFullscreen()}catch(e){}else document.exitFullscreen()}if(k==='0'){offset=0;start=performance.now()}if('1234'.includes(k)){offset={1:8,2:60,3:102,4:140}[k];start=performance.now()}if(k==='r'){if(!recording){const stream=canvas.captureStream(60);if(audio)for(const tr of audio.dest.stream.getAudioTracks())stream.addTrack(tr);const mt=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'';chunks=[];recorder=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:26000000}:undefined);recorder.ondataavailable=x=>{if(x.data&&x.data.size)chunks.push(x.data)};recorder.onstop=()=>{const b=new Blob(chunks,{type:recorder.mimeType||'video/webm'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='no-further-input-required-four-state.webm';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};recorder.start(1000);recording=true}else{recording=false;recorder.stop()}}});
})();
</script>
</body></html>
