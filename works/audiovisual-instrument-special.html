<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070805"><title>音画同源乐器 · Five-State Instrument</title><meta name="description" content="五个可切换的浏览器音画演奏状态，共享 WebAudio 与 Canvas 时钟。"><style>:root{color-scheme:dark;--bg:#070805;--ink:#e8eadf;--dim:rgba(232,234,223,.22);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.states{position:fixed;z-index:6;left:18px;bottom:18px;display:flex;gap:7px}.state{width:28px;height:46px;border:0;background:transparent;cursor:pointer;position:relative}.state:before{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;transform:translate(-50%,-50%);border:1px solid rgba(232,234,223,.34);transition:width .16s,background .16s}.state.on:before{width:20px;background:var(--ink);border-color:var(--ink)}.tempo{position:fixed;z-index:6;right:18px;bottom:18px;width:52px;height:46px;border:1px solid var(--dim);background:rgba(7,8,5,.72);color:var(--ink);font:10px/1 var(--mono);cursor:pointer}.tempo.on{background:var(--ink);color:var(--bg)}.bpm{position:fixed;z-index:5;right:78px;bottom:18px;width:110px;height:46px;opacity:0;transition:opacity .15s}.bpm:hover,.bpm:focus{opacity:1}@media(max-width:600px){.states{left:10px;bottom:10px}.tempo{right:10px;bottom:10px}.bpm{right:68px;bottom:10px;width:90px}}</style></head><body><canvas id="c"></canvas><nav id="states" class="states" aria-label="five performance states"></nav><input id="bpm" class="bpm" type="range" min="72" max="156" value="120" step="1" aria-label="BPM"><button id="tempo" class="tempo" aria-label="toggle BPM accompaniment">120</button><script>(()=>{'use strict';const C=document.querySelector('#c'),g=C.getContext('2d',{alpha:false}),nav=document.querySelector('#states'),tempo=document.querySelector('#tempo'),bpm=document.querySelector('#bpm');const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));let W=0,H=0,dpr=1,ac=null,out=null,noise=null,state=0,BPM=120,clock=false,nextStep=0,step=0,timer=0,events=[],drag=false,last=null,cont=null,pattern=[1,0,0,1,0,1,0,0];for(let i=0;i<5;i++){const b=document.createElement('button');b.className='state'+(i===0?' on':'');b.dataset.i=i;b.setAttribute('aria-label','state '+(i+1));nav.appendChild(b)}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function init(){if(ac)return;ac=new(AudioContext||webkitAudioContext)();out=ac.createGain();out.gain.value=.42;out.connect(ac.destination);noise=ac.createBuffer(1,ac.sampleRate*.08,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)}async function wake(){init();if(ac.state!=='running')await ac.resume()}function tone(freq,amp=.07,dur=.16,type='triangle',cut=5000,when=null){const t=when??ac.currentTime,o=ac.createOscillator(),f=ac.createBiquadFilter(),v=ac.createGain();o.type=type;o.frequency.value=freq;f.type='lowpass';f.frequency.value=cut;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(amp,t+.006);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f).connect(v).connect(out);o.start(t);o.stop(t+dur+.03)}function hit(amp=.025,band=2600,when=null){const t=when??ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();s.buffer=noise;f.type='bandpass';f.frequency.value=band;f.Q.value=5;v.gain.setValueAtTime(amp,t);v.gain.exponentialRampToValueAtTime(.0001,t+.045);s.connect(f).connect(v).connect(out);s.start(t)}function setState(i){state=(i+5)%5;[...nav.children].forEach((b,k)=>b.classList.toggle('on',k===state));events.push({kind:'switch',state,t:performance.now(),x:.5,y:.5,e:.8,seed:Math.random()});stopContinuous()}nav.addEventListener('click',async e=>{const b=e.target.closest('.state');if(!b)return;await wake();setState(+b.dataset.i)});addEventListener('keydown',async e=>{const i='12345'.indexOf(e.key);if(i>=0){await wake();setState(i)}if(e.key.toLowerCase()==='b')tempo.click()});function pos(e){const r=C.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width),y:clamp((e.clientY-r.top)/r.height)}}function stopContinuous(){if(cont&&ac){cont.g.gain.setTargetAtTime(.0001,ac.currentTime,.06);setTimeout(()=>{try{cont.o.stop()}catch{}},180)}cont=null}function startContinuous(x,y,s=.25){if(!ac)return;stopContinuous();const o=ac.createOscillator(),f=ac.createBiquadFilter(),v=ac.createGain(),p=ac.createStereoPanner();o.type='sawtooth';f.type='lowpass';f.Q.value=3;v.gain.value=.0001;o.connect(f).connect(v).connect(p).connect(out);o.start();cont={o,f,g:v,p};updateContinuous(x,y,s)}function updateContinuous(x,y,s){if(!cont||!ac)return;const n=43+Math.round((1-y)*24),freq=440*Math.pow(2,(n-69)/12),t=ac.currentTime;cont.o.frequency.setTargetAtTime(freq,t,.02);cont.f.frequency.setTargetAtTime(350+x*6500,t,.03);cont.f.Q.setTargetAtTime(1+s*8,t,.03);cont.g.gain.setTargetAtTime(.015+s*.11,t,.02);cont.p.pan.setTargetAtTime(x*2-1,t,.03)}function perform(x,y,e=.55){const now=performance.now();if(state===0){tone(55*(y<.45?2:1),.06+e*.07,.18,'sine',1000+x*4200);events.push({kind:'pulse',state,x,y,e,t:now,seed:Math.random()})}else if(state===1){const zone=Math.min(4,Math.floor(x*5)),roots=[55,73.42,98,130.81,174.61];tone(roots[zone]*(y<.45?2:1),.055+e*.05,.12+.03*zone,zone===4?'square':'triangle',900+x*6000);if(zone===0||zone===3)hit(.025,1500+zone*900);events.push({kind:'cell',state,x,y,e,zone,t:now,seed:Math.random()})}else if(state===2){if(!cont)startContinuous(x,y,e);else updateContinuous(x,y,e);events.push({kind:'trace',state,x,y,e,t:now,seed:Math.random()})}else if(state===3){const col=Math.min(7,Math.floor(x*8));pattern[col]=pattern[col]?0:1;tone(110*Math.pow(2,(col%5)/12),.045,.11,'triangle',1200+col*500);events.push({kind:'stepEdit',state,x:(col+.5)/8,y:.62,e:.5,col,t:now,seed:Math.random()})}else{const roots=[41.2,55,82.4];for(let k=0;k<3;k++)tone(roots[k]*(1+x*.35),.025+e*.035,.18+k*.08,k===2?'square':'triangle',700+x*5000);hit(.02+e*.04,1400+y*4200);events.push({kind:'stack',state,x,y,e,t:now,seed:Math.random()})}}C.addEventListener('pointerdown',async e=>{await wake();drag=true;C.setPointerCapture?.(e.pointerId);const p=pos(e);last={...p,t:performance.now()};perform(p.x,p.y,.48)});C.addEventListener('pointermove',e=>{if(!drag)return;const p=pos(e),now=performance.now(),dt=Math.max(12,now-last.t),dist=Math.hypot(p.x-last.x,p.y-last.y),speed=clamp(dist*1400/dt,.1,1);if(state===2||now-(events.at(-1)?.t||0)>70)perform(p.x,p.y,speed);last={...p,t:now}});C.addEventListener('pointerup',()=>{drag=false;last=null;if(state===2)stopContinuous()});function scheduleStep(s,t){if(state===3&&pattern[s%8]){const col=s%8;tone(t?110:110,.04,.09,'triangle',1400+col*550,t);const delay=Math.max(0,(t-ac.currentTime)*1000);setTimeout(()=>events.push({kind:'step',state:3,x:(col+.5)/8,y:.48,e:.45,col,t:performance.now(),seed:.5}),delay)}if(clock&&s%4===0){hit(s%16===0?.026:.012,s%16===0?1200:3200,t);const delay=Math.max(0,(t-ac.currentTime)*1000);setTimeout(()=>events.push({kind:'beat',state,x:(s%16)/15,y:.88,e:s%16===0?.35:.18,t:performance.now(),seed:.5}),delay)}}function startClock(){nextStep=ac.currentTime+.03;step=0;timer=setInterval(()=>{if(!clock)return;const dur=60/BPM/4;while(nextStep<ac.currentTime+.1){scheduleStep(step++,nextStep);nextStep+=dur}},25)}tempo.addEventListener('click',async()=>{await wake();clock=!clock;tempo.classList.toggle('on',clock);if(clock&&!timer)startClock();if(clock)nextStep=ac.currentTime+.03});bpm.addEventListener('input',()=>{BPM=+bpm.value;tempo.textContent=BPM});function draw(now){requestAnimationFrame(draw);g.fillStyle='#070805';g.fillRect(0,0,W,H);if(state===3){for(let c=0;c<8;c++){const x=(c+.5)*W/8;g.strokeStyle=pattern[c]?'rgba(232,234,223,.58)':'rgba(232,234,223,.12)';g.strokeRect(x-4,H*.62-4,8,8)}}for(let i=events.length-1;i>=0;i--){const q=events[i],age=(now-q.t)/1000,a=clamp(1-age/2.2);if(a<=0){events.splice(i,1);continue}const x=q.x*W,y=q.y*H,p=age*(80+q.e*180);g.strokeStyle=`rgba(232,234,223,${a*(.16+q.e*.62)})`;g.fillStyle=`rgba(232,234,223,${a*(.24+q.e*.65)})`;g.lineWidth=.7+q.e*1.4;if(q.kind==='switch'){const r=24+p;g.strokeRect(W/2-r,H/2-r,r*2,r*2);continue}if(q.state===0){g.beginPath();g.arc(x,y,10+p,0,Math.PI*2);g.stroke()}else if(q.state===1){const z=q.zone??0;if(z===0){g.beginPath();g.arc(x,y,10+p,0,Math.PI*2);g.stroke()}else if(z===1){for(let k=-2;k<=2;k++){g.beginPath();g.moveTo(x-p,y+k*8);g.lineTo(x+p,y+k*8);g.stroke()}}else if(z===2){const s=18+p*.7;g.strokeRect(x-s,y-s,s*2,s*2)}else if(z===3){g.beginPath();g.moveTo(x-p*.6,y);g.lineTo(x,y);g.lineTo(x,y+p*.55);g.lineTo(x+p*.7,y+p*.55);g.stroke()}else{for(let k=0;k<8;k++){const ang=k*Math.PI/4;g.beginPath();g.moveTo(x+Math.cos(ang)*12,y+Math.sin(ang)*12);g.lineTo(x+Math.cos(ang)*(25+p),y+Math.sin(ang)*(25+p));g.stroke()}}}else if(q.state===2){g.beginPath();g.moveTo(x-p*.35,y);g.lineTo(x+p*.35,y);g.stroke();g.strokeRect(x-3-q.e*7,y-3-q.e*7,6+q.e*14,6+q.e*14)}else if(q.state===3){g.beginPath();g.moveTo(x,y-p*.45);g.lineTo(x,y+p*.45);g.stroke();g.beginPath();g.arc(x,y,8+p*.25,0,Math.PI*2);g.stroke()}else{const n=6+Math.floor(q.e*8);for(let k=0;k<n;k++){const ang=k/n*Math.PI*2+q.seed;g.beginPath();g.moveTo(x+Math.cos(ang)*14,y+Math.sin(ang)*14);g.lineTo(x+Math.cos(ang)*(35+p),y+Math.sin(ang)*(35+p));g.stroke()}const r=18+p*.32;g.strokeRect(x-r,y-r,r*2,r*2)}}}requestAnimationFrame(draw)})();</script></body></html>
