<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070805"><title>Step Pattern</title><style>:root{color-scheme:dark;--bg:#070805;--ink:#e8eadf;--dim:rgba(232,234,223,.22);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.tempo{position:fixed;right:18px;bottom:18px;width:54px;height:46px;border:1px solid var(--dim);background:rgba(7,8,5,.72);color:var(--ink);font:10px/1 var(--mono);cursor:pointer}.tempo.on{background:var(--ink);color:var(--bg)}.bpm{position:fixed;left:18px;bottom:18px;width:120px;height:46px;opacity:0;transition:opacity .15s}.bpm:hover,.bpm:focus{opacity:1}@media(max-width:600px){.tempo{right:10px;bottom:10px}.bpm{left:10px;bottom:10px}}</style></head><body><canvas id="c"></canvas><input id="bpm" class="bpm" type="range" min="72" max="156" value="120" step="1" aria-label="BPM"><button id="tempo" class="tempo on" aria-label="start stop sequencer">120</button><script>(()=>{'use strict';const C=document.querySelector('#c'),g=C.getContext('2d',{alpha:false}),tempo=document.querySelector('#tempo'),bpm=document.querySelector('#bpm');const COLS=8,ROWS=5,grid=Array.from({length:ROWS},()=>Array(COLS).fill(false));grid[0][0]=grid[0][4]=grid[2][2]=grid[2][6]=grid[4][3]=grid[4][7]=true;let W=0,H=0,dpr=1,ac=null,out=null,running=true,nextStep=0,step=0,timer=0,current=-1,flashes=[],BPM=120;const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function init(){if(ac)return;ac=new(AudioContext||webkitAudioContext)();out=ac.createGain();out.gain.value=.34;out.connect(ac.destination)}async function wake(){init();if(ac.state!=='running')await ac.resume();if(!timer)startClock()}function tone(t,row,col){const notes=[72,67,62,55,48],o=ac.createOscillator(),f=ac.createBiquadFilter(),v=ac.createGain();o.type=row===0?'square':row===4?'sine':'triangle';o.frequency.value=440*Math.pow(2,(notes[row]-69)/12);f.type='lowpass';f.frequency.value=900+col*600;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.055,t+.006);v.gain.exponentialRampToValueAtTime(.0001,t+.13);o.connect(f).connect(v).connect(out);o.start(t);o.stop(t+.16)}function schedule(s,t){const col=s%COLS;for(let row=0;row<ROWS;row++)if(grid[row][col]){tone(t,row,col);setTimeout(()=>flashes.push({row,col,t:performance.now()}),Math.max(0,(t-ac.currentTime)*1000))}setTimeout(()=>current=col,Math.max(0,(t-ac.currentTime)*1000))}function startClock(){nextStep=ac.currentTime+.03;timer=setInterval(()=>{if(!running)return;const dur=60/BPM/2;while(nextStep<ac.currentTime+.1){schedule(step++,nextStep);nextStep+=dur}},25)}function hitCell(x,y){const marginX=W*.12,marginY=H*.16,gw=W*.76,gh=H*.64,col=Math.floor((x-marginX)/(gw/COLS)),row=Math.floor((y-marginY)/(gh/ROWS));if(col<0||col>=COLS||row<0||row>=ROWS)return;grid[row][col]=!grid[row][col];flashes.push({row,col,t:performance.now(),edit:true})}C.addEventListener('pointerdown',async e=>{await wake();const r=C.getBoundingClientRect();hitCell(e.clientX-r.left,e.clientY-r.top)});tempo.addEventListener('click',async()=>{await wake();running=!running;tempo.classList.toggle('on',running);if(running)nextStep=ac.currentTime+.03});bpm.addEventListener('input',()=>{BPM=+bpm.value;tempo.textContent=BPM});tempo.textContent=BPM;function draw(now){requestAnimationFrame(draw);g.fillStyle='#070805';g.fillRect(0,0,W,H);const mx=W*.12,my=H*.16,gw=W*.76,gh=H*.64,cw=gw/COLS,ch=gh/ROWS;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=mx+(c+.5)*cw,y=my+(r+.5)*ch,active=grid[r][c];g.strokeStyle=active?'rgba(232,234,223,.8)':'rgba(232,234,223,.16)';g.fillStyle=active?'rgba(232,234,223,.72)':'rgba(232,234,223,.06)';const s=Math.min(cw,ch)*.15;g.strokeRect(x-s,y-s,s*2,s*2);if(active)g.fillRect(x-1.5,y-1.5,3,3)}if(current>=0){const x=mx+(current+.5)*cw;g.strokeStyle='rgba(232,234,223,.34)';g.lineWidth=1;g.beginPath();g.moveTo(x,my-ch*.25);g.lineTo(x,my+gh+ch*.25);g.stroke()}for(let i=flashes.length-1;i>=0;i--){const q=flashes[i],age=(now-q.t)/1000,a=clamp(1-age/1.1);if(a<=0){flashes.splice(i,1);continue}const x=mx+(q.col+.5)*cw,y=my+(q.row+.5)*ch,p=age*140;g.strokeStyle=`rgba(232,234,223,${a*.7})`;g.lineWidth=.8;g.beginPath();g.arc(x,y,8+p,0,Math.PI*2);g.stroke();if(q.row%2===0){g.beginPath();g.moveTo(x-p,y);g.lineTo(x+p,y);g.stroke()}else{g.beginPath();g.moveTo(x,y-p);g.lineTo(x,y+p);g.stroke()}}}requestAnimationFrame(draw);setTimeout(wake,0)})();</script></body></html>
