<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>No Further Input Required — 3 Minute Study</title>
<meta name="description" content="《无需进一步输入》三分钟网页作品测试：从分解三角形出发，围绕输入、沉积、回返与余项建立连续视觉结构。">
<style>
:root{color-scheme:dark;--bg:#050505;--ink:#efefe8;--muted:rgba(239,239,232,.42);--line:rgba(239,239,232,.18);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"PingFang SC",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.start{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#050505;transition:opacity .65s ease}
.start.off{opacity:0;pointer-events:none}
.start-inner{width:min(620px,calc(100vw - 48px));text-align:center}
.title{font-size:clamp(27px,5.4vw,64px);line-height:.96;letter-spacing:-.05em;margin-bottom:18px;font-weight:500}
.title span{display:block;font-size:.48em;color:var(--muted);font-weight:400;margin-top:10px;letter-spacing:-.025em}
.sub{font:10px/1.75 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:30px}
.start button{width:100%;height:68px;border:1px solid rgba(239,239,232,.38);background:transparent;color:var(--ink);font:10px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
.start button:hover{background:var(--ink);color:var(--bg)}
.debug{position:fixed;left:14px;bottom:12px;z-index:3;font:9px/1.55 var(--mono);letter-spacing:.08em;color:rgba(239,239,232,.22);pointer-events:none;transition:opacity .3s}
.debug.hide{opacity:0}
</style>
</head>
<body>
<canvas id="c" aria-label="No Further Input Required 3 minute visual study"></canvas>
<div class="debug" id="debug"></div>
<div class="start" id="start">
  <div class="start-inner">
    <div class="title">无需进一步输入<span>No Further Input Required</span></div>
    <div class="sub">3 minute web study · partition / route / field / residue<br>headphones optional</div>
    <button id="enter">ENTER / 点击开始</button>
  </div>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});
const debug=document.getElementById('debug');
const start=document.getElementById('start');
const enter=document.getElementById('enter');
const TAU=Math.PI*2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453123;return x-Math.floor(x)};
let W=0,H=0,DPR=1,started=false,startTime=0,last=0,cycle=0;
let memory=[],routes=[],fields=[],seeds=[];
let ac=null,master=null,nextPulse=0;

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);
}
addEventListener('resize',resize);resize();

function audioStart(){
  if(ac)return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=.18;master.connect(ac.destination);
  nextPulse=ac.currentTime+.1;
}
function tone(freq,when,dur=.18,g=.05,type='sine'){
  if(!ac)return;
  const o=ac.createOscillator(),a=ac.createGain(),f=ac.createBiquadFilter();
  o.type=type;o.frequency.setValueAtTime(freq,when);
  f.type='lowpass';f.frequency.setValueAtTime(Math.max(240,freq*5),when);f.Q.value=.7;
  a.gain.setValueAtTime(.0001,when);a.gain.exponentialRampToValueAtTime(Math.max(.0002,g),when+.012);a.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(f);f.connect(a);a.connect(master);o.start(when);o.stop(when+dur+.04);
}
function soundTick(p,phase){
  if(!ac)return;
  const now=ac.currentTime;
  if(now<nextPulse)return;
  const base=[110,82.41,123.47,73.42][phase];
  const rate=phase===0?1.2:phase===1?.62:phase===2?.44:1.55;
  tone(base*(phase===2?2:1),now,.12+phase*.05,.022+phase*.012,phase===2?'triangle':'sine');
  if(phase===2&&Math.random()<.38)tone(base*3,now+.07,.08,.012,'sine');
  nextPulse=now+rate*(.88+Math.random()*.25);
}

function stageInfo(t){
  if(t<35)return{phase:0,name:'REGISTRATION',local:t/35};
  if(t<85)return{phase:1,name:'ABSORPTION',local:(t-35)/50};
  if(t<135)return{phase:2,name:'RECALL',local:(t-85)/50};
  return{phase:3,name:'REMAINDER',local:(t-135)/45};
}

function invertedTriangle(cx,top,size){
  return[{x:cx-size*.5,y:top},{x:cx+size*.5,y:top},{x:cx,y:top+size*.86}];
}
function mix(a,b,t){return{x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)}}
function centroid(tr){return{x:(tr[0].x+tr[1].x+tr[2].x)/3,y:(tr[0].y+tr[1].y+tr[2].y)/3}}
function subdivide(tr,depth,seed,out){
  if(depth<=0){out.push({tr,seed,depth});return}
  const r=.38+hash(seed*3.17)*.24;
  const a=tr[0],b=tr[1],c=tr[2];
  const ab=mix(a,b,r),bc=mix(b,c,.46+hash(seed+2)*.18),ca=mix(c,a,.44+hash(seed+5)*.12);
  const center={x:(ab.x+bc.x+ca.x)/3,y:(ab.y+bc.y+ca.y)/3};
  const children=[[a,ab,center],[ab,b,bc],[center,bc,c],[a,center,ca],[ca,center,c]];
  children.forEach((child,i)=>subdivide(child,depth-1,seed*7+i+1,out));
}
function makeSeed(strength=.5,forced=null){
  const size=Math.min(W,H)*(.30+Math.random()*.28);
  const cx=forced?.x??W*(.23+Math.random()*.54);
  const top=forced?.y??H*(.08+Math.random()*.28);
  const depth=strength>.75?3:strength>.38?2:1;
  const tris=[];subdivide(invertedTriangle(cx,top,size),depth,Math.random()*1000,tris);
  const s={id:Math.random()*1e9,born:performance.now(),strength,tris,cx,top,size,life:26000+strength*36000,drift:(Math.random()-.5)*.045,ghost:false};
  seeds.push(s);
  tris.forEach((item,i)=>{
    if(Math.random()<.28+strength*.25)memory.push({type:'tri',tr:item.tr.map(p=>({...p})),born:performance.now(),life:55000+Math.random()*80000,a:.05+strength*.1,shift:(Math.random()-.5)*18});
  });
  const centers=tris.map(x=>centroid(x.tr));
  if(centers.length>2){
    routes.push({pts:centers.filter((_,i)=>i%Math.max(1,Math.floor(centers.length/7))===0),born:performance.now(),life:26000+strength*42000,a:.08+strength*.14,reverse:false});
  }
  centers.slice(0,Math.min(14,centers.length)).forEach((p,i)=>{
    if(i%2===0)fields.push({x:p.x,y:p.y,born:performance.now(),life:22000+Math.random()*48000,r:2+Math.random()*8,a:.06+strength*.11,phase:Math.random()*TAU});
  });
}
function recallSeed(){
  if(memory.length<3)return makeSeed(.55);
  const choices=memory.filter(m=>m.type==='tri');
  if(!choices.length)return;
  const src=choices[Math.floor(Math.random()*choices.length)];
  const c=centroid(src.tr),dx=(W*.5-c.x)*(.15+Math.random()*.5),dy=(H*.48-c.y)*(.1+Math.random()*.35);
  const tr=src.tr.map((p,i)=>({x:p.x+dx+(i-1)*7,y:p.y+dy+Math.sin(i*2.1)*9}));
  const tris=[];subdivide(tr,1+Math.floor(Math.random()*2),Math.random()*1000,tris);
  seeds.push({id:Math.random()*1e9,born:performance.now(),strength:.72,tris,cx:c.x+dx,top:c.y+dy,size:140,life:36000,drift:(Math.random()-.5)*.03,ghost:true});
}

function spawn(t,phase,local){
  const now=performance.now();
  if(phase===0){
    const interval=9000-3500*smooth(local);
    if(!seeds.length||now-seeds[seeds.length-1].born>interval)makeSeed(.25+.25*local);
  }else if(phase===1){
    const interval=5600-2800*local;
    if(now-seeds[seeds.length-1].born>interval)makeSeed(.48+.28*local);
  }else if(phase===2){
    const interval=4200+1300*Math.sin(local*Math.PI);
    if(now-seeds[seeds.length-1].born>interval){Math.random()<.68?recallSeed():makeSeed(.78);}
  }else{
    const interval=11000+18000*local;
    if(now-seeds[seeds.length-1].born>interval&&local<.72){Math.random()<.82?recallSeed():makeSeed(.32);}
  }
}

function drawTriangle(tr,alpha,fill=0){
  ctx.beginPath();ctx.moveTo(tr[0].x,tr[0].y);ctx.lineTo(tr[1].x,tr[1].y);ctx.lineTo(tr[2].x,tr[2].y);ctx.closePath();
  if(fill>0){ctx.fillStyle=`rgba(239,239,232,${fill})`;ctx.fill();}
  ctx.strokeStyle=`rgba(239,239,232,${alpha})`;ctx.lineWidth=.72;ctx.stroke();
}
function drawSeed(s,now,phase,local){
  const age=(now-s.born)/s.life;if(age>1)return;
  const env=Math.sin(Math.min(1,age)*Math.PI);
  const phaseDensity=[.38,.70,1,.34][phase];
  const take=Math.max(1,Math.floor(s.tris.length*phaseDensity));
  const fall=phase===0?age*H*.028:phase===1?age*H*.055:phase===2?Math.sin(age*Math.PI)*H*.028:age*H*.012;
  ctx.save();ctx.translate(s.drift*age*W,fall);
  for(let i=0;i<take;i++){
    const item=s.tris[i],delay=i/Math.max(1,take)*.32;
    const reveal=clamp((age-delay)/.20);
    if(reveal<=0)continue;
    let a=(.035+s.strength*.095)*env*reveal;
    if(s.ghost)a*=.68;
    drawTriangle(item.tr,a,phase===2&&i%9===0?a*.14:0);
    if(i%6===0&&phase>0){
      const c=centroid(item.tr);ctx.fillStyle=`rgba(239,239,232,${a*.8})`;ctx.fillRect(c.x-1,c.y-1,2,2);
    }
  }
  ctx.restore();
}
function drawRoutes(now,phase){
  routes.forEach(r=>{
    const age=(now-r.born)/r.life;if(age<0||age>1||r.pts.length<2)return;
    const env=Math.sin(age*Math.PI);const progress=phase===2?clamp(age*2.2):clamp(age*1.35);
    const max=Math.max(2,Math.floor(r.pts.length*progress));
    ctx.beginPath();ctx.moveTo(r.pts[0].x,r.pts[0].y);
    for(let i=1;i<max;i++)ctx.lineTo(r.pts[i].x,r.pts[i].y);
    ctx.strokeStyle=`rgba(239,239,232,${r.a*env*(phase===2?1.25:.75)})`;ctx.lineWidth=.65;ctx.stroke();
  });
}
function drawField(now,phase){
  fields.forEach(f=>{
    const age=(now-f.born)/f.life;if(age<0||age>1)return;
    const env=Math.sin(age*Math.PI),pulse=.5+.5*Math.sin(age*10+f.phase);
    const rr=f.r*(1+age*(phase===2?4:1.5));
    ctx.beginPath();ctx.arc(f.x,f.y,rr,0,TAU);
    ctx.strokeStyle=`rgba(239,239,232,${f.a*env*(.35+pulse*.65)})`;ctx.lineWidth=.55;ctx.stroke();
  });
}
function drawMemory(now,phase,local){
  memory.forEach(m=>{
    const age=(now-m.born)/m.life;if(age<0||age>1)return;
    const base=(1-age)*m.a;
    let gain=phase===0?.22:phase===1?.55:phase===2?1.4:.52*(1-local);
    if(phase===3&&local>.62)gain*=.35;
    const tr=m.tr.map((p,i)=>({x:p.x+m.shift*Math.sin(age*2.3+i),y:p.y+m.shift*.45*Math.cos(age*1.7+i)}));
    drawTriangle(tr,base*gain,0);
  });
}
function registrationMark(t,phase){
  if(phase!==0)return;
  const y=H*(.86+Math.sin(t*.17)*.006),a=.045;
  ctx.strokeStyle=`rgba(239,239,232,${a})`;ctx.lineWidth=.5;
  ctx.beginPath();ctx.moveTo(W*.47,y);ctx.lineTo(W*.53,y);ctx.stroke();
}
function fadeLayer(phase,local){
  let alpha=phase===0?.105:phase===1?.070:phase===2?.045:.082+local*.07;
  if(phase===3&&local>.72)alpha=.18;
  ctx.fillStyle=`rgba(5,5,5,${alpha})`;ctx.fillRect(0,0,W,H);
}
function cleanup(now){
  seeds=seeds.filter(s=>(now-s.born)<s.life);
  routes=routes.filter(r=>(now-r.born)<r.life);
  fields=fields.filter(f=>(now-f.born)<f.life);
  memory=memory.filter(m=>(now-m.born)<m.life);
  if(memory.length>700)memory.splice(0,memory.length-700);
}

function frame(ts){
  if(!started){requestAnimationFrame(frame);return}
  const elapsed=(ts-startTime)/1000;
  const t=((elapsed%180)+180)%180;
  const newCycle=Math.floor(elapsed/180);
  if(newCycle!==cycle){cycle=newCycle;seeds=[];routes=[];fields=[];/* memory intentionally survives */}
  const s=stageInfo(t);
  fadeLayer(s.phase,s.local);
  spawn(t,s.phase,s.local);
  const now=performance.now();
  drawMemory(now,s.phase,s.local);
  drawField(now,s.phase);
  drawRoutes(now,s.phase);
  seeds.forEach(x=>drawSeed(x,now,s.phase,s.local));
  registrationMark(t,s.phase);
  soundTick(s.local,s.phase);
  cleanup(now);
  debug.textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}  ${s.name}`;
  last=ts;requestAnimationFrame(frame);
}

enter.addEventListener('click',async()=>{
  started=true;startTime=performance.now();audioStart();if(ac&&ac.state==='suspended')await ac.resume();
  ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);makeSeed(.28,{x:W*.50,y:H*.12});start.classList.add('off');
});
addEventListener('keydown',e=>{
  if(e.key.toLowerCase()==='h')debug.classList.toggle('hide');
  if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();}
  if(e.key===' '&&started){makeSeed(.45+Math.random()*.35);e.preventDefault();}
});
canvas.addEventListener('pointerdown',e=>{
  if(!started)return;
  const x=e.clientX/W,y=e.clientY/H;
  makeSeed(.38+Math.random()*.42,{x:x*W,y:clamp(y,0,.58)*H});
});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
