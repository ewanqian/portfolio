<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070805"><title>Trigger Cells</title><style>:root{color-scheme:dark;--bg:#070805;--ink:#e8eadf;--dim:rgba(232,234,223,.22);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.tempo{position:fixed;right:18px;bottom:18px;width:46px;height:46px;border:1px solid var(--dim);background:rgba(7,8,5,.72);color:var(--ink);font:10px/1 var(--mono);cursor:pointer}.tempo.on{background:var(--ink);color:var(--bg)}.marks{position:fixed;left:18px;bottom:18px;display:flex;gap:12px;pointer-events:none}.marks i{width:5px;height:5px;border:1px solid rgba(232,234,223,.28)}@media(max-width:600px){.tempo{right:10px;bottom:10px}.marks{left:10px;bottom:10px}}</style></head><body><canvas id="c"></canvas><div class="marks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><button id="tempo" class="tempo" aria-label="toggle quantized 120 BPM accompaniment">120</button><script>(()=>{'use strict';const C=document.querySelector('#c'),g=C.getContext('2d',{alpha:false}),tempo=document.querySelector('#tempo');let W=0,H=0,dpr=1,ac=null,out=null,noise=null,clock=false,nextBeat=0,beatTimer=0,beat=0,events=[];const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function init(){if(ac)return;ac=new(AudioContext||webkitAudioContext)();out=ac.createGain();out.gain.value=.4;out.connect(ac.destination);noise=ac.createBuffer(1,ac.sampleRate*.08,ac.sampleRate);let d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)}async function wake(){init();if(ac.state!=='running')await ac.resume()}function tone(t,f,a=.08,d=.16,type='triangle',cut=5000){const o=ac.createOscillator(),filt=ac.createBiquadFilter(),v=ac.createGain();o.type=type;o.frequency.value=f;filt.type='lowpass';filt.frequency.value=cut;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(a,t+.006);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(filt).connect(v).connect(out);o.start(t);o.stop(t+d+.03)}function hit(t,a=.03,band=2600){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();s.buffer=noise;f.type='bandpass';f.frequency.value=band;f.Q.value=5;v.gain.setValueAtTime(a,t);v.gain.exponentialRampToValueAtTime(.0001,t+.045);s.connect(f).connect(v).connect(out);s.start(t)}function perform(zone,x,y,when=null){const t=when??ac.currentTime;const roots=[55,73.42,98,130.81,174.61];tone(t,roots[zone]*(y<.45?2:1),.055+.055*(1-y),.12+.08*zone/4,zone===4?'square':'triangle',900+x*6000);if(zone===0||zone===3)hit(t,.025+.035*(1-y),1500+zone*900);const delay=Math.max(0,(t-ac.currentTime)*1000);setTimeout(()=>events.push({zone,x,y,t:performance.now(),seed:Math.random()}),delay)}async function trigger(x,y){await wake();const zone=Math.min(4,Math.floor(x*5));if(clock){const grid=.125;const t=Math.ceil(ac.currentTime/grid)*grid;perform(zone,x,y,t)}else perform(zone,x,y)}C.addEventListener('pointerdown',e=>{const r=C.getBoundingClientRect();trigger(clamp((e.clientX-r.left)/r.width),clamp((e.clientY-r.top)/r.height))});addEventListener('keydown',e=>{const i='12345'.indexOf(e.key);if(i>=0)trigger((i+.5)/5,.5)});tempo.addEventListener('click',async()=>{await wake();clock=!clock;tempo.classList.toggle('on',clock);if(clock){nextBeat=ac.currentTime+.01;beat=0;beatTimer=setInterval(()=>{while(nextBeat<ac.currentTime+.08&&clock){const t=nextBeat;const b=beat++;setTimeout(()=>{if(clock&&b%4===0){hit(ac.currentTime,.016,3500);events.push({zone:b%5,x:.1+(b%5)*.2,y:.86,t:performance.now(),seed:.5,ghost:true})}},Math.max(0,(t-ac.currentTime)*1000));nextBeat+=.5}},25)}else clearInterval(beatTimer)});function draw(now){requestAnimationFrame(draw);g.fillStyle='#070805';g.fillRect(0,0,W,H);for(let z=0;z<5;z++){const x=(z+.5)*W/5;g.fillStyle='rgba(232,234,223,.13)';g.fillRect(x-1,H*.86,2,2)}for(let i=events.length-1;i>=0;i--){const q=events[i],age=(now-q.t)/1000,a=clamp(1-age/2.2);if(a<=0){events.splice(i,1);continue}const x=q.x*W,y=q.y*H,e=1-q.y;g.strokeStyle=`rgba(232,234,223,${a*(.22+e*.58)})`;g.fillStyle=`rgba(232,234,223,${a*(.3+e*.6)})`;g.lineWidth=.7+e*1.2;const p=age*(80+q.zone*32);if(q.zone===0){g.beginPath();g.arc(x,y,10+p,0,Math.PI*2);g.stroke()}else if(q.zone===1){for(let k=-2;k<=2;k++){g.beginPath();g.moveTo(x-p,y+k*8);g.lineTo(x+p,y+k*8);g.stroke()}}else if(q.zone===2){const s=18+p*.7;g.strokeRect(x-s,y-s,s*2,s*2);g.strokeRect(x-s*.45,y-s*.45,s*.9,s*.9)}else if(q.zone===3){g.beginPath();g.moveTo(x-p*.7,y-p*.2);g.lineTo(x,y-p*.2);g.lineTo(x,y+p*.6);g.lineTo(x+p*.8,y+p*.6);g.stroke();g.fillRect(x-2,y+p*.6-2,4,4)}else{for(let k=0;k<8;k++){const ang=k*Math.PI/4+q.seed;g.beginPath();g.moveTo(x+Math.cos(ang)*12,y+Math.sin(ang)*12);g.lineTo(x+Math.cos(ang)*(25+p),y+Math.sin(ang)*(25+p));g.stroke()}}}}requestAnimationFrame(draw)})();</script></body></html>
