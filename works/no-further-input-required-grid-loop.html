<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>No Further Input Required — Grid Loop Study</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#050505}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(()=>{'use strict';
const c=document.querySelector('#stage'),x=c.getContext('2d',{alpha:false});
let W=0,H=0,D=1,start=performance.now();
const LOOP=72000,TAU=Math.PI*2,COLS=18,ROWS=10;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const mix=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a));return t*t*(3-2*t)};
const hash=(i,j,s=0)=>{const n=Math.sin(i*127.1+j*311.7+s*74.7)*43758.5453123;return n-Math.floor(n)};
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.floor(W*D);c.height=Math.floor(H*D);c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}});
function G(){const mx=Math.max(28,W*.055),my=Math.max(24,H*.07),gw=W-mx*2,gh=H-my*2;return{mx,my,gw,gh,sx:gw/COLS,sy:gh/ROWS}}
function P(i,j,g){return{x:g.mx+i*g.sx,y:g.my+j*g.sy}}
function stroke(a=.2,w=.8){x.strokeStyle=`rgba(235,237,228,${a})`;x.lineWidth=w}
function fill(a=.8){x.fillStyle=`rgba(235,237,228,${a})`}
function line(x1,y1,x2,y2,a=.2,w=.8){stroke(a,w);x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke()}
function rect(px,py,pw,ph,a=.15,w=.8){stroke(a,w);x.strokeRect(px,py,pw,ph)}
function dot(px,py,r=1.3,a=.8){fill(a);x.beginPath();x.arc(px,py,r,0,TAU);x.fill()}
function env(p){
 const registration=(1-smooth(.12,.24,p))*smooth(0,.035,p);
 const absorption=smooth(.14,.34,p)*(1-smooth(.55,.70,p));
 const recall=smooth(.48,.62,p)*(1-smooth(.80,.91,p));
 const remainder=smooth(.76,.90,p)*(1-smooth(.985,1,p));
 return{registration,absorption,recall,remainder};
}
function grid(g,e){
 const a=.022+.018*e.absorption+.014*e.recall;
 for(let i=0;i<=COLS;i++){const px=g.mx+i*g.sx;line(px,g.my,px,g.my+g.gh,a,i%3===0?.65:.45)}
 for(let j=0;j<=ROWS;j++){const py=g.my+j*g.sy;line(g.mx,py,g.mx+g.gw,py,a,j%2===0?.65:.45)}
 for(let j=0;j<=ROWS;j+=2)for(let i=0;i<=COLS;i+=3){const q=P(i,j,g);dot(q.x,q.y,.7,.06+.045*e.recall)}
}
function constraint(g,p,e,alpha=1){
 const a=TAU*p,s=(.20*e.registration+.55*e.absorption+.68*e.recall+.18*e.remainder)*alpha;if(s<.006)return;
 const nodes=[];
 for(let j=1;j<ROWS;j++)for(let i=1;i<COLS;i++){
   if(!(((i*7+j*11)%5===0)||((i+j)%7===0)))continue;
   const b=P(i,j,g),dir=((i+j)%2)*2-1,ox=Math.sin(a*2+i*.57+j*.31)*g.sx*.055*dir,oy=Math.cos(a*2+j*.49-i*.21)*g.sy*.045;
   nodes.push({i,j,x:b.x+ox,y:b.y+oy,bx:b.x,by:b.y});
 }
 for(let n=0;n<nodes.length;n++){
   const A=nodes[n];
   for(let m=n+1;m<nodes.length;m++){
     const B=nodes[m],di=Math.abs(A.i-B.i),dj=Math.abs(A.j-B.j);
     if((di===1&&dj===0)||(di===0&&dj===1))line(A.x,A.y,B.x,B.y,.08*s,.55);
   }
   line(A.bx,A.by,A.x,A.y,.15*s,.6);dot(A.x,A.y,1.1,.44*s);
 }
 const sx=g.mx+g.gw*((p*1.5)%1),sy=g.my+g.gh*((p*.75+.15)%1);
 line(sx,g.my,sx,g.my+g.gh,.05*s,.9);line(g.mx,sy,g.mx+g.gw,sy,.03*s,.7);
}
function indexField(g,p,e,alpha=1){
 const a=TAU*p,s=(.22*e.registration+.72*e.absorption+.58*e.recall+.25*e.remainder)*alpha;if(s<.006)return;
 for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){
   const h=hash(i,j,3),gate=.28+.22*Math.sin(a+i*.41-j*.27);if(h>gate+.42)continue;
   const q=P(i,j,g),cx=q.x+g.sx*.5,cy=q.y+g.sy*.5,sz=.16+.16*(.5+.5*Math.sin(a*1.5+i*.29+j*.21)),ww=g.sx*sz,hh=g.sy*sz,f=(i*3+j*5)%4;
   if(f===0){rect(cx-ww,cy-hh,ww*2,hh*2,.13*s,.65);if((i+j)%3===0)rect(cx-ww*.55,cy-hh*.55,ww*1.1,hh*1.1,.22*s,.7)}
   else if(f===1){line(cx,cy-hh*1.6,cx,cy+hh*1.6,.20*s,.75);line(cx-g.sx*.15,cy,cx+g.sx*.15,cy,.07*s,.6)}
   else if(f===2){line(cx-g.sx*.18,cy+hh*.9,cx,cy-hh*.9,.20*s,.7);line(cx,cy-hh*.9,cx+g.sx*.18,cy+hh*.9,.20*s,.7)}
   else{line(cx-g.sx*.18,cy-hh*.75,cx,cy-hh*.75,.11*s,.6);line(cx,cy-hh*.75,cx,cy+hh*.75,.11*s,.6);line(cx,cy+hh*.75,cx+g.sx*.18,cy+hh*.75,.18*s,.75)}
   if(hash(i,j,9+Math.floor(p*8))>.78)dot(cx,cy,1.05,.48*s);
 }
 for(let j=0;j<ROWS;j+=2)for(let i=0;i<COLS;i+=3){if(hash(i,j,14)<.58)continue;const q=P(i,j,g),ww=g.sx*3,hh=g.sy*2,b=.92+.04*Math.sin(a+i*.23+j*.17),dx=ww*(1-b)*.5,dy=hh*(1-b)*.5;rect(q.x+dx,q.y+dy,ww*b,hh*b,.05*s,.8)}
}
function memoryOn(i,j,step,rule){if(rule===0)return((i^j^step)&3)===0;if(rule===1)return((i*3+j*5+step)%7)<2;if(rule===2)return(((i+step)%6===0)||((j+step)%5===0))&&((i+j)%2===0);return((i*7+j*11+step*3)%13)<3}
function memory(g,p,e,alpha=1){
 const s=(.10*e.registration+.34*e.absorption+.82*e.recall+.42*e.remainder)*alpha;if(s<.006)return;
 for(let age=5;age>=0;age--){
   const qp=(p-age*.015+1)%1,step=Math.floor(qp*32)%32,rule=Math.floor(qp*4)%4,fade=1-age/6,a=.33*s*fade*fade;
   for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){
     if(!memoryOn(i,j,step,rule))continue;const q=P(i,j,g),cx=q.x+g.sx*.5+(age*.65)*(i%2?1:-1),cy=q.y+g.sy*.5;dot(cx,cy,age===0?1.5:.65,a);
     if(age===0&&(i+j+rule)%5===0){stroke(.05*s,.55);x.beginPath();x.moveTo(cx,cy-g.sy*.27);x.lineTo(cx-g.sx*.22,cy+g.sy*.23);x.lineTo(cx+g.sx*.22,cy+g.sy*.23);x.closePath();x.stroke()}
   }
 }
 const center=COLS*.5+Math.sin(TAU*p)*2.1;
 for(let j=0;j<ROWS;j++){const spread=mix(1.4,COLS*.42,j/(ROWS-1));for(let i=0;i<COLS;i++){const d=Math.abs(i-center);if(d>=spread)continue;const edge=1-clamp(d/spread);if(hash(i,j,22+Math.floor(p*16))>.76+edge*.14)continue;const q=P(i,j,g),cx=q.x+g.sx*.5,cy=q.y+g.sy*.5;line(cx-g.sx*.15,cy,cx+g.sx*.15,cy,.06*s*edge,.65);if((i+j)%4===0)dot(cx,cy,1.15,.23*s*edge)}}
}
function frame(now){
 const p=((now-start)%LOOP)/LOOP,e=env(p),g=G();x.fillStyle='#050505';x.fillRect(0,0,W,H);grid(g,e);
 const echoes=[[-.06,.16],[-.035,.28],[0,1]];
 for(const [dt,a] of echoes){const q=(p+dt+1)%1;indexField(g,q,e,a);constraint(g,q,e,a);memory(g,q,e,a)}
 if(e.recall>.03){const er={registration:0,absorption:0,recall:e.recall,remainder:0};indexField(g,(p-.23+1)%1,er,.35);constraint(g,(p-.31+1)%1,er,.30)}
 const b=.5+.5*Math.sin(TAU*p);line(g.mx,g.my,g.mx+g.gw,g.my,.035+.02*b,.8);line(g.mx,g.my+g.gh,g.mx+g.gw,g.my+g.gh,.025+.018*(1-b),.8);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
