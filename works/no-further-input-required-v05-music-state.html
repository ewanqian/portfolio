<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050605">
<title>No Further Input Required V0.5</title>
<style>
:root{color-scheme:dark;--bg:#050605;--ink:#e8eadf;--line:rgba(232,234,223,.22);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;z-index:5;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}.group{display:flex;align-items:center;gap:7px;pointer-events:auto}.btn{height:38px;min-width:52px;padding:0 11px;border:1px solid var(--line);background:rgba(5,6,5,.78);color:var(--ink);font:10px/1 var(--mono);letter-spacing:.09em}.btn.on{background:var(--ink);color:var(--bg)}.dots{height:38px;display:flex;gap:6px;align-items:center;padding:0 2px}.dot{width:5px;height:5px;border:1px solid rgba(232,234,223,.42)}.dot.on{width:18px;background:var(--ink);border-color:var(--ink)}.bpm{height:38px;display:flex;align-items:center;gap:8px;padding:0 9px;border:1px solid var(--line);background:rgba(5,6,5,.78);color:var(--ink);font:10px/1 var(--mono)}.bpm input{width:86px;accent-color:#e8eadf}.start{position:fixed;z-index:10;inset:0;display:grid;place-items:center;background:rgba(5,6,5,.94);transition:opacity .2s ease}.start.off{opacity:0;pointer-events:none}.start button{width:min(280px,74vw);height:100px;border:1px solid rgba(232,234,223,.86);background:transparent;color:var(--ink);font:11px/1 var(--mono);letter-spacing:.12em}.grain{position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 150 150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E")}
@media(max-width:720px){.hud{left:10px;right:10px;bottom:10px;flex-direction:column;align-items:stretch}.group{justify-content:space-between}.btn{flex:1;min-width:0}.bpm{flex:1}.bpm input{width:70px}}
</style>
</head>
<body>
<canvas id="c"></canvas><div class="grain"></div>
<div class="hud"><div class="group"><button class="btn" id="next">NEXT</button><button class="btn" id="hold">HOLD</button><button class="btn on" id="auto">AUTO</button><div class="dots" id="vd"></div></div><div class="group"><div class="dots" id="md"></div><button class="btn" id="music">MUSIC</button><label class="bpm"><span id="bv">112</span><input id="br" type="range" min="72" max="156" value="112"></label></div></div>
<div class="start" id="start"><button id="startBtn">START SYSTEM</button></div>
<script>
(()=>{'use strict';
const c=document.querySelector('#c'),x=c.getContext('2d',{alpha:false});
const $=s=>document.querySelector(s), next=$('#next'),holdBtn=$('#hold'),autoBtn=$('#auto'),musicBtn=$('#music'),start=$('#start'),startBtn=$('#startBtn'),br=$('#br'),bv=$('#bv'),vd=$('#vd'),md=$('#md');
let W=0,H=0,D=1,vs=0,ms=0,pending=null,bpm=112,auto=true,hold=false,stateT=performance.now(),running=false;
let ac=null,master=null,noise=null,nextTime=0,step=0,timer=null,phase=0,gridPhase=0;
let ev=[],parts=[]; const durations=[14000,15000,14500,15500,14500,16000];
const routes=[[.12,.18,.88,.18,.88,.34,.34,.34,.34,.82],[.16,.74,.16,.22,.74,.22,.74,.62,.28,.62],[.82,.14,.48,.14,.48,.52,.86,.52,.86,.86],[.24,.88,.24,.44,.62,.44,.62,.16,.12,.16]];
function dots(el,n){for(let i=0;i<n;i++){const d=document.createElement('i');d.className='dot'+(i?'':' on');el.appendChild(d)}}dots(vd,6);dots(md,4);function mark(el,n){[...el.children].forEach((d,i)=>d.className='dot'+(i===n?' on':''))}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);makeParts()}addEventListener('resize',resize);resize();
function makeParts(){parts=[];split(W*.12,H*.14,W*.76,H*.7,0,true)}function split(px,py,pw,ph,d,v){if(d>3||pw<90||ph<70){parts.push({x:px,y:py,w:pw,h:ph,d});return}const r=[1/3,1/2,2/3][d%3];if(v){split(px,py,pw*r,ph,d+1,!v);split(px+pw*r,py,pw*(1-r),ph,d+1,!v)}else{split(px,py,pw,ph*r,d+1,!v);split(px,py+ph*r,pw,ph*(1-r),d+1,!v)}}
function initAudio(){if(ac)return;ac=new(AudioContext||webkitAudioContext)();master=ac.createGain();master.gain.value=.42;master.connect(ac.destination);noise=ac.createBuffer(1,ac.sampleRate*.08,ac.sampleRate);const a=noise.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);nextTime=ac.currentTime+.05;timer=setInterval(schedule,25)}
async function wake(){initAudio();if(ac.state!=='running')await ac.resume();running=true;start.classList.add('off');stateT=performance.now()}
const mtof=n=>440*Math.pow(2,(n-69)/12);function tone(t,f,amp=.04,dur=.16,type='triangle',cut=1400){const o=ac.createOscillator(),q=ac.createBiquadFilter(),g=ac.createGain();o.type=type;o.frequency.value=f;q.type='lowpass';q.frequency.value=cut;q.Q.value=1.5;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(amp,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(q).connect(g).connect(master);o.start(t);o.stop(t+dur+.04)}
function click(t,band=2200,amp=.02){const s=ac.createBufferSource(),q=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise;q.type='bandpass';q.frequency.value=band;q.Q.value=7;g.gain.setValueAtTime(amp,t);g.gain.exponentialRampToValueAtTime(.0001,t+.045);s.connect(q).connect(g).connect(master);s.start(t);s.stop(t+.05)}
function burst(t,band=2500,amp=.02){const s=ac.createBufferSource(),q=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise;q.type='highpass';q.frequency.value=band;g.gain.setValueAtTime(amp,t);g.gain.exponentialRampToValueAtTime(.0001,t+.09);s.connect(q).connect(g).connect(master);s.start(t);s.stop(t+.1)}
function schedule(){if(!ac||ac.state!=='running')return;while(nextTime<ac.currentTime+.1){runStep(step,nextTime);nextTime+=60/bpm/4;step=(step+1)%64}}
function runStep(s,t){const beat=s%4===0,bar=s%16===0;if(pending!==null&&beat){ms=pending;pending=null;mark(md,ms);ev.push({k:'music',t:performance.now(),life:320})}if(ms===1&&beat){tone(t,46,bar?.085:.05,bar?.18:.12,'sine',420);click(t,1600+vs*220,bar?.025:.012);beatEvent(s,.38)}if(ms===2&&beat){const banks=[[43,43,46,48,43,50,46,48],[36,43,38,45,41,43,38,48],[43,46,50,53,50,46,41,48],[36,41,43,48,46,41,38,43],[38,45,41,48,50,45,41,43],[41,45,48,53,50,45,43,48]],seq=banks[vs],n=seq[(s/4)%8|0];tone(t,mtof(n),.072,.22,'triangle',820+vs*90);if(s%8===4)click(t,2300,.014);beatEvent(s,.48)}if(ms===3){if(beat){const root=[36,38,41,43,45,48][vs],deg=[0,7,12,19][(s/4)%4|0];tone(t,mtof(root+deg),.066,.18,'triangle',900);click(t,1450+(s%16)*85,.018);burst(t,2200+vs*250,.017);beatEvent(s,.62)}if(s%2===0){const n=67+((vs+s/8|0)%5)*2;tone(t,mtof(n),.014,.48,'sine',1500)}}if(beat){if(vs===0)ev.push({k:'route',i:(s/4)%4,t:performance.now(),life:950});if(vs===3)ev.push({k:'signal',i:(s/4)%7,t:performance.now(),life:950});if(vs===4)ev.push({k:'cell',i:(s/4)%16,t:performance.now(),life:850});if(vs===5)ev.push({k:'part',i:(s/4)%Math.max(1,parts.length),t:performance.now(),life:1000})}}
function beatEvent(s,e){ev.push({k:'beat',p:(s%16)/15,e,t:performance.now(),life:850})}
function setVS(n){vs=(n+6)%6;mark(vd,vs);stateT=performance.now();ev.push({k:'switch',t:performance.now(),life:250})}function nextVS(){setVS(vs+1)}function cycleMusic(){pending=(ms+1)%4}
function sampleRoute(a,t){let seg=[],total=0;for(let i=2;i<a.length;i+=2){const dx=a[i]-a[i-2],dy=a[i+1]-a[i-1],l=Math.hypot(dx,dy);seg.push(l);total+=l}let z=(t%1)*total;for(let i=0;i<seg.length;i++){if(z<=seg[i]){const u=z/seg[i],j=i*2;return{x:a[j]+(a[j+2]-a[j])*u,y:a[j+1]+(a[j+3]-a[j+1])*u}}z-=seg[i]}return{x:a[a.length-2],y:a[a.length-1]}}
function draw0(now){x.lineWidth=.8;x.strokeStyle='rgba(232,234,223,.09)';routes.forEach(a=>{x.beginPath();x.moveTo(a[0]*W,a[1]*H);for(let i=2;i<a.length;i+=2)x.lineTo(a[i]*W,a[i+1]*H);x.stroke()});routes.forEach((a,i)=>{const p=sampleRoute(a,(now-stateT)*.000035+i*.2);x.fillStyle='rgba(232,234,223,.95)';x.fillRect(p.x*W-2,p.y*H-2,4,4)})}
function draw1(now){const cols=10,rows=6,mx=W*.13,my=H*.16,gw=W*.74,gh=H*.66;for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const px=mx+gw*i/(cols-1)+Math.sin(now*.0012+(i+j)*.46)*11,py=my+gh*j/(rows-1)+Math.cos(now*.0014+(i-j)*.38)*7,s=4+8*Math.abs(Math.sin(now*.001+i*.33+j*.2));x.strokeStyle='rgba(232,234,223,.18)';x.strokeRect(px-s,py-s,s*2,s*2);if((i+j+(step>>4))%3===0){x.fillStyle='rgba(232,234,223,.82)';x.fillRect(px-1.5,py-1.5,3,3)}}}
function draw2(now){phase+=.005+ms*.0012;for(let i=0;i<6;i++){const s=95+i*43,rx=s*(1+.12*Math.sin(now*.001+i)),ry=s*(.56+.09*Math.cos(now*.0011+i));x.save();x.translate(W/2,H/2);x.rotate(phase*.55+i*.24);x.strokeStyle=`rgba(232,234,223,${.16+i*.065})`;x.lineWidth=.8;x.strokeRect(-rx/2,-ry/2,rx,ry);x.restore()}}
function draw3(now){const n=7,mx=W*.14,my=H*.16,gw=W*.72,gh=H*.66;x.strokeStyle='rgba(232,234,223,.09)';for(let i=0;i<n;i++){const yy=my+(i+.5)*gh/n;x.beginPath();x.moveTo(mx,yy);x.lineTo(mx+gw,yy);x.stroke()}const sx=mx+(now*.045)%gw;x.strokeStyle='rgba(232,234,223,.22)';x.beginPath();x.moveTo(sx,my);x.lineTo(sx,my+gh);x.stroke()}
function draw4(){const cols=16,rows=8,mx=W*.15,my=H*.18,gw=W*.7,gh=H*.62;gridPhase+=.015;for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const on=((i+j+(gridPhase|0))%4===0)||((i*3+j*5+(step>>2))%11===0),px=mx+(i+.5)*gw/cols,py=my+(j+.5)*gh/rows,s=Math.min(gw/cols,gh/rows)*.2;x.strokeStyle=on?'rgba(232,234,223,.7)':'rgba(232,234,223,.1)';x.strokeRect(px-s,py-s,s*2,s*2);if(on){x.fillStyle='rgba(232,234,223,.82)';x.fillRect(px-1.4,py-1.4,2.8,2.8)}}}
function edge(r,t){const p=2*(r.w+r.h);let d=(t%1)*p;if(d<r.w)return{x:r.x+d,y:r.y};d-=r.w;if(d<r.h)return{x:r.x+r.w,y:r.y+d};d-=r.h;if(d<r.w)return{x:r.x+r.w-d,y:r.y+r.h};d-=r.w;return{x:r.x,y:r.y+r.h-d}}
function draw5(now){parts.forEach(r=>{x.strokeStyle='rgba(232,234,223,.1)';x.lineWidth=.8;x.strokeRect(r.x,r.y,r.w,r.h)});for(let i=0;i<Math.min(10,parts.length);i+=2){const p=edge(parts[i],(now-stateT)*.00006+i*.07);x.fillStyle='rgba(232,234,223,.88)';x.fillRect(p.x-2,p.y-2,4,4)}}
function events(now){for(let i=ev.length-1;i>=0;i--){const q=ev[i],a=Math.max(0,1-(now-q.t)/q.life);if(!a){ev.splice(i,1);continue}x.lineWidth=.8;if(q.k==='music'){x.strokeStyle=`rgba(232,234,223,${a*.82})`;x.beginPath();x.moveTo(W*.25,H*.1);x.lineTo(W*.75,H*.1);x.stroke()}else if(q.k==='beat'){const px=(.15+.7*q.p)*W,py=H*.86;x.strokeStyle=`rgba(232,234,223,${a*(.2+q.e*.6)})`;x.beginPath();x.arc(px,py,8+(1-a)*70,0,Math.PI*2);x.stroke()}else if(q.k==='switch'){x.strokeStyle=`rgba(232,234,223,${a*.65})`;x.beginPath();x.moveTo(W*.2,H*.5);x.lineTo(W*.8,H*.5);x.stroke()}else if(q.k==='route'){const p=sampleRoute(routes[q.i],1-a);x.strokeStyle=`rgba(232,234,223,${a*.38})`;x.beginPath();x.arc(p.x*W,p.y*H,10+(1-a)*42,0,Math.PI*2);x.stroke()}else if(q.k==='signal'){const yy=H*(.2+.6*q.i/6),px=W*(.14+.72*(1-a));x.fillStyle=`rgba(232,234,223,${a*.8})`;x.fillRect(px-2,yy-2,4,4)}else if(q.k==='cell'){const px=W*(.15+.7*(q.i/15)),py=H*.56;x.strokeStyle=`rgba(232,234,223,${a*.55})`;x.beginPath();x.arc(px,py,8+(1-a)*55,0,Math.PI*2);x.stroke()}else if(q.k==='part'&&parts.length){const r=parts[q.i%parts.length];x.strokeStyle=`rgba(232,234,223,${a*.45})`;x.strokeRect(r.x-3*(1-a),r.y-3*(1-a),r.w+6*(1-a),r.h+6*(1-a))}}}
function draw(){requestAnimationFrame(draw);const now=performance.now();if(auto&&!hold&&now-stateT>durations[vs])nextVS();x.fillStyle='#050605';x.fillRect(0,0,W,H);x.globalAlpha=[.54,.68,.82,1][ms];[draw0,draw1,draw2,draw3,draw4,draw5][vs](now);x.globalAlpha=1;events(now)}requestAnimationFrame(draw);
startBtn.onclick=wake;next.onclick=nextVS;holdBtn.onclick=()=>{hold=!hold;holdBtn.classList.toggle('on',hold)};autoBtn.onclick=()=>{auto=!auto;autoBtn.classList.toggle('on',auto)};musicBtn.onclick=async()=>{if(!running)await wake();cycleMusic()};br.oninput=e=>{bpm=+e.target.value;bv.textContent=bpm};
c.addEventListener('pointerdown',async e=>{if(!running)await wake();const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;ev.push({k:'beat',p:px,e:.65,t:performance.now(),life:700});if(ac&&ac.state==='running')tone(ac.currentTime,mtof(50+Math.round((1-py)*18)),.04,.13,'triangle',1200+px*4200)});
addEventListener('keydown',async e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k>='1'&&k<='6')setVS(+k-1);else if(k==='n')nextVS();else if(k==='h'){hold=!hold;holdBtn.classList.toggle('on',hold)}else if(k==='a'){auto=!auto;autoBtn.classList.toggle('on',auto)}else if(k==='m'||k===' '){e.preventDefault();if(!running)await wake();else cycleMusic()}else if(k==='arrowup'){bpm=Math.min(156,bpm+2);br.value=bpm;bv.textContent=bpm}else if(k==='arrowdown'){bpm=Math.max(72,bpm-2);br.value=bpm;bv.textContent=bpm}});
setVS(0);mark(md,0);
})();
</script>
</body></html>
