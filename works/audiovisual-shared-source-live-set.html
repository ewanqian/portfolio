<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#050606" />
<title>Shared-source Live Set v0.1</title>
<style>
:root{color-scheme:dark;--bg:#050606;--ink:#eef0e8;--muted:rgba(238,240,232,.42);--line:rgba(238,240,232,.18);--panel:rgba(5,6,6,.72);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;z-index:5;left:16px;top:14px;display:flex;gap:8px;align-items:center;font:10px/1 var(--mono);letter-spacing:.08em}.hud span,.hud button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 10px}.hud button{cursor:pointer}.sceneName{min-width:118px}.scenes{position:fixed;z-index:5;left:16px;bottom:16px;display:flex;gap:7px}.scene{width:76px;height:42px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:10px/1 var(--mono);cursor:pointer}.scene.on{background:var(--ink);color:var(--bg)}.keys{position:fixed;z-index:4;right:16px;bottom:16px;display:flex;gap:6px;opacity:.5}.keys span{width:24px;height:24px;border:1px solid var(--line);display:grid;place-items:center;font:9px/1 var(--mono)}.bpmWrap{position:fixed;z-index:5;right:16px;top:14px;display:flex;gap:8px;align-items:center}.bpmWrap input{width:120px;opacity:.4}.bpmWrap input:hover,.bpmWrap input:focus{opacity:1}.bpmWrap b{font:10px/1 var(--mono);font-weight:500}.start{position:fixed;z-index:9;inset:0;display:grid;place-items:center;background:#050606}.start.hidden{display:none}.start button{border:1px solid var(--ink);background:transparent;color:var(--ink);font:12px/1 var(--mono);letter-spacing:.12em;padding:16px 22px;cursor:pointer}.pending{position:fixed;z-index:4;left:50%;top:18px;transform:translateX(-50%);font:10px/1 var(--mono);letter-spacing:.12em;color:var(--muted)}@media(max-width:720px){.scene{width:58px}.keys{display:none}.bpmWrap input{width:76px}.hud span:nth-child(3){display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="start" id="start"><button>START LIVE SET</button></div>
<div class="hud"><span class="sceneName" id="sceneName">01 OPEN</span><span id="barReadout">BAR 1</span><span>Q–I PHRASES · HOLD TRANSFORM · SPACE ACCENT</span></div>
<div class="pending" id="pending"></div>
<div class="bpmWrap"><b id="bpmText">124 BPM</b><input id="bpm" type="range" min="88" max="156" value="124" step="1" /></div>
<nav class="scenes" id="scenes"></nav>
<div class="keys"><span>Q</span><span>W</span><span>E</span><span>R</span><span>T</span><span>Y</span><span>U</span><span>I</span></div>
<script>
(()=>{'use strict';
const C=document.querySelector('#c'),g=C.getContext('2d',{alpha:false}),startUI=document.querySelector('#start'),scenesUI=document.querySelector('#scenes'),sceneName=document.querySelector('#sceneName'),pendingUI=document.querySelector('#pending'),bpmInput=document.querySelector('#bpm'),bpmText=document.querySelector('#bpmText'),barReadout=document.querySelector('#barReadout');
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const TAU=Math.PI*2;
const SCENES=[
{name:'OPEN',density:.22,trail:.12,root:55},
{name:'BUILD',density:.48,trail:.16,root:65.41},
{name:'DROP',density:.86,trail:.22,root:55},
{name:'BRIDGE',density:.32,trail:.08,root:73.42}
];
const CUES={Q:'RING',W:'SCAN',E:'GRID',R:'RAYS',T:'ORBIT',Y:'FOLD',U:'ECHO',I:'BURST'};
let W=0,H=0,dpr=1,ac=null,master=null,comp=null,noiseBuf=null,bpm=124,scene=0,pendingScene=null,nextStep=0,step=0,scheduler=null,running=false,energy=.12,lastBeat=0,bar=1;
let phrases=[],memories=[],down={},holdTimers={},repeat={};
for(let i=0;i<4;i++){const b=document.createElement('button');b.className='scene'+(i===0?' on':'');b.textContent=`0${i+1} ${SCENES[i].name}`;b.dataset.i=i;scenesUI.appendChild(b)}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function initAudio(){if(ac)return;ac=new(AudioContext||webkitAudioContext)();master=ac.createGain();comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=18;comp.ratio.value=8;comp.attack.value=.003;comp.release.value=.18;master.gain.value=.5;master.connect(comp).connect(ac.destination);noiseBuf=ac.createBuffer(1,ac.sampleRate*.18,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)}
async function wake(){initAudio();if(ac.state!=='running')await ac.resume()}
function env(g,t,d,p=.08){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,p),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d)}
function tone(freq,amp=.06,dur=.16,type='triangle',when=null,cut=5200){const t=when??ac.currentTime,o=ac.createOscillator(),f=ac.createBiquadFilter(),v=ac.createGain();o.type=type;o.frequency.value=freq;f.type='lowpass';f.frequency.value=cut;env(v,t,dur,amp);o.connect(f).connect(v).connect(master);o.start(t);o.stop(t+dur+.03)}
function noise(amp=.035,dur=.06,hp=2400,when=null){const t=when??ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;env(v,t,dur,amp);s.connect(f).connect(v).connect(master);s.start(t)}
function kick(when=null,amp=.22){const t=when??ac.currentTime,o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.setValueAtTime(145,t);o.frequency.exponentialRampToValueAtTime(42,t+.15);env(v,t,.18,amp);o.connect(v).connect(master);o.start(t);o.stop(t+.2)}
function bass(freq,when=null,amp=.07,d=.22){tone(freq,amp,d,'sawtooth',when,950);tone(freq/2,amp*.7,d+.04,'sine',when,600)}
function chord(root,when=null,amp=.022,d=.7){[0,3,7,10].forEach((s,i)=>tone(root*Math.pow(2,s/12),amp,d,'triangle',(when??ac.currentTime)+i*.008,1800))}
function visualBeat(kind,e=.25,delay=0){setTimeout(()=>{memories.push({kind,t:performance.now(),e,seed:Math.random(),scene});if(memories.length>160)memories.splice(0,memories.length-160)},Math.max(0,delay))}
function bedStep(s,t){const sc=scene,phase=s%16,delay=(t-ac.currentTime)*1000;if(sc===0){if(phase===0){kick(t,.13);bass(SCENES[sc].root,t,.035,.34);visualBeat('pulse',.32,delay)}if(phase===8){noise(.014,.05,5200,t);visualBeat('tick',.16,delay)}}
if(sc===1){if(phase%4===0){kick(t,.16);visualBeat('line',.30,delay)}if(phase%2===0)noise(.018,.035,6500,t);if([2,6,10,14].includes(phase)){const n=[0,3,7,10][(phase>>1)%4];tone(SCENES[sc].root*4*Math.pow(2,n/12),.022,.09,'square',t,4200)}}
if(sc===2){if(phase%4===0){kick(t,.24);bass(SCENES[sc].root*(phase===8?1.5:1),t,.065,.18);visualBeat('impact',.55,delay)}if(phase===4||phase===12)noise(.07,.08,1300,t);else if(phase%2===0)noise(.026,.028,7000,t);if(phase===0)chord(SCENES[sc].root*2,t,.016,.42)}
if(sc===3){if(phase===0||phase===8){kick(t,.10);visualBeat('wide',.22,delay)}if(phase===0)chord(SCENES[sc].root*2,t,.018,1.2);if(phase===6||phase===14)noise(.012,.08,3200,t)}}
function stepScheduler(){const sixteenth=60/bpm/4;while(nextStep<ac.currentTime+.12){if(step%16===0){bar++;barReadout.textContent=`BAR ${bar}`;if(pendingScene!==null)applyScene(pendingScene)}bedStep(step,nextStep);step++;nextStep+=sixteenth}}
function startClock(){if(running)return;running=true;nextStep=ac.currentTime+.05;step=0;bar=1;scheduler=setInterval(stepScheduler,25)}
function requestScene(i){if(i===scene)return;pendingScene=i;pendingUI.textContent=`NEXT BAR → 0${i+1} ${SCENES[i].name}`}
function applyScene(i){scene=i;pendingScene=null;pendingUI.textContent='';sceneName.textContent=`0${i+1} ${SCENES[i].name}`;[...scenesUI.children].forEach((b,k)=>b.classList.toggle('on',k===i));energy=Math.max(energy,SCENES[i].density);phrases.push({type:'SCENE',scene:i,start:performance.now(),dur:2200,seed:Math.random(),power:.8})}
scenesUI.addEventListener('click',e=>{const b=e.target.closest('.scene');if(b)requestScene(+b.dataset.i)});
function quantizedTime(div=2){const beat=60/bpm,unit=beat/div,now=ac.currentTime;return Math.ceil(now/unit)*unit}
function playCueSound(key,startT,power=1){const idx='QWERTYUI'.indexOf(key),root=SCENES[scene].root,scale=[0,3,5,7,10,12,15,17];const f=root*2*Math.pow(2,scale[idx]/12),q=60/bpm/2;for(let n=0;n<4;n++){const t=startT+n*q*.5;if(key==='Q'){tone(f,.03*power,.18,'sine',t,1800);if(n===0)chord(root*2,t,.012,.5)}else if(key==='W'){noise(.025*power,.045,2400+n*700,t);tone(f*2,.015,.07,'triangle',t)}else if(key==='E'){tone(f*(n%2?1.5:1),.024*power,.12,'square',t,2600);if(n%2===0)noise(.014,.025,7000,t)}else if(key==='R'){tone(f*Math.pow(2,n/12),.02*power,.16,'sawtooth',t,1800+n*500)}else if(key==='T'){tone(f,.024*power,.28,'sine',t);tone(f*2.01,.01,.18,'sine',t)}else if(key==='Y'){bass(f/2,t,.038*power,.24)}else if(key==='U'){tone(f*(n===3?.5:1),.024*power,.24,'triangle',t,1200);noise(.01,.04,4200,t)}else if(key==='I'){if(n===0)kick(t,.18*power);noise(.03*power,.05,1100+n*1200,t)}}}
function triggerCue(key){if(!CUES[key])return;const now=performance.now();repeat[key]=(now-(repeat[key]?.last||0)<420)?Math.min((repeat[key]?.n||1)+1,4):1;repeat[key]={n:repeat[key],last:now};const count=typeof repeat[key].n==='number'?repeat[key].n:1;const startT=quantizedTime(2),delay=Math.max(0,(startT-ac.currentTime)*1000),bars=count>=3?2:1,dur=bars*(60/bpm)*4*1000;phrases.push({type:CUES[key],key,scene,start:now+delay,dur,seed:Math.random(),power:.55+count*.12,hold:false});playCueSound(key,startT,.85+count*.12);energy=clamp(energy+.12+.04*count,0,1);down[key]=now;clearTimeout(holdTimers[key]);holdTimers[key]=setTimeout(()=>{if(down[key]){const p=[...phrases].reverse().find(x=>x.key===key);if(p)p.hold=true;const t=ac.currentTime;const idx='QWERTYUI'.indexOf(key),root=SCENES[scene].root*2*Math.pow(2,[0,3,5,7,10,12,15,17][idx]/12);tone(root,.035,1.1,scene===2?'sawtooth':'sine',t,1600);energy=clamp(energy+.18,0,1)}},430)}
function releaseCue(key){if(!CUES[key])return;delete down[key];clearTimeout(holdTimers[key]);const p=[...phrases].reverse().find(x=>x.key===key&&x.hold);if(p){p.release=performance.now();phrases.push({type:'RESOLVE',scene,start:performance.now(),dur:900,seed:Math.random(),power:.5});tone(SCENES[scene].root*2,.025,.6,'sine',ac.currentTime,1200)}}
function accent(){const t=quantizedTime(1);kick(t,.30);noise(.09,.08,1000,t);bass(SCENES[scene].root,t,.08,.3);phrases.push({type:'ACCENT',scene,start:performance.now(),dur:1500,seed:Math.random(),power:1});energy=1}
function panic(){phrases.length=0;memories.length=0;energy=.08;pendingScene=null;pendingUI.textContent='';if(master&&ac){master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(.12,ac.currentTime,.03);setTimeout(()=>master.gain.setTargetAtTime(.5,ac.currentTime,.15),180)}applyScene(0)}
addEventListener('keydown',async e=>{if(e.repeat)return;await wake();const k=e.key.toUpperCase();if('1234'.includes(e.key)){requestScene(+e.key-1);return}if(CUES[k]){triggerCue(k);return}if(e.code==='Space'){e.preventDefault();accent();return}if(e.key==='Escape')panic()});
addEventListener('keyup',e=>releaseCue(e.key.toUpperCase()));
C.addEventListener('pointerdown',async e=>{await wake();const zone=Math.min(7,Math.floor(e.clientX/innerWidth*8));triggerCue('QWERTYUI'[zone])});
C.addEventListener('pointerup',()=>Object.keys(down).forEach(releaseCue));
bpmInput.addEventListener('input',()=>{bpm=+bpmInput.value;bpmText.textContent=`${bpm} BPM`});
startUI.addEventListener('click',async()=>{await wake();startClock();startUI.classList.add('hidden')});
function bg(now){const sc=scene,t=now*.001,beat=(t*(bpm/60))%1;g.fillStyle=`rgba(5,6,6,${SCENES[sc].trail})`;g.fillRect(0,0,W,H);g.save();g.translate(W/2,H/2);g.strokeStyle=`rgba(238,240,232,${.06+energy*.09})`;g.lineWidth=1;
if(sc===0){for(let i=1;i<=7;i++){const r=(Math.min(W,H)*(.06+i*.055))*(1+.018*Math.sin(t+i));g.beginPath();g.arc(0,0,r,0,TAU);g.stroke()}}
if(sc===1){for(let i=-7;i<=7;i++){const x=i*W/14+(beat-.5)*W/30;g.beginPath();g.moveTo(x,-H/2);g.lineTo(x+Math.sin(t+i)*70,H/2);g.stroke()}for(let j=-3;j<=3;j++){const y=j*H/7;g.beginPath();g.moveTo(-W/2,y);g.lineTo(W/2,y+Math.sin(t*1.7+j)*22);g.stroke()}}
if(sc===2){for(let i=0;i<20;i++){const a=i/20*TAU+t*.04;g.beginPath();g.moveTo(Math.cos(a)*26,Math.sin(a)*26);g.lineTo(Math.cos(a)*Math.max(W,H),Math.sin(a)*Math.max(W,H));g.stroke()}const r=40+beat*Math.min(W,H)*.25;g.beginPath();g.arc(0,0,r,0,TAU);g.stroke()}
if(sc===3){for(let i=-6;i<=6;i++){const y=i*H/13+Math.sin(t*.5+i)*25;g.beginPath();for(let x=-W/2;x<=W/2;x+=24){const yy=y+Math.sin(x*.009+t+i)*12;if(x===-W/2)g.moveTo(x,yy);else g.lineTo(x,yy)}g.stroke()}}
g.restore()}
function drawMemory(m,now){const age=(now-m.t)/1000,a=clamp(1-age/2.4);if(a<=0)return false;g.save();g.strokeStyle=`rgba(238,240,232,${a*(.06+m.e*.18)})`;g.fillStyle=`rgba(238,240,232,${a*(.03+m.e*.12)})`;g.lineWidth=.8+m.e*1.4;const cx=W/2,cy=H/2,p=age*(70+m.e*150);if(m.kind==='impact'){g.beginPath();g.arc(cx,cy,35+p,0,TAU);g.stroke();g.fillRect(0,cy-1,W,2)}else if(m.kind==='line'){g.beginPath();g.moveTo(0,H*(.2+.6*m.seed));g.lineTo(W,H*(.2+.6*(1-m.seed)));g.stroke()}else if(m.kind==='wide'){g.strokeRect(cx-(70+p),cy-(20+p*.2),(70+p)*2,(20+p*.2)*2)}else if(m.kind==='pulse'){g.beginPath();g.arc(cx,cy,18+p,0,TAU);g.stroke()}else{g.fillRect((m.seed*W)%W,0,1,H)}g.restore();return true}
function drawPhrase(p,now){const age=now-p.start;if(age<0)return true;const u=clamp(age/p.dur),fade=Math.sin(Math.PI*clamp(u,0,1)),pow=p.power||.6;g.save();g.strokeStyle=`rgba(238,240,232,${.16+fade*.55*pow})`;g.fillStyle=`rgba(238,240,232,${.04+fade*.18*pow})`;g.lineWidth=.8+pow*1.5;const cx=W/2,cy=H/2,s=Math.min(W,H),phase=u*TAU*(p.hold?4:2),seed=p.seed||0;
if(p.type==='RING'){for(let i=0;i<5;i++){const r=s*(.05+i*.07)+u*s*.16;g.beginPath();g.arc(cx+Math.sin(seed*9+i)*W*.12,cy+Math.cos(seed*7+i)*H*.08,r,phase*.12,TAU-phase*.08);g.stroke()}}
else if(p.type==='SCAN'){for(let i=0;i<7;i++){const y=(u*H*1.4+i*H/7)%H;g.fillRect(0,y,W,1+(i%2));if(i%2===0)g.fillRect((u*W*1.8+i*73)%W,0,1,H)}}
else if(p.type==='GRID'){const cells=8;for(let i=0;i<cells;i++)for(let j=0;j<cells;j++){const n=(i+j)%3;if(n===Math.floor(u*12)%3){const x=i*W/cells,y=j*H/cells;g.strokeRect(x+5,y+5,W/cells-10,H/cells-10)}}}
else if(p.type==='RAYS'){for(let i=0;i<18;i++){const a=i/18*TAU+phase*.2;const r1=s*.05,r2=s*(.18+.45*u);g.beginPath();g.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);g.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);g.stroke()}}
else if(p.type==='ORBIT'){for(let i=0;i<6;i++){const a=phase+i/6*TAU,r=s*(.11+i*.035);g.beginPath();g.arc(cx,cy,r,0,TAU);g.stroke();g.beginPath();g.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,5+i*2,0,TAU);g.fill()}}
else if(p.type==='FOLD'){for(let i=0;i<9;i++){const x=(i+1)*W/10,off=Math.sin(phase+i)*s*.06;g.beginPath();g.moveTo(x,0);g.lineTo(cx+off,cy);g.lineTo(x,H);g.stroke()}}
else if(p.type==='ECHO'){for(let i=0;i<8;i++){const d=(u+i*.09)%1,r=s*(.03+d*.46);g.globalAlpha=(1-d)*fade;g.strokeRect(cx-r,cy-r,r*2,r*2)}}
else if(p.type==='BURST'||p.type==='ACCENT'){for(let i=0;i<26;i++){const a=i/26*TAU+seed,r=s*(.04+u*.52*(.45+.55*((i%5)/5)));g.beginPath();g.moveTo(cx+Math.cos(a)*s*.03,cy+Math.sin(a)*s*.03);g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);g.stroke()}if(p.type==='ACCENT'&&u<.1){g.globalAlpha=(.1-u)*6;g.fillRect(0,0,W,H)}}
else if(p.type==='SCENE'){const r=s*(.05+u*.55);g.strokeRect(cx-r,cy-r,r*2,r*2)}
else if(p.type==='RESOLVE'){const r=s*(.28*(1-u));g.beginPath();g.arc(cx,cy,r,0,TAU);g.stroke()}
g.restore();return age<p.dur+(p.hold?1800:0)}
function frame(now){requestAnimationFrame(frame);energy+=(SCENES[scene].density-energy)*.012;bg(now);memories=memories.filter(m=>drawMemory(m,now));phrases=phrases.filter(p=>drawPhrase(p,now));const since=now-lastBeat;if(since>2500&&running){lastBeat=now;memories.push({kind:'tick',t:now,e:.08,seed:Math.random(),scene})}}requestAnimationFrame(frame);
})();
</script>
</body>
</html>
