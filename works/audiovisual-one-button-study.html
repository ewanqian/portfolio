<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070805"><title>One Button Study</title><style>:root{color-scheme:dark;--bg:#070805;--ink:#e8eadf;--dim:rgba(232,234,223,.22);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.button{position:fixed;z-index:5;left:50%;top:50%;width:clamp(118px,18vmin,188px);aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(232,234,223,.8);border-radius:50%;background:rgba(7,8,5,.12);box-shadow:0 0 0 0 rgba(232,234,223,0);cursor:pointer;touch-action:none;transition:transform 90ms ease,background 120ms ease,box-shadow 180ms ease}.button.down{transform:translate(-50%,-50%) scale(.92);background:rgba(232,234,223,.12);box-shadow:0 0 0 18px rgba(232,234,223,.035)}.tempo{position:fixed;z-index:6;right:18px;bottom:18px;width:46px;height:46px;border:1px solid var(--dim);background:rgba(7,8,5,.72);color:#e8eadf;font:10px/1 var(--mono);cursor:pointer}.tempo.on{background:#e8eadf;color:#070805}.dots{position:fixed;z-index:4;left:18px;bottom:18px;display:flex;gap:7px}.dot{width:5px;height:5px;border:1px solid rgba(232,234,223,.35)}.dot.on{width:18px;background:#e8eadf;border-color:#e8eadf}@media(max-width:600px){.tempo{right:10px;bottom:10px}.dots{left:10px;bottom:10px}}</style></head><body><canvas id="c"></canvas><button id="main" class="button" aria-label="one performance button"></button><div id="dots" class="dots" aria-hidden="true"></div><button id="tempo" class="tempo" aria-label="toggle 120 BPM accompaniment">120</button><script>(()=>{'use strict';const C=document.querySelector('#c'),g=C.getContext('2d',{alpha:false}),main=document.querySelector('#main'),tempo=document.querySelector('#tempo'),dots=document.querySelector('#dots');let W=0,H=0,dpr=1,ac=null,out=null,noise=null,state=0,downAt=0,lastTap=0,tapIntervals=[],holdRAF=0,clockOn=false,nextBeat=0,beatTimer=0,beatNo=0,events=[];for(let i=0;i<5;i++){const d=document.createElement('i');d.className='dot'+(i===0?' on':'');dots.appendChild(d)}const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function audio(){if(ac)return;ac=new (AudioContext||webkitAudioContext)();out=ac.createGain();out.gain.value=.42;out.connect(ac.destination);noise=ac.createBuffer(1,ac.sampleRate*.09,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)}async function wake(){audio();if(ac.state!=='running')await ac.resume()}function tone(freq,amp=.08,dur=.16,type='triangle',cut=5000){const t=ac.currentTime,o=ac.createOscillator(),f=ac.createBiquadFilter(),v=ac.createGain();o.type=type;o.frequency.value=freq;f.type='lowpass';f.frequency.value=cut;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(amp,t+.008);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f).connect(v).connect(out);o.start(t);o.stop(t+dur+.04)}function tick(amp=.03){const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();s.buffer=noise;f.type='bandpass';f.frequency.value=1900+beatNo%4*700;f.Q.value=5;v.gain.setValueAtTime(amp,t);v.gain.exponentialRampToValueAtTime(.0001,t+.045);s.connect(f).connect(v).connect(out);s.start(t)}function push(kind,energy=.55){events.push({kind,state,e:energy,t:performance.now(),seed:Math.random()});if(events.length>90)events.shift()}function updateDots(){[...dots.children].forEach((d,i)=>d.className='dot'+(i===state?' on':''))}function fire(interval=600){const speed=clamp(1-interval/850,.1,1);state=(state+1)%5;updateDots();const roots=[55,82.41,110,146.83,220];tone(roots[state]*(speed>.72?2:1),.055+speed*.075,.12+speed*.18,state===4?'square':'triangle',700+speed*6000);if(speed>.68)tick(.035+speed*.035);push('tap',speed)}function startHold(){cancelAnimationFrame(holdRAF);const loop=()=>{if(!downAt)return;const held=performance.now()-downAt;if(held>420&&ac){const e=clamp((held-420)/1300,.15,1);if(!events.length||performance.now()-events.at(-1).t>90){tone(41.2*(1+state*.12),.018+e*.026,.15,'sine',420+e*1700);push('hold',e)}}holdRAF=requestAnimationFrame(loop)};loop()}main.addEventListener('pointerdown',async e=>{e.preventDefault();await wake();main.setPointerCapture?.(e.pointerId);downAt=performance.now();main.classList.add('down');startHold()});main.addEventListener('pointerup',e=>{e.preventDefault();const now=performance.now(),dur=now-downAt;downAt=0;cancelAnimationFrame(holdRAF);main.classList.remove('down');if(dur>520){state=(state+2)%5;updateDots();tone(36.7*(1+state*.18),.12,.48,'sawtooth',950);push('release',1);lastTap=now;return}const interval=lastTap?now-lastTap:600;if(interval<1200)tapIntervals.push(interval);if(tapIntervals.length>4)tapIntervals.shift();fire(interval);lastTap=now});tempo.addEventListener('click',async()=>{await wake();clockOn=!clockOn;tempo.classList.toggle('on',clockOn);if(clockOn){nextBeat=ac.currentTime+.02;beatNo=0;beatTimer=setInterval(()=>{while(clockOn&&nextBeat<ac.currentTime+.08){const dt=Math.max(0,(nextBeat-ac.currentTime)*1000);setTimeout(()=>{if(clockOn){tick(beatNo%4===0?.035:.014);push('beat',beatNo%4===0?.34:.16);beatNo++}},dt);nextBeat+=.5}},25)}else{clearInterval(beatTimer)}});function draw(now){requestAnimationFrame(draw);g.fillStyle='#070805';g.fillRect(0,0,W,H);const cx=W/2,cy=H/2;for(let i=events.length-1;i>=0;i--){const q=events[i],age=(now-q.t)/1000,a=clamp(1-age/(q.kind==='hold'?1.5:2.4));if(a<=0){events.splice(i,1);continue}g.strokeStyle=`rgba(232,234,223,${a*(.14+q.e*.62)})`;g.fillStyle=`rgba(232,234,223,${a*(.18+q.e*.7)})`;g.lineWidth=.7+q.e*1.4;const p=age*(80+q.e*220),s=q.state;if(s===0){g.beginPath();g.arc(cx,cy,34+p,0,Math.PI*2);g.stroke();if(q.kind!=='beat'){g.beginPath();g.arc(cx,cy,8+p*.28,0,Math.PI*2);g.stroke()}}else if(s===1){const x=(q.seed*.7+.15)*W;g.beginPath();g.moveTo(x,cy-p);g.lineTo(x,cy+p);g.moveTo(cx-p*.8,cy);g.lineTo(cx+p*.8,cy);g.stroke()}else if(s===2){const x0=W*(.18+q.seed*.22),y0=H*(.22+(1-q.seed)*.25);g.beginPath();g.moveTo(x0,y0);g.lineTo(cx,y0);g.lineTo(cx,cy+p*.45);g.lineTo(W-x0,cy+p*.45);g.stroke();g.fillRect(cx-2,cy+p*.45-2,4,4)}else if(s===3){const z=45+p*.55;g.save();g.translate(cx,cy);g.rotate(q.seed*Math.PI*.5);g.strokeRect(-z,-z*.45,z*2,z*.9);g.strokeRect(-z*.55,-z*.82,z*1.1,z*1.64);g.restore()}else{const n=5+Math.floor(q.e*9);for(let k=0;k<n;k++){const ang=(k/n)*Math.PI*2+q.seed;g.beginPath();g.moveTo(cx+Math.cos(ang)*24,cy+Math.sin(ang)*24);g.lineTo(cx+Math.cos(ang)*(55+p),cy+Math.sin(ang)*(55+p));g.stroke()}}}if(downAt){const held=clamp((now-downAt)/1600);g.strokeStyle=`rgba(232,234,223,${.18+held*.52})`;g.lineWidth=1;const r=96+held*Math.min(W,H)*.28;g.strokeRect(cx-r,cy-r,cx?2*r:0,2*r)}}requestAnimationFrame(draw)})();</script></body></html>
