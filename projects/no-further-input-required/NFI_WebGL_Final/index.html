<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030403">
<title>无需进一步输入 / No Further Input Required — WebGL Exhibition Master</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030403}
body{overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#030403}
#gate{position:fixed;inset:0;display:grid;place-items:center;z-index:2;background:transparent;cursor:pointer}
#gate::after{content:"";width:12px;height:12px;border:2px solid rgb(211,255,72);background:#030403;box-shadow:0 0 0 1px rgba(211,255,72,.15)}
#gate.off{display:none}
#error{position:fixed;left:18px;bottom:16px;color:#ddd;background:#050505;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:7px 9px;display:none}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="gate" title="click to start audio"></div>
<div id="error"></div>
<script>
(()=>{
"use strict";
const LOOP=30.0, GRID=[45,25], BPM=128, STEPS=256, STEP_SEC=LOOP/STEPS;
const canvas=document.getElementById("stage"),gate=document.getElementById("gate"),errorEl=document.getElementById("error");
const gl=canvas.getContext("webgl2",{antialias:false,alpha:false,depth:false,stencil:false,preserveDrawingBuffer:false,powerPreference:"high-performance"});
if(!gl){errorEl.style.display="block";errorEl.textContent="WebGL2 required.";return;}
const VS=`#version 300 es
precision highp float;
out vec2 v_uv;
void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);v_uv=p;gl_Position=vec4(p*2.0-1.0,0.0,1.0);}`;
const FS=`#version 300 es
precision highp float;
precision highp int;
in vec2 v_uv;
out vec4 outColor;
uniform vec2 u_resolution;
uniform float u_time;
const vec3 BG=vec3(0.012,0.014,0.012),INK=vec3(0.92,0.925,0.89),ACC=vec3(0.79,1.0,0.22);
const ivec2 GS=ivec2(45,25);
float sat(float x){return clamp(x,0.0,1.0);}float sm(float x){x=sat(x);return x*x*(3.0-2.0*x);}float pulse(float p,float c,float w){float d=abs(p-c);d=min(d,1.0-d);return sm(1.0-d/max(w,0.0001));}
float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float level(float v){if(v<0.055)return 0.0;if(v<0.11)return 0.085;if(v<0.19)return 0.15;if(v<0.30)return 0.235;if(v<0.44)return 0.36;if(v<0.60)return 0.52;if(v<0.78)return 0.70;return 0.92;}
float cellInset(vec2 f,float pad){vec2 a=step(vec2(pad),f),b=step(f,vec2(1.0-pad));return a.x*a.y*b.x*b.y;}float tinyInset(vec2 f,float pad){return cellInset(fract(f*2.0),pad);}
bool inRect(ivec2 c,int x0,int y0,int w,int h){return c.x>=x0&&c.x<x0+w&&c.y>=y0&&c.y<y0+h;}bool onH(ivec2 c,int x0,int x1,int y){int lo=min(x0,x1),hi=max(x0,x1);return c.y==y&&c.x>=lo&&c.x<=hi;}bool onV(ivec2 c,int x,int y0,int y1){int lo=min(y0,y1),hi=max(y0,y1);return c.x==x&&c.y>=lo&&c.y<=hi;}
float routeDist(int id,ivec2 c,out float len){len=1.0;if(id==0){len=14.0;if(onH(c,6,14,5))return float(c.x-6);if(onV(c,14,5,11))return 8.0+float(c.y-5);}if(id==1){len=16.0;if(onV(c,14,11,4))return float(11-c.y);if(onH(c,14,23,4))return 7.0+float(c.x-14);}if(id==2){len=20.0;if(onH(c,23,31,4))return float(c.x-23);if(onV(c,31,4,16))return 8.0+float(c.y-4);}if(id==3){len=15.0;if(onV(c,31,16,8))return float(16-c.y);if(onH(c,31,38,8))return 8.0+float(c.x-31);}if(id==4){len=14.0;if(onH(c,38,41,8))return float(c.x-38);if(onV(c,41,8,19))return 3.0+float(c.y-8);}if(id==5){len=21.0;if(onH(c,14,31,11))return float(c.x-14);if(onV(c,31,11,15))return 17.0+float(c.y-11);}return -1.0;}
float sierpinski(ivec2 c,float reveal){int rr=c.y-3;if(rr<0||rr>18)return 0.0;int left=22-rr;int dx=c.x-left;if(dx<0||dx>rr*2||(dx&1)!=0)return 0.0;int k=dx/2;if((k&rr)!=k)return 0.0;float vertical=float(rr)/18.0;return step(vertical,reveal);}
float moduleField(ivec2 c,float p){float a=0.0;if(inRect(c,2,2,4,3))a=max(a,pulse(p,0.17,0.08));if(inRect(c,8,2,3,5))a=max(a,pulse(p,0.22,0.07));if(inRect(c,13,7,5,3))a=max(a,pulse(p,0.28,0.08));if(inRect(c,20,2,4,4))a=max(a,pulse(p,0.34,0.08));if(inRect(c,27,6,5,4))a=max(a,pulse(p,0.39,0.07));if(inRect(c,35,2,4,5))a=max(a,pulse(p,0.44,0.07));if(inRect(c,4,13,5,4))a=max(a,pulse(p,0.48,0.08));if(inRect(c,11,16,4,5))a=max(a,pulse(p,0.53,0.07));if(inRect(c,28,18,5,4))a=max(a,pulse(p,0.58,0.07));if(inRect(c,37,14,4,5))a=max(a,pulse(p,0.63,0.07));return a;}
float constraintField(ivec2 c,float build){float v=0.0;int xs[6]=int[6](5,11,18,26,34,40);int ys[4]=int[4](5,10,15,20);for(int i=0;i<6;i++)if(c.x==xs[i])v=max(v,0.12+0.28*build);for(int i=0;i<4;i++)if(c.y==ys[i])v=max(v,0.08+0.22*build);if((c.x==18&&c.y>8&&c.y<14)||(c.x==34&&c.y>3&&c.y<9)||(c.y==10&&c.x>21&&c.x<28)||(c.y==20&&c.x>7&&c.x<15))v=0.0;return v;}
float rainField(ivec2 c,float sec,float activity,out float head){float col=float(c.x);float speed=5.0+floor(hash12(vec2(col,4.2))*5.0);float offset=floor(hash12(vec2(col,9.1))*25.0);float pos=mod(floor(sec*speed)+offset,25.0);float d=pos-float(c.y);if(d<0.0)d+=25.0;float selected=step(0.52,hash12(vec2(col,1.7)));head=selected*step(d,0.1)*activity;float trail=step(d,4.1)*(1.0-d/4.2)*selected*activity;return max(head,trail*0.56);}
float memoryField(ivec2 c,float p,float recall,float autonomy){float h=hash12(vec2(c)+vec2(31.0,17.0));if(h<0.69)return 0.0;float phase=hash12(vec2(c)+vec2(5.2,12.7));float current=pulse(p,phase,0.028);float old=pulse(p,fract(phase+0.23+0.09*h),0.034);float rowFade=mix(1.0,0.26,float(c.y)/24.0);return rowFade*(current*0.22+old*(0.32+0.68*recall)+0.10*autonomy);}
float graphField(ivec2 c,float sec,out float headAccent){headAccent=0.0;float sum=0.0;float starts[6]=float[6](18.0,19.1,20.4,21.5,22.6,23.4);float dur[6]=float[6](1.8,1.9,2.1,1.8,1.8,1.5);for(int i=0;i<6;i++){float len;float d=routeDist(i,c,len);if(d<0.0)continue;float q=sat((sec-starts[i])/dur[i]);float h=q*len;float passed=step(d,h);float head=1.0-smoothstep(0.0,1.25,abs(d-h));float residual=passed*(0.12+0.24*(1.0-q));sum=max(sum,residual+head*0.68);headAccent=max(headAccent,head*step(0.01,q)*step(q,0.995));}return sum;}
float nodeField(ivec2 c,float sec,out float accent){accent=0.0;ivec2 ns[6]=ivec2[6](ivec2(6,5),ivec2(14,11),ivec2(23,4),ivec2(31,16),ivec2(38,8),ivec2(41,19));float starts[6]=float[6](18.0,19.1,20.4,21.5,22.6,23.4);float v=0.0;for(int i=0;i<6;i++){if(all(equal(c,ns[i]))){float q=sm(1.0-abs(sec-starts[i])/1.05);v=max(v,0.30+0.64*q);accent=max(accent,q);}}return v;}
void main(){vec2 frag=gl_FragCoord.xy,uv=frag/u_resolution;float aspect=u_resolution.x/u_resolution.y,target=16.0/9.0;vec2 p=uv;if(aspect>target){float s=target/aspect;p.x=(uv.x-(1.0-s)*0.5)/s;}else{float s=aspect/target;p.y=(uv.y-(1.0-s)*0.5)/s;}bool inside=all(greaterThanEqual(p,vec2(0.0)))&&all(lessThanEqual(p,vec2(1.0)));if(!inside){outColor=vec4(BG,1.0);return;}vec2 g=vec2(p.x,1.0-p.y)*vec2(GS);ivec2 c=ivec2(floor(g));vec2 f=fract(g);if(c.x<0||c.x>=GS.x||c.y<0||c.y>=GS.y){outColor=vec4(BG,1.0);return;}float sec=mod(u_time,30.0),ph=sec/30.0;float input=1.0-smoothstep(4.5,6.2,sec);float absorb=smoothstep(4.0,7.0,sec)*(1.0-smoothstep(15.0,18.0,sec));float recall=smoothstep(11.5,15.0,sec)*(1.0-smoothstep(24.5,27.0,sec));float autonomy=smoothstep(22.0,25.0,sec);float value=0.0,acc=0.0;float baseHash=hash12(vec2(c)+vec2(2.0,9.0));value=max(value,baseHash>0.92?0.085:0.035);if(c.y==2&&(c.x%3)==0)value=max(value,0.12+0.32*input);if(c.y==22&&(c.x%5)==0)value=max(value,0.08+0.18*input);float rainHead=0.0;float rain=rainField(c,sec,input+0.72*absorb,rainHead);value=max(value,rain*0.74);acc=max(acc,rainHead*0.72);value=max(value,constraintField(c,smoothstep(3.5,9.0,sec))*(1.0-0.58*smoothstep(25.0,29.0,sec)));float modules=moduleField(c,ph)*(0.34+0.66*absorb);value=max(value,modules*0.72);float mem=memoryField(c,ph,recall,autonomy);value=max(value,mem);float fractReveal=sat((sec-10.5)/5.2);float fract=sierpinski(c,fractReveal);float fractGate=smoothstep(10.2,13.4,sec)*(1.0-smoothstep(21.0,24.3,sec));float fractPulse=0.62+0.38*pulse(ph,0.55,0.12);value=max(value,fract*fractGate*fractPulse);if(fract>0.5&&fractGate>0.05){float sub=hash12(vec2(c*2)+floor(f*2.0));value=max(value,tinyInset(f,0.12)*step(0.42,sub)*fractGate*0.36);}float routeHead=0.0;float graph=graphField(c,sec,routeHead);value=max(value,graph);acc=max(acc,routeHead);float nodeAcc=0.0;value=max(value,nodeField(c,sec,nodeAcc));acc=max(acc,nodeAcc);if(sec>24.0){float autoSweep=mod(floor((sec-24.0)*7.0),45.0);if(c.x==int(autoSweep)&&hash12(vec2(c)+3.0)>0.54)value=max(value,0.34*autonomy);}float ret=smoothstep(27.0,29.6,sec);float startState=max((c.y==2&&(c.x%3)==0)?0.32:0.0,(c.y==22&&(c.x%5)==0)?0.16:0.0);value=mix(value,max(0.035,startState),ret);acc*=1.0-ret;float body=cellInset(f,0.075);float v=level(value)*body;float qmark=0.0;if(value>0.30&&hash12(vec2(c)+44.0)>0.71){vec2 sf=fract(f*2.0);qmark=cellInset(sf,0.18)*0.16;}vec3 color=BG;color+=INK*(v+qmark);color=mix(color,ACC,sat(acc)*body);float edge=min(min(p.x,p.y),min(1.0-p.x,1.0-p.y));color*=mix(0.58,1.0,smoothstep(0.0,0.045,edge));outColor=vec4(color,1.0);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||"shader compile failed");return s;}
let program;try{program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,VS));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||"program link failed");}catch(err){errorEl.style.display="block";errorEl.textContent=String(err.message||err);console.error(err);return;}
gl.useProgram(program);const uRes=gl.getUniformLocation(program,"u_resolution"),uTime=gl.getUniformLocation(program,"u_time");let visualOrigin=performance.now()/1000,paused=false,pauseAt=0,fixedReview=null;const params=new URLSearchParams(location.search);if(params.has("review"))fixedReview=Number(params.get("review"));
function resize(){const dpr=Math.min(Number(params.get("dpr"))||devicePixelRatio||1,2),w=Math.max(1,Math.floor(innerWidth*dpr)),h=Math.max(1,Math.floor(innerHeight*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}}addEventListener("resize",resize);resize();
let audio=null,master=null,compressor=null,delay=null,feedback=null,noiseBuffer=null,audioStart=0,nextStep=0,stepIndex=0,scheduler=null,muted=false;
function makeNoise(){const b=audio.createBuffer(1,audio.sampleRate*1.2,audio.sampleRate),d=b.getChannelData(0);let z=0;for(let i=0;i<d.length;i++){z=z*0.985+(Math.random()*2-1)*0.12;d[i]=z;}return b;}
function env(time,attack,hold,release,peak){const g=audio.createGain();g.gain.setValueAtTime(0.0001,time);g.gain.exponentialRampToValueAtTime(Math.max(0.001,peak),time+attack);g.gain.setValueAtTime(Math.max(0.001,peak),time+attack+hold);g.gain.exponentialRampToValueAtTime(0.0001,time+attack+hold+release);return g;}
function tone(time,freq,dur,opt={}){if(!audio||muted)return;const o=audio.createOscillator(),f=audio.createBiquadFilter(),g=env(time,opt.attack??0.004,opt.hold??dur*0.16,opt.release??dur*0.78,opt.peak??0.06);o.type=opt.type||"triangle";o.frequency.setValueAtTime(freq,time);if(opt.slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*opt.slide),time+dur);f.type=opt.filter||"lowpass";f.frequency.setValueAtTime(opt.cutoff||1800,time);f.Q.value=opt.q||0.7;o.connect(f).connect(g).connect(master);if(opt.delay)g.connect(delay);o.start(time);o.stop(time+dur+0.8);}
function noise(time,dur,opt={}){if(!audio||muted)return;const s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=env(time,opt.attack??0.002,opt.hold??dur*0.08,opt.release??dur*0.88,opt.peak??0.035);s.buffer=noiseBuffer;f.type=opt.filter||"bandpass";f.frequency.value=opt.freq||3200;f.Q.value=opt.q||1.4;s.connect(f).connect(g).connect(master);if(opt.delay)g.connect(delay);s.start(time);s.stop(time+dur+0.5);}
function kick(time,peak=0.12){if(!audio||muted)return;const o=audio.createOscillator(),g=audio.createGain();o.type="sine";o.frequency.setValueAtTime(92,time);o.frequency.exponentialRampToValueAtTime(38,time+0.11);g.gain.setValueAtTime(peak,time);g.gain.exponentialRampToValueAtTime(0.0001,time+0.34);o.connect(g).connect(master);o.start(time);o.stop(time+0.38);}
function metal(time,note,peak=0.035){if(!audio||muted)return;const carrier=audio.createOscillator(),mod=audio.createOscillator(),modGain=audio.createGain(),filt=audio.createBiquadFilter(),g=env(time,0.002,0.015,0.34,peak);carrier.type="sine";mod.type="sine";const f=55*Math.pow(2,note/12);carrier.frequency.value=f*4;mod.frequency.value=f*7.1;modGain.gain.value=f*1.8;mod.connect(modGain).connect(carrier.frequency);filt.type="bandpass";filt.frequency.value=Math.min(7000,f*5);filt.Q.value=2.2;carrier.connect(filt).connect(g).connect(master);g.connect(delay);carrier.start(time);mod.start(time);carrier.stop(time+0.55);mod.stop(time+0.55);}
function scheduleStep(s,time){const bar16=s%16;if(s<44){if(bar16===0)kick(time,0.09);if(bar16===10)noise(time,0.045,{freq:5200,peak:0.018});if(s%32===20)tone(time,73.42,0.5,{type:"sine",cutoff:460,peak:0.025,slide:0.82,delay:true});}if(s>=44&&s<96){const p=s%8;if(p===0||p===3||p===6)tone(time,p===6?146.83:110.0,0.13,{type:"triangle",cutoff:1250,peak:p===0?0.055:0.035});if(s%16===0)kick(time,0.10);if(s%4===2)noise(time,0.035,{freq:6100,peak:0.013});}if(s>=96&&s<156){const row=(s-96)%16,k=(Math.floor((s-96)/4))%16;if((k&row)===k){const scale=[0,3,5,7,10,12],note=scale[(row+k)%scale.length];tone(time,146.83*Math.pow(2,note/12),0.23,{type:"triangle",cutoff:2400,peak:0.038,delay:true});}if(s%16===0)kick(time,0.075);if(s%8===5)noise(time,0.06,{freq:4200,peak:0.014,delay:true});}if(s>=156&&s<214){const nodeSteps=[156,166,177,188,198,206],notes=[0,7,10,14,17,22];for(let i=0;i<nodeSteps.length;i++)if(s===nodeSteps[i]){metal(time,notes[i],0.042+i*0.002);kick(time,0.055);}if(s%8===0)tone(time,55,0.42,{type:"sine",cutoff:320,peak:0.028,slide:0.92});if((s%8===3)||(s%8===6))noise(time,0.04,{freq:6900,peak:0.011});}if(s>=214){if(s%16===0)tone(time,55,0.7,{type:"sine",cutoff:360,peak:0.022,slide:0.74,delay:true});if(s===224||s===240)metal(time,s===224?10:5,0.024);if(s%32===28)noise(time,0.12,{filter:"highpass",freq:5000,peak:0.012,delay:true});}}
function scheduleAudio(){if(!audio)return;const horizon=audio.currentTime+0.16;while(nextStep<horizon){scheduleStep(stepIndex%STEPS,nextStep);stepIndex++;nextStep+=STEP_SEC;}}
async function startAudio(reset=true){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=0.52;compressor=audio.createDynamicsCompressor();compressor.threshold.value=-11;compressor.knee.value=12;compressor.ratio.value=5;compressor.attack.value=0.005;compressor.release.value=0.18;delay=audio.createDelay(1.0);delay.delayTime.value=STEP_SEC*6;feedback=audio.createGain();feedback.gain.value=0.22;delay.connect(feedback).connect(delay);master.connect(compressor).connect(audio.destination);master.connect(delay).connect(compressor);noiseBuffer=makeNoise();[36.71,55.0].forEach((freq,i)=>{const o=audio.createOscillator(),f=audio.createBiquadFilter(),g=audio.createGain();o.type=i?"triangle":"sine";o.frequency.value=freq;f.type="lowpass";f.frequency.value=i?230:160;f.Q.value=0.5;g.gain.value=i?0.012:0.020;o.connect(f).connect(g).connect(master);o.start();});}if(audio.state==="suspended")await audio.resume();if(reset)resetTransport();if(!scheduler)scheduler=setInterval(scheduleAudio,25);}
function resetTransport(){visualOrigin=performance.now()/1000;if(audio){audioStart=audio.currentTime+0.07;nextStep=audioStart;stepIndex=0;}}
gate.addEventListener("pointerdown",async()=>{gate.classList.add("off");await startAudio(true);canvas.style.cursor="none";});canvas.addEventListener("pointerdown",async()=>{if(audio&&audio.state==="suspended")await audio.resume();});
function currentTime(now){if(fixedReview!==null&&Number.isFinite(fixedReview))return fixedReview;if(paused)return pauseAt;if(audio&&audio.state==="running")return Math.max(0,audio.currentTime-audioStart);return now-visualOrigin;}
function render(ms){resize();const now=ms/1000,t=currentTime(now);gl.useProgram(program);gl.uniform2f(uRes,canvas.width,canvas.height);gl.uniform1f(uTime,t);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(render);}requestAnimationFrame(render);
addEventListener("keydown",async e=>{if(e.key==="f"||e.key==="F"){if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.();else await document.exitFullscreen?.();}else if(e.key==="r"||e.key==="R"){resetTransport();}else if(e.key==="m"||e.key==="M"){muted=!muted;if(master)master.gain.setTargetAtTime(muted?0:0.52,audio.currentTime,0.03);}else if(e.key===" "){e.preventDefault();if(!paused){pauseAt=currentTime(performance.now()/1000);paused=true;if(audio)audio.suspend();}else{paused=false;if(audio){await audio.resume();audioStart=audio.currentTime-pauseAt;nextStep=audio.currentTime+0.05;stepIndex=Math.floor((pauseAt%LOOP)/STEP_SEC);}else visualOrigin=performance.now()/1000-pauseAt;}}});
})();
</script>
