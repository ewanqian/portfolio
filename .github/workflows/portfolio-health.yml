name: Portfolio OS graph health

on:
  push:
    branches: [main]
    paths:
      - "database/works.json"
      - "database/canonical_names.json"
      - "content/project-registry-2026-11.json"
      - "content/cv-records-2026-11.json"
      - "works/**"
      - "database/evidence-reconciliation-2026-11.json"
      - "database/media-publication-register-2026-11.json"
      - "scripts/audit-media-publication.mjs"
      - "assets/**"
      - "database/archive-preservation-checks.json"
      - "scripts/audit-archive-preservation.mjs"
      - "scripts/audit-external-evidence.mjs"
      - "scripts/audit-portfolio-graph.mjs"
      - "scripts/audit-cv-publication.mjs"
      - "scripts/audit-cv-data.mjs"
      - "scripts/build-cv-publication.mjs"
      - "content/cv-selection.json"
      - "docs/cv-publication/**"
      - "scripts/build-project-record-pages.mjs"
      - "scripts/build-cv-project-links.mjs"
      - "scripts/build-portfolio-sitemap.mjs"
      - "sitemap.xml"
      - ".github/workflows/portfolio-health.yml"
  pull_request:
    branches: [main]
    paths:
      - "database/**"
      - "content/**"
      - "works/**"
      - "scripts/audit-portfolio-graph.mjs"
      - "scripts/audit-archive-preservation.mjs"
      - "scripts/audit-external-evidence.mjs"
      - "scripts/build-project-record-pages.mjs"
      - "scripts/build-cv-project-links.mjs"
      - "scripts/build-portfolio-sitemap.mjs"
      - "sitemap.xml"
      - ".github/workflows/portfolio-health.yml"
  schedule:
    - cron: "13 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit ID, CV, project, evidence and media relations
        run: node scripts/audit-portfolio-graph.mjs
      - name: Check project image identity and media credits
        run: node scripts/audit-media-publication.mjs
      - name: Save media identity and rights report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-media-integrity
          path: reports/portfolio-media-integrity.json
          if-no-files-found: warn
          retention-days: 60
      - name: Check shared bilingual selection and PDF source hashes
        run: node scripts/audit-cv-data.mjs
      - name: Check public CV release and bilingual PDF links
        run: node scripts/audit-cv-publication.mjs
      - name: Save CV publication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-publication-integrity
          path: reports/cv-release-integrity.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce no-loss legacy archive and video link requirements
        run: node scripts/audit-archive-preservation.mjs
      - name: Save archive preservation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-archive-preservation
          path: reports/archive-preservation.json
          if-no-files-found: warn
          retention-days: 30
      - name: Save full findings (never auto-edit source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-health-report
          path: reports/portfolio-health.json
          if-no-files-found: warn
          retention-days: 30
      - name: Check live canonical site and CV record links (scheduled / on-demand)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/audit-portfolio-live.mjs
      - name: Check external reference URL reachability (scheduled / on-demand)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/audit-external-evidence.mjs
      - name: Save external reference reachability report
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-external-source-health
          path: reports/external-evidence-health.json
          if-no-files-found: warn
          retention-days: 30
      - name: Save live public URL probe results
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-live-health-report
          path: reports/portfolio-live-health.json
          if-no-files-found: warn
          retention-days: 30
