name: Portfolio OS — public site QA

on:
  workflow_run:
    workflows:
      - "pages build and deployment"
      - "pages-build-deployment"
      - "Publish React homepage to GitHub Pages root"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-public-site-qa
  cancel-in-progress: true

jobs:
  live-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate actual public URLs and returned project identity
        run: node scripts/audit-portfolio-live.mjs
      - name: Attach inspectable verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-postdeploy-http-qa
          path: reports/portfolio-live-health.json
          if-no-files-found: warn
          retention-days: 60
