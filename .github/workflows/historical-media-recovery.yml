name: Historical original-media recovery
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/audit-historical-media.py
      - .github/workflows/historical-media-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect all fetched Git history without changing published files
        run: python scripts/audit-historical-media.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-timer-dropflow-original-history
          path: qa-artifacts/media-recovery/
          retention-days: 30
          if-no-files-found: error
