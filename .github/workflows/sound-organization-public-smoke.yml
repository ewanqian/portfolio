name: Sound Organization public reader smoke
on:
  push:
    branches: [main]
    paths:
      - 'sound-organization/**'
      - '.github/workflows/sound-organization-public-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose live paths
        shell: bash
        run: |
          set -u
          for url in \
            'https://ewanqian.site/sound-organization/' \
            'https://ewanqian.site/sound-organization/index.html' \
            'https://ewanqian.site/sound-organization/knowledge.html' \
            'https://ewanqian.github.io/portfolio/sound-organization/' \
            'https://ewanqian.site/'; do
            echo "::group::$url"
            code=$(curl --max-time 15 --location --silent --show-error -o /tmp/sound-book-response -w '%{http_code} %{url_effective} %{content_type}' "$url") || true
            echo "status = $code"
            echo "bytes = $(wc -c < /tmp/sound-book-response 2>/dev/null || echo 0)"
            head -c 180 /tmp/sound-book-response 2>/dev/null || true
            echo
            echo "::endgroup::"
          done
