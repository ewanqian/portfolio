name: TITAN original-media acceptance
on:
  pull_request:
    branches: [main]
    paths: ["assets/kashiwa-titan/**", "assets/data/titan-tracks.json", "works/titan*.html", "react/src/components/sections/TitanTracks*", "react/src/pages/KashiwaTitan.jsx", "scripts/audit-titan-originals.py", "scripts/build-cv-project-links.mjs", "scripts/qa-titan*.mjs", ".github/workflows/titan-track-qa.yml"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish React homepage to GitHub Pages root"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      QA_PLAYWRIGHT: /tmp/titan-browser/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check originals, generate CV media and build site
        run: |
          python3 scripts/audit-titan-originals.py
          npm ci
          npm ci --prefix react
          node scripts/build-cv-project-links.mjs
          npm run build --prefix react
          npm run audit:preservation
          npm run audit:graph
          npm install --prefix /tmp/titan-browser --no-save --package-lock=false playwright@1.64.1
          /tmp/titan-browser/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Verify galleries and CV image links
        run: |
          python3 -m http.server 4175 --bind 127.0.0.1 --directory react/dist > /tmp/titan-preview.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4175/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-titan-tracks.mjs
          node scripts/qa-titan-cv-media.mjs
      - name: Verify actual production after publisher
        if: github.event_name == 'workflow_run'
        env:
          QA_ORIGIN: https://ewanqian.site
        run: |
          node scripts/qa-titan-tracks.mjs
          node scripts/qa-titan-cv-media.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-original-gallery-review
          path: qa-artifacts/titan-gallery/
          if-no-files-found: warn
