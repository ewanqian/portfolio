<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>NIULAI TAP / 牛来 Tap</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="mode-core">
  <main class="instrument" id="instrument">
    <header class="topbar">
      <div>
        <p class="eyebrow">PERSONAL A/V INSTRUMENT · DEMO 001</p>
        <h1>NIULAI TAP <span>/ 牛来 Tap</span></h1>
      </div>
      <div class="status">
        <span id="modeLabel">NIULAI CORE</span>
        <span><b id="bpmLabel">128</b> BPM</span>
        <button id="soundButton" type="button">START AUDIO</button>
      </div>
    </header>

    <section class="stage" aria-label="visual stage">
      <canvas id="stageCanvas"></canvas>
      <div class="grain" aria-hidden="true"></div>
      <div class="word-layer" id="wordLayer" aria-live="polite"></div>
      <div class="center-mark" aria-hidden="true">
        <div class="orb"></div>
        <div class="cross"></div>
      </div>
      <div class="stage-copy">
        <p id="modeTitle">牛来 CORE</p>
        <span id="modeHint">按 A–Z 演奏 · TAB 切换模式 · ESC 重置</span>
      </div>
    </section>

    <section class="keyboard-wrap">
      <div class="keyboard" id="keyboard" aria-label="26 key audiovisual keyboard"></div>
    </section>

    <footer>
      <p><strong>PLAY FIRST.</strong> 一个键同时触发声音与视觉；连续按会提高系统能量。</p>
      <p class="fine">Fan-made workshop prototype · browser-generated voice / procedural audio only · no film audio included.</p>
    </footer>
  </main>

  <script src="./app.js"></script>
</body>
</html>
