<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>NIULAI TAP v0.3 / 出音牛来</title>
<style>
:root{--bg:#0a0c09;--fg:#f4f0df;--muted:#9da08f;--accent:#a8e95a;--accent2:#f0c954;--panel:#11150f;--line:#2b3327}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.chuyin{--bg:#05070b;--fg:#ebffff;--muted:#83a9aa;--accent:#55f0dc;--accent2:#ff62cd;--panel:#071116;--line:#1d3b3e}.app{width:min(1280px,calc(100% - 20px));margin:auto;padding:16px 0 28px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:4px 2px 12px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--accent);font-weight:900}.title{margin:5px 0 0;font-size:clamp(28px,5vw,58px);line-height:.95;letter-spacing:-.05em}.title span{font-size:.36em;color:var(--muted);font-weight:600;letter-spacing:.02em}.status{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px}.pill,.btn{font-size:10px;letter-spacing:.07em;padding:8px 10px;border:1px solid var(--line);background:transparent;color:var(--fg)}.btn{background:var(--accent);color:#071006;border:0;font-weight:900;cursor:pointer}.stage{position:relative;height:min(61vh,640px);min-height:400px;margin-top:12px;border:1px solid var(--line);overflow:hidden;background:radial-gradient(circle at 50% 46%,rgba(168,233,90,.12),transparent 30%),linear-gradient(180deg,#0e120d,var(--bg));isolation:isolate}body.chuyin .stage{background:radial-gradient(circle at 50% 44%,rgba(85,240,220,.14),transparent 27%),linear-gradient(180deg,#061119,#030507)}body.chuyin .stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,transparent 0 4px,rgba(85,240,220,.07) 5px 6px);mix-blend-mode:screen}.stage canvas{position:absolute;inset:0;width:100%;height:100%}.center{position:absolute;left:50%;top:50%;width:132px;height:132px;transform:translate(-50%,-50%);border:1px solid var(--accent);border-radius:50%;box-shadow:0 0 60px color-mix(in srgb,var(--accent) 18%,transparent);transition:.1s}.stage.active .center{transform:translate(-50%,-50%) scale(1.17);background:color-mix(in srgb,var(--accent) 8%,transparent)}.center:before,.center:after{content:"";position:absolute;background:var(--accent);opacity:.42}.center:before{width:1px;height:100%;left:50%}.center:after{height:1px;width:100%;top:50%}.words{position:absolute;inset:0;pointer-events:none}.word{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%) rotate(var(--r)) scale(.15);font-weight:1000;font-size:clamp(44px,10vw,148px);letter-spacing:-.08em;white-space:nowrap;text-shadow:0 0 28px color-mix(in srgb,var(--accent) 44%,transparent);animation:pop var(--life) cubic-bezier(.16,.86,.25,1) forwards}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scale(.12);filter:blur(8px)}14%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(1.04);filter:blur(0)}72%{opacity:.94}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(calc(var(--r) + 7deg)) scale(1.34);filter:blur(1px)}}.caption{position:absolute;left:15px;bottom:13px;z-index:3}.caption strong{display:block;font-size:13px;letter-spacing:.14em;color:var(--accent)}.caption span{display:block;margin-top:4px;font-size:11px;color:var(--muted)}.keys{display:grid;grid-template-columns:repeat(10,minmax(48px,1fr));gap:7px;margin-top:11px;padding:11px;border:1px solid var(--line);background:var(--panel)}.key{min-height:64px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,#fff 3%);color:var(--fg);cursor:pointer;user-select:none;touch-action:none;transition:.07s}.key strong{font-size:18px}.key span{font-size:10px;color:var(--muted)}.key.on{transform:translateY(3px) scale(.985);background:var(--accent);color:#071006;border-color:transparent}.key.on span{color:#1b351c}.footer{display:flex;justify-content:space-between;gap:16px;margin-top:10px;color:var(--muted);font-size:11px}.footer b{color:var(--fg)}@media(max-width:850px){.top{align-items:flex-start;flex-direction:column}.status{justify-content:flex-start}.keys{grid-template-columns:repeat(7,minmax(42px,1fr))}.stage{height:54vh}.footer{flex-direction:column}}@media(max-width:560px){.app{width:calc(100% - 12px)}.keys{grid-template-columns:repeat(5,minmax(42px,1fr));padding:7px}.key{min-height:58px}.stage{min-height:350px}}
</style>
</head>
<body>
<main class="app">
<header class="top">
<div><div class="eyebrow">PERSONAL A/V INSTRUMENT · FIXED FORMANT VOICE v0.3</div><h1 class="title">NIULAI TAP <span>/ 牛来 Tap</span></h1></div>
<div class="status"><span class="pill" id="modeLabel">NIULAI CORE</span><span class="pill"><b id="bpm">128</b> BPM</span><span class="pill">VOICE · FIXED WEB SYNTH</span><button class="btn" id="audioBtn">START AUDIO</button></div>
</header>
<section class="stage" id="stage"><canvas id="cv"></canvas><div class="words" id="words"></div><div class="center"></div><div class="caption"><strong id="modeTitle">牛来 CORE</strong><span id="hint">Q/W = 牛/来 · A/S/G/L = Beat/Bass/Chord · TAB = 出音牛来 · SPACE = Drop · ESC = Reset</span></div></section>
<section class="keys" id="keys"></section>
<div class="footer"><span><b>PLAY FIRST.</b> 先试 Q → QQ → QQQ，再加 A / S / G / L。</span><span>v0.3 不使用系统 TTS：人声由固定 Formant Web Synth 合成，各设备音色更一致。</span></div>
</main>
<script>
const ORDER='QWERTYUIOPASDFGHJKLZXCVBNM'.split('');
const CFG={
 core:{title:'牛来 CORE',label:'NIULAI CORE',bpm:128,base:118,labels:{Q:'牛',W:'来',E:'牛来',R:'欢迎',T:'我的孩子',Y:'不一样',U:'一样',I:'勇敢',O:'将来',P:'今天',A:'KICK',S:'SNARE',D:'HAT',F:'CLAP',G:'BASS',H:'BASS+',J:'BELL',K:'PAD',L:'CHORD',Z:'哞',X:'咚',C:'哒',V:'啪',B:'啵',N:'长大',M:'DROP'}},
 chuyin:{title:'出音牛来',label:'CHUYIN NIULAI',bpm:150,base:196,labels:{Q:'NIU',W:'LAI',E:'NIULAI',R:'WELCOME',T:'MY CHILD',Y:'DIFFERENT',U:'SAME',I:'BRAVE',O:'FUTURE',P:'TODAY',A:'KICK+',S:'SNARE+',D:'HAT+',F:'CLAP+',G:'BASS',H:'ARP',J:'BELL',K:'PAD',L:'CHORD',Z:'NI!',X:'LA!',C:'DONG!',V:'PA!',B:'POP!',N:'GROW',M:'DROP!'}}
};
const FORMANTS={i:[270,2290,3010],a:[730,1090,2440],u:[300,870,2240],o:[570,840,2410],e:[530,1840,2480]};
const VOICE_PATTERNS={Q:['i','u'],W:['a','i'],E:['i','u','a','i'],R:['u','a','i'],T:['a','i','u'],Y:['i','a'],U:['i','a'],I:['a','i'],O:['a','u'],P:['i','a'],N:['a','u']};
let mode='core',ac=null,master=null,compressor=null,energy=0,last={},chains={},down={},holdTimers={};
const $=s=>document.querySelector(s),stage=$('#stage'),keys=$('#keys'),words=$('#words'),cv=$('#cv'),ctx=cv.getContext('2d');
const particles=[];
function ensureAudio(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();compressor=ac.createDynamicsCompressor();master.gain.value=.62;master.connect(compressor).connect(ac.destination)}if(ac.state==='suspended')ac.resume();$('#audioBtn').textContent='AUDIO ON'}
function env(g,t,d,peak=.12){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,peak),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d)}
function osc(type,f,d=.16,gain=.08,start=0){ensureAudio();const t=ac.currentTime+start,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;env(g,t,d,gain);o.connect(g).connect(master);o.start(t);o.stop(t+d+.04)}
function noise(d=.1,gain=.1,hp=1200,start=0){ensureAudio();const t=ac.currentTime+start,n=Math.max(1,Math.floor(ac.sampleRate*d)),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;env(g,t,d,gain);s.connect(f).connect(g).connect(master);s.start(t)}
function vowel(v,f0,start,d,gain=.055,bright=1){ensureAudio();const t=ac.currentTime+start,o=ac.createOscillator(),srcGain=ac.createGain(),sum=ac.createGain(),lfo=ac.createOscillator(),lfoG=ac.createGain();o.type=mode==='chuyin'?'sawtooth':'triangle';o.frequency.value=f0;lfo.frequency.value=5.2;lfoG.gain.value=mode==='chuyin'?5:2.5;lfo.connect(lfoG).connect(o.frequency);srcGain.gain.value=.5;o.connect(srcGain);FORMANTS[v].forEach((freq,i)=>{const bp=ac.createBiquadFilter(),g=ac.createGain();bp.type='bandpass';bp.frequency.value=freq*(mode==='chuyin'?1.08:1);bp.Q.value=9-i*1.5;g.gain.value=(gain/(i+1))*bright;srcGain.connect(bp).connect(g).connect(sum)});env(sum,t,d,gain*1.8);sum.connect(master);o.start(t);lfo.start(t);o.stop(t+d+.03);lfo.stop(t+d+.03)}
function vocalKey(k,c=1,hold=false){const patt=VOICE_PATTERNS[k]||['a'];const base=CFG[mode].base*Math.pow(2,Math.min(c-1,4)*.55/12);const seg=hold?.28:(mode==='chuyin'?.085:.11);patt.forEach((v,i)=>vowel(v,base*(1+(i%2)*.018),i*seg*.78,hold?.34:seg,.06,1+Math.min(c-1,4)*.1));if(mode==='chuyin')osc('square',base*2,.08,.012,0)}
function kick(){ensureAudio();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(mode==='chuyin'?155:122,t);o.frequency.exponentialRampToValueAtTime(42,t+.16);env(g,t,.18,.34);o.connect(g).connect(master);o.start(t);o.stop(t+.21)}
function snare(){noise(.14,.15,1300);osc('triangle',170,.07,.045)}
function hat(){noise(.05,.07,6200)}
function clap(){noise(.04,.085,1500);setTimeout(()=>noise(.04,.05,1800),34)}
function bass(f=55){osc('sawtooth',f,.24,.075);osc('sine',f/2,.28,.07)}
function bell(f=660){osc('sine',f,.52,.06);osc('sine',f*2.01,.34,.02)}
function pad(root=110){[0,7,12].forEach((s,i)=>osc('sine',root*Math.pow(2,s/12),.82,.023,i*.012))}
function chord(root=196){[0,3,7,10].forEach((s,i)=>osc('triangle',root*Math.pow(2,s/12),.45,.028,i*.006))}
function fxSweep(down=false){ensureAudio();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(down?900:70,t);o.frequency.exponentialRampToValueAtTime(down?70:1300,t+.22);env(g,t,.24,.055);o.connect(g).connect(master);o.start(t);o.stop(t+.26)}
function sound(k,c){if('QWERTYUIOP'.includes(k)){vocalKey(k,c,false);return}switch(k){case'A':kick();break;case'S':snare();break;case'D':hat();break;case'F':clap();break;case'G':bass(mode==='chuyin'?65.4:55);break;case'H':bass(mode==='chuyin'?82.4:73.4);break;case'J':bell(mode==='chuyin'?880:660);break;case'K':pad(mode==='chuyin'?130.8:110);break;case'L':chord(mode==='chuyin'?261.6:196);break;case'Z':vowel('o',mode==='chuyin'?155:82,0,.38,.065);break;case'X':osc('sine',118,.08,.09);break;case'C':osc('triangle',260,.075,.075);break;case'V':noise(.035,.1,450);break;case'B':osc('sine',760,.09,.065);break;case'N':vocalKey('N',c,false);fxSweep(true);break;case'M':kick();snare();bass(43.7);fxSweep(false);break}}
function count(k){const n=performance.now();chains[k]=n-(last[k]||0)<285?Math.min((chains[k]||1)+1,6):1;last[k]=n;return chains[k]}
function label(k,c){let t=CFG[mode].labels[k];if(k==='Q'&&c>1)t=mode==='chuyin'?'NIU '.repeat(Math.min(c,4)).trim():'牛'.repeat(Math.min(c,5));if(k==='W'&&c>1)t=mode==='chuyin'?'LAI '.repeat(Math.min(c,4)).trim():'来'.repeat(Math.min(c,5));return t}
function spawnWord(t,c=1){const e=document.createElement('div');e.className='word';e.textContent=t;e.style.setProperty('--x',(18+Math.random()*64)+'%');e.style.setProperty('--y',(18+Math.random()*58)+'%');e.style.setProperty('--dx',((Math.random()-.5)*120)+'px');e.style.setProperty('--dy',(-35-Math.random()*90)+'px');e.style.setProperty('--r',((Math.random()-.5)*(mode==='chuyin'?18:7))+'deg');e.style.setProperty('--life',Math.max(.55,1.65-c*.1)+'s');words.appendChild(e);setTimeout(()=>e.remove(),2200)}
function burst(k,c){const r=cv.getBoundingClientRect(),cols=mode==='chuyin'?['#eaffff','#55f0dc','#ff62cd','#7b73ff']:['#f4f0df','#a8e95a','#f0c954','#78964e'];for(let i=0;i<Math.min(9+c*4+energy*8,42);i++)particles.push({x:r.width*(.25+Math.random()*.5),y:r.height*(.24+Math.random()*.52),vx:(Math.random()-.5)*(4+energy*7),vy:(Math.random()-.5)*(4+energy*7),life:1,d:.012+Math.random()*.018,s:2+Math.random()*(mode==='chuyin'?12:24),c:cols[(k.charCodeAt(0)+i)%cols.length]});if(particles.length>320)particles.splice(0,particles.length-320)}
function trigger(k){if(!ORDER.includes(k))return;ensureAudio();const c=count(k);energy=Math.min(1,energy+.12+c*.035);stage.classList.add('active');const el=document.querySelector(`[data-key="${k}"]`);if(el)el.classList.add('on');spawnWord(label(k,c),c);burst(k,c);sound(k,c);down[k]=performance.now();clearTimeout(holdTimers[k]);holdTimers[k]=setTimeout(()=>{if(down[k]){spawnWord(label(k,c)+(mode==='chuyin'?' — HOLD':' ——'),c+1);if('QWERTYUIOPN'.includes(k))vocalKey(k,c,true);energy=Math.min(1,energy+.18)}},420)}
function release(k){delete down[k];clearTimeout(holdTimers[k]);const el=document.querySelector(`[data-key="${k}"]`);if(el)el.classList.remove('on');if(!document.querySelector('.key.on'))stage.classList.remove('active')}
function drop(){ensureAudio();kick();setTimeout(kick,120);bass(43.7);fxSweep(false);energy=1;spawnWord(mode==='chuyin'?'CHUYIN DROP!':'牛来!',4);ORDER.slice(0,10).forEach((k,i)=>setTimeout(()=>burst(k,4),i*24))}
function reset(){energy=0;particles.splice(0);words.innerHTML='';ORDER.forEach(release);stage.classList.remove('active')}
function setMode(next){mode=next;document.body.classList.toggle('chuyin',mode==='chuyin');$('#modeLabel').textContent=CFG[mode].label;$('#modeTitle').textContent=CFG[mode].title;$('#bpm').textContent=CFG[mode].bpm;renderKeys();reset();spawnWord(CFG[mode].title,2)}
function renderKeys(){keys.innerHTML='';ORDER.forEach(k=>{const b=document.createElement('button');b.className='key';b.dataset.key=k;b.innerHTML=`<strong>${k}</strong><span>${CFG[mode].labels[k]}</span>`;b.onpointerdown=e=>{e.preventDefault();trigger(k)};b.onpointerup=e=>{e.preventDefault();release(k)};b.onpointerleave=()=>release(k);keys.appendChild(b)})}
window.addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toUpperCase();if(ORDER.includes(k)){e.preventDefault();trigger(k)}else if(e.key==='Tab'){e.preventDefault();setMode(mode==='core'?'chuyin':'core')}else if(e.code==='Space'){e.preventDefault();drop()}else if(e.key==='Escape'){reset()}});
window.addEventListener('keyup',e=>{const k=e.key.toUpperCase();if(ORDER.includes(k))release(k)});
$('#audioBtn').onclick=()=>{ensureAudio();spawnWord('AUDIO ON',1)};
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=Math.floor(r.width*d);cv.height=Math.floor(r.height*d);ctx.setTransform(d,0,0,d,0,0)}
function draw(){const r=cv.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.globalCompositeOperation='lighter';for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy*=.985;p.life-=p.d;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;if(mode==='chuyin')ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);else{ctx.beginPath();ctx.arc(p.x,p.y,p.s/2,0,Math.PI*2);ctx.fill()}if(p.life<=0)particles.splice(i,1)}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';energy*=.992;requestAnimationFrame(draw)}
window.addEventListener('resize',resize);renderKeys();resize();draw();
</script>
</body>
</html>
